          "@type": "Question",
          "name": "How do I test my vocal range?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sing a comfortable siren glide from low to high and back down. MercuryPitch measures sustained notes from both glides and reports the lowest and highest notes that were heard reliably."

          "@type": "Question",
          "name": "Does vocal range determine my voice type?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Not by itself. MercuryPitch shows the broad voice band that overlaps your measured range most, but voice type also depends on comfortable tessitura, tone and training. Treat the label as a guide, not a verdict."
          }
        },

          "@type": "Question",
          "name": "Is this vocal range test free?",
          "acceptedAnswer": {
            "@type": "Answer",
