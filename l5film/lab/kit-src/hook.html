<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Kit lab: the hook's frame (S1g) against HANDOFFS § Carried (Lesson 4's S15 tease frame on the same
         pixels) and LAB-CHECKS 7. 0 to 3 s the pull from F-cold end to F-hook (sine.inOut, film 31.40 to
         34.40) with the chart's marks leaving over it (0 to 1.6 s) and '"support"' landing at baseline 406 at
         1.47 s (film 32.87), easing to 420 by 3.0; 3.0 to 3.4 s the head bead fades in at world (400, 400);
         "what keeps it steady?" lands at 3.2; 3.4 is the hook's last frame; 3.6 to 4.15 s through the head
         bead to F-bead (power3.in), its glow growing from 3.7 into the full-frame field (screen space, dithered,
         breathing). Merc's long note keeps 4 px on screen (4 / s world px). The field's exit onto the title:
         kit-title. -->
    <div id="kit-hook" data-composition-id="kit-hook" data-start="0" data-duration="4.4" data-width="1920" data-height="1080">
      <div class="scene" id="kit-hook-root"></div>
      <script>
        ;(function () {
          const ID = 'kit-hook', D = 4.4
          const C = L.C
          const root = document.getElementById(ID + '-root')
          const room = L.room(root, {})
          const world = L.stage(room.mid), hud = L.stage(room.hud)
          L.text(hud, 'kit-hook: the hook’s last frame at F-hook (3.4 s)', { x: 24, y: 1060, size: 20, family: 'mono', weight: 500, fill: C.ink2, opacity: 1 })
          const ch = L.bandChart(world, L.CHART.S1)
          const bead = ch.bead(30.8)
          const top = L.stage(room.top)
          const glow = L.field(top, 'hook-glow')                 // screen space: its grain is the frame's pixels
          const sup = L.text(hud, '“support”', { x: 960, y: 406, size: 160, family: 'serif', anchor: 'middle' })
          const st = L.text(hud, 'what keeps it steady?', { x: 960, y: 680, size: 96, family: 'serif', anchor: 'middle' })
          const cam = L.frameRig(room, { from: 'F-cold end' })
          cam.to(0, 3.0, 'F-hook', 'sine.inOut')
          cam.to(3.6, 0.55, 'F-bead', 'power3.in')

          const tl = gsap.timeline({ paused: true })
          L.clock(tl, D, (t) => {
            cam.apply(t)
            const marks = 1 - L.prog(t, 0, 1.6)
            // Merc's long note at Lesson 4's weight on screen, 4 px, whatever the framing (the lead's answer 4)
            ch.draw({ band: { a: marks }, merc: { w: 4 / cam.scale(t) }, lines: [{ id: 'e', contour: 'easy', t: 4, a: marks }], strip: { a: marks, envs: [{ id: 'e', contour: 'easy', t: 4 }] } })
            L.bead4.place(bead, { x: 400, y: 400, a: L.prog(t, 3.0, 0.4), scale: 1 })
            const [gx, gy] = cam.map(400, 400, t)
            const gr = cam.scale(t) * L.lerp(30, 700, L.prog(t, 3.7, 0.45, 'power2.in'))
            glow.draw({ x: gx, y: gy, r: gr, a: L.prog(t, 3.7, 0.3), T: t })
            room.vignette.style.opacity = (1 - L.smooth(300, L.FIELD.R, gr)).toFixed(3)   // hidden under the full field
            const sy = t < 1.47 ? 406 : L.lerp(406, 420, L.ease('sine.inOut')(L.clamp((t - 1.47) / 1.53)))
            L.place(sup, { a: L.prog(t, 1.27, 0.2) * (1 - L.prog(t, 3.6, 0.3)), dy: sy - 406 })
            L.place(st, { a: L.prog(t, 3.2, 0.2) * (1 - L.prog(t, 3.6, 0.3)) })
          })
          window.__timelines = window.__timelines || {}
          window.__timelines[ID] = tl

          const R = (el) => el.getBoundingClientRect()
          window.__kitProbe = window.__kitProbe || {}
          window.__kitProbe[ID] = {
            times: [3.4],
            check() {
              const m = R(ch.g.querySelector('.band').parentNode.querySelector('path'))
              const b = R(bead.core)
              const line = cam.map(400, 400, 3.4, 'mid'), end = cam.map(1520, 400, 3.4, 'mid')
              return [
                { name: 'long note starts at (560, 520): x', got: line[0], want: 560 }, { name: 'y', got: line[1], want: 520 }, { name: 'ends at x 1360', got: end[0], want: 1360 },
                { name: 'head bead centre x 560', got: b.x + b.width / 2, want: 560 }, { name: 'head bead centre y 520', got: b.y + b.height / 2, want: 520 }, { name: 'head bead r 22 on screen', got: b.width / 2, want: 22, tol: 0.5 },
                { name: '"support" baseline 420 at the last frame', got: 406 + (sup.getAttribute('transform') ? +/translate\(\s*[-\d.]+[ ,]+([-\d.]+)/.exec(sup.getAttribute('transform'))[1] : 0), want: 420, tol: 0.5 },
                { name: '"support" anchored middle at x 960, as Lesson 4\'s S15 (its italic ink centre ' + (R(sup).x + R(sup).width / 2).toFixed(1) + ')', got: +sup.getAttribute('x'), want: 960, tol: 0.5 },
                { name: '"what keeps it steady?" baseline 680', got: +st.getAttribute('y'), want: 680, tol: 0.5 },
                { name: 'the long note\'s stroke on screen at F-hook: 4 px (Lesson 4\'s weight)', got: cam.scale(3.4) * +ch.merc.path.getAttribute('stroke-width'), want: 4, tol: 0.05 },
                { name: 'Lesson 4\'s s15 geometry: the note x 560 to 1360 at y 520, "support" 160 px at (960, 420), "what keeps it steady?" 96 px at (960, 680)', got: `${Math.round(line[0])}-${Math.round(end[0])} @ ${Math.round(line[1])}; ${sup.style.fontSize || sup.getAttribute('font-size')}`, want: 'as s15', pass: Math.abs(line[0] - 560) < 1 && Math.abs(end[0] - 1360) < 1 && Math.abs(line[1] - 520) < 1 },
              ]
            },
          }
        })()
      </script>
    </div>
  </body>
</html>
