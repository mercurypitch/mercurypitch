    <div id="s10-steady" data-composition-id="s10-steady" data-start="0" data-duration="61.080" data-width="1920" data-height="1080">

      <div class="scene" id="s10-steady-scene"></div>
      <script>
        ;(function () {
          // S10, chapter 5 "A steady note" (STORYBOARD 10a to 10h; HANDOFFS § The hold chart, § The hold frame at the
          // right half, § The wave rule, § Framings F-hold, CU-scoop and CU-wave, § Camera moves, § The cuts S9 to S10 and
          // S10 to S11). S9's stack dims under the card and leaves from dim; the push to F-hold onto the hold chart as it
          // fades in at a 4 s window; Tavi's straight guess; the window widens to 10 s; her hold, the lit edge and the
          // settled flag; push-and-return 2 (CU-scoop, the slowed first second under "SLOWED · ILLUSTRATION", the truck to
          // CU-wave, the pull back); what steady means; her second guess; the frame slides to the right half beside the
          // voice box, the silent line and the slider; the empty frame carried across the matched cut on `sing`. Every time
          // is a cue, a word, a duration or the take's own time.
          const SID = 's10-steady'
          const D = L.dur(SID)
          const T0 = L.scene(SID).start
          const at = (cue, edge, off) => L.at(SID, cue, edge, off)
          const word = (line, which, edge, off) => L.word(SID, line, which, edge, off)
          const C = L.C, P = L.prog, clamp = L.clamp, lerp = L.lerp, f2 = L.f2, FO = L.FOLDS, TR = L.TRACE, LB = L.CHART.LABELS

          const root = document.getElementById(SID + '-scene')
          const room = L.room(root, { floor: true })
          const world = L.stage(room.mid)
          const hud = L.stage(room.hud)
          const dust = L.filmDust(room.near)

          /* ---------------------------------------------------------------- anchors */
          // 10a: act5
          const ACT = at('act5')
          const CARD_IN = ACT + 0.22, CARD_OUT = at('o11', 'start', -0.5)
          // the stack leaves from dim, up fast, as the card starts to leave (DECISIONS 196; the board's 303.10 before)
          const STACK_OUT = CARD_OUT
          // 10b: o11, b29
          const O11 = at('o11'), PUSH = O11 + 0.07, PUSH_D = 1.5       // push to F-hold (board 303.40 to 304.90)
          // the hold chart is at full strength before the push starts (DECISIONS 200): it fades in (linear) as the stack
          // has gone and the card is nearly out, full 0.02 s before the push; the hosts go back to 300 with the push (0.6 s)
          const CH_IN = STACK_OUT + 0.3, CH_IN_D = 0.25, HOST_D = 0.6
          const KICK = PUSH + 0.4, KICK_OUT = at('b29', 'end')
          const GUESS = word('o11', 'perfectly'), GUESS_END = word('o11', 'line')
          const WIDEN = word('b29', 'ten'), WIDEN_D = 0.8              // the window widens, 4 s to 10 s (power2.inOut)
          // 10c: demo, in the take's own time. The page's rule (FACTS 80): read every 16 ms, settled from the first
          // reading from which the line stays within 35 cents for 0.5 s
          const DEMO = at('demo'), DC = L.CONTOUR.demo
          const { entry: ENTRY, settled: SETTLED } = L.settled(DC)      // the page's rule, the kit's (entry 0.704, settled 1.204)
          const LIT = DEMO + ENTRY, FLAG = DEMO + SETTLED              // the edge and "in the band"; the flag and "settled"
          const GUESS_OUT = DEMO + 2.0, GUESS_OUT_D = 0.5              // the guess fades as her line passes 2 s; Merc's returns
          // 10d: o12, b30
          const SCOOPED = word('o12', 'scooped'), WAVES = word('o12', 'waves')
          const PUSH2 = word('b30', 'is', 'start', 0.03), PUSH2_D = 1.5   // push to CU-scoop (board 324.60 to 326.10)
          const SLOW0 = PUSH2 + 1.6, SLOW_K = 3, SLOW_SPAN = 1.5       // the first 1.5 s redrawn at a third of their speed
          const DEEP = 0.45                                            // its scoop's deep part (under -40 c), drawn on its own
          const SCOOP_L = word('b30', 'a scoop')
          // 10e: b31
          const TRUCK = at('b31') + 0.08, TRUCK_D = 2.0                // truck to CU-wave (sine.inOut)
          const SMALL = word('b31', 'small'), INSIDE = word('b31', 'the band')
          // 10f: b32
          const PULL = at('b32'), PULL_D = 1.46                        // pull back to F-hold
          const AXIS_BACK = PULL + PULL_D - 0.2, ANY_BACK = AXIS_BACK + 0.25
          const SET_BACK = Math.max(word('b32', 'settles'), ANY_BACK + 0.21)   // returns staggered 0.2 to 0.3 s (§ Type)
          const STAYS = word('b32', 'stays'), COMF = word('b32', 'comfortable')
          // 10g: o13
          const AIRQ = word('o13', 'steady air')
          // 10h: b33
          // "No." answers the guess, not the chart (DECISIONS 198): an ink strike through her guess (0.3 s), held 0.4 s,
          // then the rest clears in turn, 0.05 s apart, each over 0.3 s (linear): the guess, the chart's labels, the chip
          // and the axis, the marks, her line last
          const NO = at('b33'), STRIKE = NO + 0.06, STRIKE_D = 0.3
          const CLR0 = STRIKE + STRIKE_D + 0.4, CLR_STEP = 0.05, CLR_D = 0.3
          const CLR = {}
          ;['guess', 'steady', 'any', 'inBand', 'settled', 'fixed', 'chip', 'marks', 'line'].forEach((k, i) => { CLR[k] = CLR0 + i * CLR_STEP })
          const SLIDE = CLR.line + CLR_D, SLIDE_D = 1.1                // the frame slides once her line has gone (power2.inOut)
          const BOX = SLIDE + 0.4, BOX_D = 1.0                         // the voice box draws on as the frame leaves its place
          const VB_L = Math.max(word('b33', 'voice box'), BOX)         // "voice box" lands with its box
          const SET = word('b33', 'set'), NEEDS = word('b33', 'needs')
          // 10h's demonstration (DECISIONS 193): the slider from "needs" (0.4 s after its line lands), the silent line's
          // head drawing from 0.3 s later to the end; on "because", "a change in the air moves it" and one push, 50 to 100
          // and back (two legs of 0.9 s, sine.inOut), then the thumb at 50 while the line runs on; everything but the
          // empty frame fades over 0.4 s (linear), gone 0.13 s before the cut (HANDOFFS § The cuts, 364.60)
          const SLID0 = NEEDS + 0.4, LINE0 = SLID0 + 0.3, ILL10 = LINE0 + 0.45
          const BECAUSE = word('b33', 'because'), PUSH_LEG = 0.9, PUSH_TOP = 100
          const END_D = 0.4, END_FADE = D - 0.13 - END_D

          /* ---------------------------------------------------------------- the camera */
          const cam = L.frameRig(room, { from: 'F0' })
          cam.to(PUSH, PUSH_D, 'F-hold', 'power2.inOut')
          cam.to(PUSH2, PUSH2_D, 'CU-scoop', 'power2.inOut')
          cam.to(TRUCK, TRUCK_D, 'CU-wave', 'sine.inOut')
          cam.to(PULL, PULL_D, 'F-hold', 'power2.inOut')

          /* ---------------------------------------------------------------- the hosts: 240 small, back to 300 (10b) */
          const Hs = L.HOSTS.small, Hc = L.HOSTS.corners
          const merc = L.mercGate(room.top, { sid: SID, pass: 'm-blue', tag: SID + '-m-blue', ...Hs.merc, moves: [{ at: PUSH, dur: HOST_D, x: Hc.merc.x, size: Hc.merc.size }] })
          const tavi = L.mercGate(room.top, { sid: SID, pass: 'm-orange', tag: SID + '-m-orange', ...Hs.tavi, moves: [{ at: PUSH, dur: HOST_D, x: Hc.tavi.x, size: Hc.tavi.size }] })

          /* ---------------------------------------------------------------- carried from S9: the stack as s09-onset leaves
             it (the same block, drawn at S9's last frame) */
          const ST = TR.STACK, ROW_H = 70, NAME_X = 660
          const stackWrap = L.svg('g', { class: 'stack' }, world)          // the strokes: dim to 25 %, then leave up fast
          const stackLab = L.svg('g', { class: 'stack-labels' }, world)    // the names, labels and chips: hidden while dim
          const fo = L.folds(stackWrap)
          fo.draw({ cx: FO.SMALL.cx, cy: FO.SMALL.cy, s: FO.SMALL.s, grow: 1, state: { from: 'slit', to: 'apart', u: 1 }, vib: 0 })
          const rowTr = ST.rows.map((y, i) => L.trace(stackWrap, { y, h: ROW_H, seed: 75 + i }))
          const KINDS = ['air', 'catch', 'together']
          const names = ST.names.texts.map((s, i) => L.label(stackLab, s, { x: NAME_X, y: ST.names.y[i], size: ST.names.size, anchor: 'end' }))
          const stackLabels = [
            ...names,
            L.label(stackLab, ST.puff.text, { ...ST.puff, y: 148 }), L.label(stackLab, ST.click.text, { ...ST.click, x: 812 }),
            L.label(stackLab, ST.neither.text, ST.neither), L.label(stackLab, ST.easy.text, { ...ST.easy, x: NAME_X, y: 714, anchor: 'end' }),
            L.label(stackLab, ST.hLine.text, ST.hLine),
          ]
          // S9's last frame since C-01 (DECISIONS 195): "the easy start" under "Together", "LISTEN ONLY" under "A catch"
          const stackTags = [L.tag(stackLab, L.TAGS.illustration, ST.tag), L.tag(stackLab, L.TAGS.listen, { x: NAME_X, y: 495, anchor: 'end' })]

          /* ---------------------------------------------------------------- the hold chart (world px; HANDOFFS § The hold
             chart): a 4 s window, no strip, widening to 10 s */
          // The hold chart is the lead subject from the push in to "No." (DECISIONS 226): the cents scale stays at the
          // 4 s chart's 2.5 world px a cent as the window widens to 10 s (k no longer follows 10 / W), so the band stands
          // 175 world px, 227.5 on screen at F-hold (y 416 to 644), on the 1456 px plot; the take, its scoop and its
          // vibrato grow with it (at F-hold a cycle 26.5 px and 91 px peak to peak: the wave rule's 1.375 gives way here)
          const K = 2.5
          // Merc's line at y 358 (400 before): at CU-scoop and CU-wave the band (y 287 to 602 on screen) keeps both
          // edges in frame, and its bottom edge and the scoop's last dip (-38 c, at CU-wave x 13, y 619) stay clear of
          // the hosts' keep-outs (from y 628), which the plot runs past at the close-ups
          const Y0 = 358
          // every label re-placed around it, 12 px (screen) or more from every stroke at its framing: world baselines
          // (F-hold's 12 px is 9.2 world px, CU's 6.7). Row 1 ("A, any octave", "in the band") clears "settled" over its
          // flag; row 2 ("steady: ...") and her guess (its underline 14 under its baseline) stack over it; the axis
          // stands under the scoop's low point (-60 c, y 508, the head's dot to 515), the length bracket under the axis
          // and its label under that, above the caption band (y 896 on screen)
          const PL = { row1: 206, chip: 195, steady: 163, guess: 114, vibrato: 253, scoop: 540, tick: 524, axis: 550, lenBr: 572, fixed: 605 }
          const ch = L.bandChart(world, { ...L.CHART.S10, W: 4, k: K, y0: Y0 })
          const G0 = { x0: ch.G.x0, x1: ch.G.x1, y0: ch.G.y0 }
          // 10h's frame in world px at F-hold: screen x 1000 to 1640, line y 245, 1.0 px a cent (L.CHART.FRAME, where
          // s11-sing draws it at F0)
          const FH = L.FRAMES['F-hold'], FR = L.CHART.FRAME
          const FRW = { x0: (FR.x0 - FH.ox) / FH.s, x1: (FR.x1 - FH.ox) / FH.s, y0: (FR.y0 - FH.oy) / FH.s, k: FR.k / FH.s }
          const litGlows = [...ch.g.querySelectorAll('.band g rect')].slice(0, 2)   // the lit edge's two glows (10e's glow)
          const anyOct = ch.label('anyOctave', null, { y: PL.row1 }), inBand = ch.label('inBand10', null, { y: PL.row1 })
          const chipW = L.tag(ch.gLabels, L.TAGS.illustration, { x: 1520, y: PL.chip, anchor: 'end' })   // centred on row 1's capitals
          const ax = L.timeAxis(ch.g, { y: PL.tick, labelY: PL.axis })
          // the axis's "0" left-aligned at x 400 (HANDOFFS § The hold chart); the kit's default, right-aligned 12 px left of
          // the plot (x 388), would stand inside Merc's keep-out at F-hold; her line leaves at -60 cents (y 508, the head's
          // dot to 515), 13 world px (17 on screen) over this "0"'s top. The "0" stands for its tick, as "4 s" and "10 s" do for the
          // last one (the kit fades the tick at the plot's end): the first tick, which would cut into the "0"'s top, is
          // not drawn
          const zeroEl = ax.g.querySelector('text'), tick0 = ax.g.querySelector('rect')
          zeroEl.setAttribute('text-anchor', 'start')
          // "0" and "10 s" stand inside the hosts' video squares at F-hold, over their transparent part: 42 and 32 px from
          // the body boxes (the keep-out is 20), so the layout audit's occlusion is marked as intended
          ax.end(4); ax.end(10)
          for (const e of ax.g.querySelectorAll('text')) e.setAttribute('data-layout-allow-occlusion', '')
          const flag = L.settledFlag(ch.gLabels)
          // its pole and pennant (the kit's draw scales the whole group, its label too: a scale's slow tail on the label
          // stepped its type a whole pixel at its end, 326.93, DECISIONS 233); here the flag scales and "settled" never does
          const flagMarks = [flag.g.querySelector('rect'), flag.g.querySelector('path')]
          let setW = 79                                                 // "settled" (Outfit 600 26), measured once the fonts are in
          L.afterFonts(() => { try { const el = flag.label.el || flag.label, w = el.getComputedTextLength(); if (w > 0) setW = w } catch (e) { /* the estimate stands */ } })
          // Tavi's straight guess (L.GUESS), dead flat along the band's centre, its "?" right of the plot, its travelling
          // head (DECISIONS 170)
          const guess = L.guess(ch.g, { points: [[400, Y0], [1520, Y0]], q: { x: LB.q.x, y: Y0 + LB.q.y - 400 } })
          const guessHead = L.svg('g', { opacity: 0, class: 'guess-head' }, ch.g)
          L.svg('circle', { r: 14, fill: C.ink2, 'fill-opacity': 0.18 }, guessHead)
          L.svg('circle', { r: 7, fill: C.ink2 }, guessHead)
          const scoop = ch.label('scoop', null, { y: PL.scoop })   // centred under the scoop's low point (CU-scoop)
          const vibrato = ch.label('vibrato', null, { y: PL.vibrato })   // over the band's top edge, under the chip (CU-wave)
          // the vibrato's height (DECISIONS 199): two ink hairlines (1.5 px on screen) at its crest and trough, the line's
          // outer edges, each 240 px long at CU-wave under the label's middle, with a 10 px tick across each end
          const CUW = L.FRAMES['CU-wave']
          const vibG = L.svg('g', { opacity: 0, class: 'vibrato-height' }, ch.g)
          const vibHi = L.svg('path', { fill: 'none', stroke: C.ink, 'stroke-width': 1.5, 'vector-effect': 'non-scaling-stroke', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, vibG)
          const vibLo = L.svg('path', { fill: 'none', stroke: C.ink, 'stroke-width': 1.5, 'vector-effect': 'non-scaling-stroke', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, vibG)
          let vibMid = LB.vibrato.x + 395.6 / 2
          L.afterFonts(() => { try { const w = vibrato.el.getComputedTextLength(); if (w > 0) vibMid = LB.vibrato.x + w / 2 } catch (e) { /* the estimate stands */ } })
          const steady = ch.label('steady', null, { y: PL.steady })
          // the bracket along the band's top, from just right of "settled" to the plot's end, drawn on from the left
          // (0.6 s); its ticks end 16 px (screen, F-hold) over the mint edge's top (DECISIONS 199; 7 px before C-01)
          const topBr = L.svg('path', { fill: 'none', stroke: C.chrome, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1, 'stroke-dasharray': '1 1', opacity: 0 }, ch.g)
          const lenBr = L.bracket(ch.g, { x1: 400, x2: 1520, y: PL.lenBr, dir: 'up', tick: 10 })
          const fixedLen = ch.label('fixedLength', null, { y: PL.fixed })
          // her second guess (10g): Outfit 600 40 ink-2, a dashed underline 14 px under its baseline and its "?" 14 px after
          const g10 = ch.label('guess10', null, { y: PL.guess })
          const g10Line = L.svg('path', { d: `M400 ${PL.guess + 14} L900 ${PL.guess + 14}`, fill: 'none', stroke: L.GUESS.stroke, 'stroke-width': L.GUESS.width, 'stroke-dasharray': L.GUESS.dash, opacity: 0 }, ch.gLabels)
          const g10Q = L.label(ch.gLabels, '?', { x: 914, y: PL.guess, size: L.GUESS.q, fill: L.GUESS.stroke })
          // "No.": an ink strike through the guess and its "?", at the x-height's middle (baseline - 10), drawn on (0.3 s)
          const strike = L.svg('path', { d: `M394 ${PL.guess - 10} L950 ${PL.guess - 10}`, fill: 'none', stroke: C.ink, 'stroke-width': 3, 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': '1 1', 'stroke-dashoffset': 1, opacity: 0 }, ch.gLabels)
          L.afterFonts(() => {
            try {
              const w = g10.el.getComputedTextLength()
              if (w > 0) {
                g10Line.setAttribute('d', `M400 ${PL.guess + 14} L${f2(400 + w)} ${PL.guess + 14}`); g10Q.el.setAttribute('x', f2(400 + w + 14))
                const qw = g10Q.el.getComputedTextLength() || 30
                strike.setAttribute('d', `M394 ${PL.guess - 10} L${f2(400 + w + 14 + qw + 6)} ${PL.guess - 10}`)
              }
            } catch (e) { /* measured again once the fonts are in */ }
          })

          /* ---------------------------------------------------------------- 10h: in screen px at F-hold (a world group
             under F-hold's inverse, so it rides the world while the camera holds F-hold) */
          const scr = L.svg('g', { transform: `matrix(${(1 / FH.s).toFixed(6)} 0 0 ${(1 / FH.s).toFixed(6)} ${f2(-FH.ox / FH.s)} ${f2(-FH.oy / FH.s)})` }, world)
          const vb = L.voiceBox(scr)
          const VBL = {
            name: { text: 'voice box', x: 300, y: 170, size: 32 },
            set: { text: 'muscles here set the note', x: 260, y: 570, size: 36 },
            needs: { text: 'a steady note needs steady air too', x: 260, y: 680, size: 40 },
            moves: { text: 'a change in the air moves it', x: 260, y: 740, size: 40 },
          }
          const vbl = {}
          for (const [n, c] of Object.entries(VBL)) vbl[n] = L.label(scr, c.text, c)
          const slider = L.pushSlider(scr, L.CHART.SLIDER10H)
          // the silent line: the frame at a 6 s window (106.7 px a second, 1.0 px a cent: 19.4 px a cycle, 28 px peak
          // to peak), following the slider by Push's rule (FACTS 73), its wave from its start
          const pushP = (t) => 50 + (PUSH_TOP - 50) * (P(t, BECAUSE, PUSH_LEG, 'sine.inOut') - P(t, BECAUSE + PUSH_LEG, PUSH_LEG, 'sine.inOut'))
          const SILENT = L.CONTOUR.from((tt) => L.CONTOUR.pushCents(pushP(LINE0 + tt)), () => 0, 0)
          const lineCh = L.bandChart(scr, { x0: FR.x0, x1: FR.x1, y0: FR.y0, W: 6, k: 1.0, strip: null })
          const ill10 = L.tag(hud, L.TAGS.illustration, { x: FR.x1, y: 176, anchor: 'end' })

          /* ---------------------------------------------------------------- frame-fixed */
          const card = L.chapterCard(hud, { num: 5, title: 'A steady note', tIn: CARD_IN, tOut: CARD_OUT })
          const kicker = L.kicker(hud, '05 · A steady note')
          // SLOWED, frame-fixed at CU-scoop between "in the band" (row 1) and the band's top edge (y 287 on screen), clear
          // of the chart's chip as the truck brings it in (y 115 to 187): x 1110 to 1563, centred y 232 (y 400 before 226)
          const slowed = L.tag(hud, L.TAGS.slowed, { x: 1110, y: 232, anchor: 'start' })

          const probe = { cam, ch, lineCh, anyOct, inBand, chipW, ax, flag, guess, guessHead, scoop, vibrato, vibG, vibHi, vibLo, steady, topBr, lenBr, fixedLen, g10, g10Line, g10Q, strike, pushP,
            vb, vbl, slider, ill10, card, kicker, slowed, fo, rowTr, stackWrap, stackLabels, stackTags, FRW, K, Y0, PL, flagMarks,
            A: { ACT, CARD_IN, CARD_OUT, STACK_OUT, O11, PUSH, PUSH_D, KICK, KICK_OUT, GUESS, GUESS_END, WIDEN, DEMO, ENTRY, SETTLED, LIT, FLAG, GUESS_OUT, SCOOPED, WAVES, PUSH2, PUSH2_D, SLOW0,

                  settle = (sc) => { d.style.transform = `scale(${sc.toFixed(5)})` }
                }
                o.reasons.push({ line: r, j, settle, lab: L.label(host, j ? '· ' + s : s, { ...rFont, x: K.comfort[0].x, y: r.y }), prefix: parts.slice(0, j).join(' · ') + (j ? ' ' : '') })
              })
            })
            const reasonLayout = () => {
              const probe = L.text(hud, '', { ...rFont, opacity: 0 })
              for (const p of o.reasons) {
                probe.textContent = p.prefix
                p.lab.el.setAttribute('x', L.f2(K.comfort[0].x + (p.j ? probe.getComputedTextLength() : 0)))
              }
              probe.remove()
            }
            reasonLayout()
            L.afterFonts(reasonLayout)
            o.listening = L.label(hud, K.listening.text, K.listening)
            o.stop = K.stop.map((s) => L.label(hud, s.text, { x: K.x, y: s.y, size: K.stopSize }))
            // the doctor lines, small (Inter 30, ink-2, five lines broken where the font puts them within 700 px)
            const DS = K.doctorSmall
            o.docG = L.svg('g', { opacity: 0, class: 'doctor-small' }, hud)
            o.doc = DS.y.map((y) => L.text(o.docG, '', { x: K.x, y, size: DS.size, family: DS.family, weight: 400, fill: DS.fill, opacity: 1 }))
            L.afterFonts(() => L.TURN.breakLines(hud, K.doctor, DS).forEach((s, i) => { if (o.doc[i]) o.doc[i].textContent = s }))
            return o
          }
          const O = turnObjects(world, hud)
          const K = L.TURN.CARE

          /* ---------------------------------------------------------------- anchors */
          // 11a: sing (the cut is 0.15 s before the mark)
          const SING = at('sing')
          const DIM = SING, DIM_D = 0.2                                 // the empty frame dims to 25 % (linear)
          const CARD_IN = SING + 0.22, CARD_OUT = at('b34', 'start', -0.5)
          const UNDIM = CARD_OUT, UNDIM_D = 0.38                        // back to full as the card leaves (linear)
          // 11b: b34
          const YT = word('b34', 'Your')                                // "Your turn."
          const COMF = word('b34', 'comfortable')                       // the frame's band glows
          const BR = word('b34', 'ten'), BR_D = 0.5                     // the bracket with "0" and "10 s" (one object)
          // the ring draws on under them as the ten seconds' clock (35 %, its tick, no counter; DECISIONS 204)
          const RING = word('b34', 'seconds'), RING_D = 0.8
          const NOTH = RING + 0.4                                       // "Nothing listens"
          // 11c: b35, b36
          const DOC = word('b35', 'care lines')                         // the doctor lines, small
          const SORE = word('b36', 'Sore'), JUST = word('b36', 'Just')  // the comfort line, its two halves; the icon with the first
          // 11d: b37, each reason on its word; "usual notes suddenly gone" lands on "have suddenly gone" and "hurts or
          // uncomfortable" settles (0.15 s up, 0.6 s back) on "singing": each fills a hold inside the word (DECISIONS 227)
          const RS = [word('b37', 'hurts'), word('b37', 'unusually'), word('b37', 'have'), word('b37', 'ill'), word('b37', 'talking')]
          const SETTLE = word('b37', 'singing'), SETTLE_AMP = 0.06
          // 11e: b37a
          const LISTENING = word('b37a', 'Rest')                        // "listening along: rest your voice and watch the ring"
          const RING_P = word('b37a', 'the ring')                       // the ring scales 1.05 once

          /* ---------------------------------------------------------------- the hosts at 300 in the corners */
          const Hc = L.HOSTS.corners
          const merc = L.mercGate(room.top, { sid: SID, pass: 'm-blue', tag: SID + '-m-blue', ...Hc.merc })
          const tavi = L.mercGate(room.top, { sid: SID, pass: 'm-orange', tag: SID + '-m-orange', ...Hc.tavi })

          /* ---------------------------------------------------------------- the card */
          const card = L.chapterCard(hud, { num: null, title: 'Sing it', tIn: CARD_IN, tOut: CARD_OUT })

          const probe = { cam, cut, card, ...O,
            A: { SING, DIM, DIM_D, CARD_IN, CARD_OUT, UNDIM, UNDIM_D, YT, COMF, BR, BR_D, NOTH, DOC, SORE, JUST, RS, SETTLE, SETTLE_AMP, RING, RING_D, LISTENING, RING_P, D }, boxes: {} }
          window.__sceneProbe = window.__sceneProbe || {}
          window.__sceneProbe[SID] = probe

          const tl = gsap.timeline({ paused: true })
          L.clock(tl, D, (t) => {
            const T = T0 + t
            cam.apply(t)
            cut.draw(t, T)
            dust(T)
            probe.boxes = { merc: merc(t), tavi: tavi(t) }

            /* 11a: the frame on S10's pixels, dimmed under the card, back to full as it leaves; 11b: its band glows */
            const frameA = 1 - 0.75 * P(t, DIM, DIM_D, 'none') + 0.75 * P(t, UNDIM, UNDIM_D, 'none')
            const glow = L.glow(t, [COMF], { up: 0.3, hold: 0.5, down: 0.8 })
            O.ch.draw({ a: frameA, band: { fill: 0.12 + 0.12 * glow }, merc: { a: 1, w: 4 } })
            card.draw(t)

            /* 11b: the task, the bracket, the ring under it (the ten seconds' clock), "Nothing listens"; 11e: on "the
               ring." the ring scales 1.05 once */
            O.title.life(t, YT, null, { dIn: 0.3, easeIn: 'none' })
            O.br.draw(P(t, BR, BR_D, 'power2.out'), 1)
            const brL = L.fade(t, BR + 0.3, null).a                    // "0" and "10 s" arrive with the bracket's ends
            O.br0.draw({ a: brL }); O.br10.draw({ a: brL })
            O.ring.draw({ a: t >= RING ? 1 : 0, draw: P(t, RING, RING_D, 'power2.inOut'), trackA: 0.35, scale: L.pulse(t, [RING_P], 'ring') })
            O.nothing.life(t, NOTH, null)

            /* 11c: the doctor lines, small; the comfort line beside its icon */
            O.docG.setAttribute('opacity', L.fade(t, DOC, null, { dIn: 0.3, easeIn: 'none' }).a.toFixed(3))
            const soreA = O.comfort[0].life(t, SORE, null)
            O.icon.setAttribute('opacity', soreA.toFixed(3))
            O.comfort[1].life(t, JUST, null)

            /* 11d: the reasons, each on its word; the first settles on "singing" */
            O.reasons.forEach((p, i) => p.lab.life(t, RS[i], null))
            O.reasons[0].settle(L.pulse(t, [SETTLE], 'label', { amp: SETTLE_AMP }))

            /* 11e: the listening line */
            O.listening.life(t, LISTENING, null)

            /* not yet in this scene */
            O.voices.forEach((v) => v.draw({ a: 0 }))
            O.breatheIn.draw({ a: 0 })
            O.rowG.setAttribute('opacity', '0'); O.rowLines.forEach((l) => l.draw({ a: 0 }))
            O.stop.forEach((l) => l.draw({ a: 0 }))
            O.playhead.draw({ a: 0 })
            O.echo.draw(t, [])
          })
          window.__timelines = window.__timelines || {}
          window.__timelines[SID] = tl
        })()
      </script>
    </div>
  </div>
</body></html>
