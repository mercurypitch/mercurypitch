<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Integration lab: the chapter card's breathing (DECISIONS 202). "Sing it" on S11's own times (the card in at
         0.37, out at 3.6), over the room at rest, so measure.py's single-frame events can only be the card's. -->
    <div id="kit-cardgp" data-composition-id="kit-cardgp" data-start="0" data-duration="4.2" data-width="1920" data-height="1080">
      <div class="scene" id="kit-cardgp-root"></div>
      <script>
        ;(function () {
          const ID = 'kit-cardgp', D = 4.2
          const root = document.getElementById(ID + '-root')
          const room = L.room(root, { bokeh: false, staves: false })
          const hud = L.stage(room.hud)
          const card = L.chapterCard(hud, { num: null, title: 'Sing it', tIn: 0.37, tOut: 3.6 })
          card.titleEl.setAttribute('text-rendering', 'geometricPrecision'); card.g.setAttribute('text-rendering', 'geometricPrecision')
          const tl = gsap.timeline({ paused: true })
          L.clock(tl, D, (t) => { card.draw(t) })
          window.__timelines = window.__timelines || {}
          window.__timelines[ID] = tl
        })()
      </script>
    </div>
  </body>
</html>
