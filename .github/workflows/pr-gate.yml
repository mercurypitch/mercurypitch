name: PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Branch pushes only. A release tag points at a commit main has already
  # gated, so a second full run proves nothing new, and on v0.9.16 and v0.9.17
  # it failed 45 of the 51 Beside Cue adventure jobs that had just passed on
  # main at the same commit. Release tags run what fits their family instead:
  # v* deploys the web app (build.yml) and walks the guided tours
  # (release-tours.yml); mp-v* and bc-v* build their native apps
  # (mercurypitch-mobile.yml, beside-cue-mobile.yml).
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  # Superseding a PR push is free: the newer commit is the one that matters.
  # A push to main is not. Every main run covers a distinct commit, and
  # cancelling one loses that commit's coverage permanently. Five main pushes
  # landed inside thirty minutes on 2026-08-30 — long enough for a long suite
  # to be killed by the next merge every time.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The gate used to be one serial job, ~15.5 minutes: lint, then units, then a
# build, then a browser run, then the workers, then Beside Cue — none of which
# depends on the one before it. It is now a fan-out from `scope`, so the gate
# costs its longest job rather than the sum of all of them.
#
# `scope` decides which surfaces a change can affect and every other job keys
# off its outputs, so a docs-only PR still installs nothing and a Beside Cue PR
# does not typecheck MercuryPitch. A skipped job reports `skipped`, not
# `success`, which is why `gate` at the bottom is the single required check.
#
# What runs also depends on the event, by maff's decision of 30 Oct 2026. A
# pull request runs the smoke tier: scope, validate, lint, the ratchet, units,
# the @smoke browser set (e2e-smoke), the workers, the Beside Cue checks and
# the Mercury Pitch bundle. The full browser suite (e2e), the legacy Beside Cue
# browser suite and the 57-job adventure matrix run on main and on a dispatch
# only. A pull request with Beside Cue in scope used to start 74 to 85 jobs
# and 250 to 300 Linux runner minutes (sample medians, 23 to 30 Oct), about
# four times the 20 jobs the plan runs at once. The price is that a
# regression only those suites catch now shows on main after the merge;
# docs/agent/TESTING.md has the numbers. To run everything on a branch first,
# dispatch this workflow on it (`gh workflow run pr-gate.yml --ref <branch>`);
# that run's `PR Gate` check counts. scripts/ci-tiers.test.mjs holds the split.

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      root: ${{ steps.scope.outputs.root }}
      beside: ${{ steps.scope.outputs.beside }}
      db: ${{ steps.scope.outputs.db }}
      jam: ${{ steps.scope.outputs.jam }}
      mercurypitch: ${{ steps.scope.outputs.mercurypitch }}
      install: ${{ steps.scope.outputs.install }}
      diff_base: ${{ steps.scope.outputs.diff_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No dependency install required, and it catches the most common
      # generated-doc failure before any other job starts work.
      - name: Check generated agent index
        run: node scripts/gen-agent-index.mjs --check

      - name: Resolve validation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          root=false
          beside=false
          db=false
          jam=false
          mercurypitch=false
          diff_base=""

          # A manual audit validates every shipped surface. For an
          # unusable/missing base SHA, fail safely by doing the same.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            root=true
            beside=true
            db=true
            jam=true
            mercurypitch=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              # The checkout is GitHub's test merge of this pull request into
              # main as it is now, and its first parent is that main, so the
              # diff from it is exactly what the pull request changes.
              # pull_request.base.sha can be older than main: on PR 1174 (a
              # skills PR, 23 Oct 2026) main's newer commits, a pr-gate.yml
              # change among them, counted as the PR's own and set every
              # scope, adventure matrix included. A checkout that is not a
              # merge has no such parent; it leaves the base empty and is
              # validated in full.
              base_sha=""
              if git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
                base_sha="$(git rev-parse 'HEAD^1')"
              fi
            else
              base_sha="$PUSH_BASE_SHA"
            fi

            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              root=true
              beside=true
              db=true
              jam=true
              mercurypitch=true
            else
              diff_base="$base_sha"
              git diff --check "$base_sha" "$GITHUB_SHA"

              while IFS= read -r file; do
                [[ -z "$file" ]] && continue

                case "$file" in
                  package.json|pnpm-lock.yaml|pnpm-workspace.yaml|eslint.config.js|.prettierrc.json|.gitattributes|.github/workflows/*.yml|.github/workflows/*.yaml)
                    root=true
                    beside=true
                    db=true
                    jam=true
                    mercurypitch=true
                    ;;
                  scripts/*beside-cue*)
                    # A Beside Cue media/prep script cannot affect the
                    # MercuryPitch build: the app resolves `@` to its own
                    # src (apps/beside-cue/vitest.config.ts) and shares no
                    # artifacts with the root. Without this arm the catch-all
                    # below sets root=true, and PR #653 — 26 of its 27 files
                    # under apps/beside-cue — paid for the full MercuryPitch
                    # typecheck, 921 unit files and 120 e2e tests, ~11 min.
                    beside=true
                    ;;
                  apps/mercurypitch/*|gradle/signing.gradle)
                    # The native shell alone. It aliases `@` to the root `src`
                    # but adds no source of its own that MercuryPitch compiles,
                    # so a change here cannot break the web build.
                    mercurypitch=true
                    ;;
                  apps/beside-cue/public/games/*|packages/glass-game/*)
                    # Root /glass-game consumes these canonical shared bytes
                    # and package modules as well as the Beside Cue host.
                    root=true
                    beside=true
                    ;;
                  apps/beside-cue/*|packages/beside-cue-core/*)
                    beside=true
                    ;;
                  packages/audio-io/*|packages/mobile-runtime/*|packages/pitch-engine/*|packages/purchase-kit/*)
                    # Shared by both apps.
                    beside=true
                    mercurypitch=true
                    ;;
                  src/*)
                    # The DB Worker imports shared catalogs and validators from
                    # the root application, so root source changes must validate
                    # both consumers. And `apps/mercurypitch` aliases `@` to
                    # this directory: the native app IS this source tree, built
                    # through a different config, so it can break here alone --
                    # an import that only resolves under the web build, or an
                    # API a WKWebView does not have.
                    root=true
                    db=true
                    mercurypitch=true
                    ;;
                  workers/db-worker/*)
                    db=true
                    ;;
                  workers/jam-worker/*)
                    jam=true
                    ;;
                  docs/*|*.md|.github/*.md|.github/workflows/*.md|.claude/*|.impeccable/*)
                    # Documentation-only changes still run the generated-index
                    # check above, but do not require a dependency install.
                    ;;
                  .github/actions/fetch-assets/*)
                    # Only the native builds fetch through it: the Mercury
                    # Pitch job below and mercurypitch-mobile.yml.
                    mercurypitch=true
                    ;;
                  .github/actions/lfs-pull/*)
                    # The browser shards and the Beside Cue jobs pull their
                    # game assets through it.
                    root=true
                    beside=true
                    ;;
                  *)
                    root=true
                    ;;
                esac
              done < <(git diff --name-only "$base_sha" "$GITHUB_SHA")
            fi
          fi

          install=false
          if [[ "$root" == true || "$beside" == true || "$db" == true || "$jam" == true || "$mercurypitch" == true ]]; then
            install=true
          fi

          {
            echo "root=$root"
            echo "beside=$beside"
            echo "db=$db"
            echo "jam=$jam"
            echo "mercurypitch=$mercurypitch"
            echo "install=$install"
            echo "diff_base=$diff_base"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Validation scope"
            echo ""
            echo "| Surface | Run |"
            echo "| --- | --- |"
            echo "| MercuryPitch | $root |"
            echo "| Beside Cue | $beside |"
            echo "| DB Worker | $db |"
            echo "| Jam Worker | $jam |"
            echo "| Mercury Pitch (native) | $mercurypitch |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The browser shards and every Beside Cue job below restore the game
      # assets from the Actions cache (.github/actions/lfs-pull). Filling it
      # here, once, before they start means a new asset set costs one LFS
      # download per run rather than one per job: the adventure matrix alone
      # is 57 jobs.
      - name: Fill the LFS cache
        if: steps.scope.outputs.root == 'true' || steps.scope.outputs.beside == 'true'
        uses: ./.github/actions/lfs-pull
        with:
          warm-only: 'true'

  validate:
    name: Validate changed files
    needs: scope
    if: needs.scope.outputs.install == 'true' && needs.scope.outputs.diff_base != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Validate changed files without mutation
        env:
          PR_PREPARE_BASE: ${{ needs.scope.outputs.diff_base }}
        run: pnpm run pr:validate

  lint:
    name: Lint and typecheck
    needs: scope
    if: needs.scope.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # This is check:ci without its already-completed docs:index:check step.
      # All commands are non-mutating; CI, rather than a local hook, is the
      # authoritative formatting, lint, and typecheck gate.
      - name: Check MercuryPitch syntax and formatting
        # eslint src peaks at about 6.2 GB of memory (measured 15 Oct 2026)
        # and ran out of Node's default heap of about 4 GB on main and on PRs.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run typecheck && pnpm run lint && pnpm run fmt

      # Gated on root alone, as it was before the split. It must not inherit
      # the `validate` job's diff_base requirement: a workflow_dispatch run
      # has no diff base and would then never exercise this helper.
      - name: Test repository scripts
        run: pnpm run test:scripts

  metrics:
    name: Code health ratchet
    needs: scope
    # `install` is true whenever any source surface is in scope, which is
    # exactly when a tracked number can move: the script measures src,
    # workers, packages and apps. A docs-only PR cannot change it and skips.
    if: needs.scope.outputs.install == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # A ratchet, not an absolute threshold: this fails only when a number is
      # worse than docs/agent/code-metrics.baseline.json. Growth that is
      # deliberate lands by re-running `--update` in the same PR and saying why
      # in the commit message.
      #
      # Its own job rather than a step in `lint`, because it spends ~100s on a
      # second full audit-ESLint pass plus dependency-cruiser. Behind `lint`
      # that would make static analysis the critical path; alongside the
      # browser shards it disappears into the existing wall clock.
      #
      # The checkout is shallow, which is deliberate: the churn-weighted
      # hotspot ranking needs real history and reports itself skipped without
      # it, and that metric is context for a human, never ratcheted.
      - name: Check code health against the baseline
        run: pnpm run metrics:check

  # Each sitemap URL's <lastmod> is the day its page last changed for a reader
  # or a crawler, and IndexNow (scripts/indexnow.mjs) announces only the URLs
  # whose date moved. Nothing held the dates to the pages, and the room and
  # lesson changes of late October went out under old dates. This builds for
  # production, as mercurypitch.com is built, and fails when a page's words,
  # links or structured data changed without a new date: run
  # `pnpm run sitemap:lastmod` and commit what it writes.
  sitemap:
    name: Sitemap dates
    needs: scope
    if: needs.scope.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Hydrate runtime game assets
        uses: ./.github/actions/lfs-pull
      - uses: ./.github/actions/setup
      - name: Build MercuryPitch for production
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run build
      - name: Check each page against its sitemap date
        run: pnpm run sitemap:check

  units:
    name: Unit tests (${{ matrix.shard }}/2)
    needs: scope
    if: needs.scope.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Two shards, not four: the node/jsdom project split already took the
      # dominant cost (jsdom construction) out of this step, and past that
      # point per-job setup starts to dominate the saving.
      - name: Test MercuryPitch units
        run: pnpm run test:run --shard=${{ matrix.shard }}/2

  # The whole browser suite, on main and on a dispatch. A pull request runs
  # e2e-smoke below instead.
  e2e:
    name: Browser tests (${{ matrix.shard }}/4)
    needs: scope
    if: needs.scope.outputs.root == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - name: Hydrate runtime game assets
        uses: ./.github/actions/lfs-pull
      - uses: ./.github/actions/setup
      # Each shard builds its own dist rather than downloading a shared
      # artifact. `dist` is 69 MB, so publishing it once and pulling it four
      # times costs more wall-clock than four parallel builds do — and it would
      # put a barrier in front of a fan-out that otherwise has none.
      #
      # This is also the only build: playwright.config.ts serves `dist` and no
      # longer rebuilds it, so the bundle the `assert-*-bundle.mjs` audits in
      # `build:e2e` check here is the bundle these tests actually run against.
      - name: Build MercuryPitch for browser tests
        run: pnpm run build:e2e

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # One key for all four shards, deliberately. On a version bump they
          # all miss and all try to save it; GitHub keeps the first and the
          # losers log a reserve warning. That noise is preferable to the
          # alternatives: `lookup-only` skips the download rather than the
          # save, and a per-shard key would quadruple the stored browsers.
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        # OS dependencies still install on a cache hit. The helper limits apt
        # to Ubuntu sources without changing package signature checks.
        run: node scripts/install-ci-browser.mjs chromium

      # The whole suite, on main and on a dispatch. From 31 Aug to 30 Oct
      # 2026 it ran on every pull request as well. Before that a pull request
      # ran `--grep @smoke` and main went red on exercise-idle-layout.spec.ts
      # from a change this gate had passed. maff chose the smoke tier for pull
      # requests again on 30 Oct 2026, knowing that hole comes back: a test
      # outside the @smoke set first runs on code that is already merged. Tag
      # a test @smoke when a pull request must not merge without it.
      - name: Test MercuryPitch browser paths
        run: pnpm run test:e2e --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  # A pull request's browser tier: the @smoke set, 513 of the suite's 1,957
  # tests in 139 of its 224 files (counted 30 Oct 2026), on two shards. Its
  # steps are e2e's, so build:e2e and the bundle audits in it still run on
  # every pull request that can change MercuryPitch: they were first to catch
  # 2 of the 20 real defects in a sample of 30 failed PR runs (2 to 30 Oct).
  e2e-smoke:
    name: Browser smoke (${{ matrix.shard }}/2)
    needs: scope
    if: needs.scope.outputs.root == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - name: Hydrate runtime game assets
        uses: ./.github/actions/lfs-pull
      - uses: ./.github/actions/setup
      # The same build as e2e, for the same reasons: see the comment there.
      - name: Build MercuryPitch for browser tests
        run: pnpm run build:e2e

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # e2e's key, so one stored copy serves both jobs.
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: node scripts/install-ci-browser.mjs chromium

      - name: Test MercuryPitch smoke paths
        run: pnpm run test:e2e --grep @smoke --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report-shard-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  workers:
    name: Workers
    needs: scope
    if: needs.scope.outputs.db == 'true' || needs.scope.outputs.jam == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Typecheck DB Worker
        if: needs.scope.outputs.db == 'true'
        run: pnpm run typecheck:db

      # The worker suites live in the root vitest project, so the `units` job
      # already covers them whenever root=true. A worker-only PR never sets
      # root, though, and used to be gated by `tsc` alone — 19 db-worker test
      # files, including the 2243-line auth suite and the node-tests that
      # replay every real migration against SQLite, did not run on the change
      # they were written to protect. Run them explicitly in that case.
      - name: Test DB Worker units
        if: needs.scope.outputs.db == 'true' && needs.scope.outputs.root != 'true'
        run: pnpm run test:db

      - name: Typecheck Jam Worker
        if: needs.scope.outputs.jam == 'true'
        run: pnpm run typecheck:jam

      - name: Test Jam Worker units
        if: needs.scope.outputs.jam == 'true' && needs.scope.outputs.root != 'true'
        run: pnpm run test:jam

  beside-cue:
    name: Beside Cue
    needs: scope
    if: needs.scope.outputs.beside == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Hydrate runtime game assets
        uses: ./.github/actions/lfs-pull
      - uses: ./.github/actions/setup
      - name: Check Beside Cue
        run: pnpm beside-cue:check

      - name: Test Beside Cue
        run: pnpm beside-cue:test

      - name: Build Beside Cue store app
        # beside-cue:check already typechecks every package, including the app.
        # Direct Vite builds exercise asset staging without package hooks.
        run: pnpm --filter @irchiinnuss/beside-cue-app exec vite build

      - name: Build Beside Cue with games
        env:
          VITE_BESIDE_CUE_GAMES: '1'
        run: pnpm --filter @irchiinnuss/beside-cue-app exec vite build --outDir build/games-enabled

      # The Android and iOS native builds live in beside-cue-mobile.yml. It
      # runs on main, on bc-v* tags and when dispatched, not on pull requests
      # (30 Oct 2026). Dispatch it on a branch for an installable APK.

  # Main and dispatch only, like e2e. Its 25 spec files run nowhere else.
  beside-cue-browser:
    name: Beside Cue browser tests (legacy ${{ matrix.shard }}/2)
    needs: scope
    if: needs.scope.outputs.beside == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - name: Hydrate runtime game assets
        uses: ./.github/actions/lfs-pull
      - uses: ./.github/actions/setup
      - name: Install Chromium for Beside Cue browser tests
        run: node scripts/install-ci-browser.mjs chromium

      # Keep the existing games and games-off paths sharded, but give the
      # heavier adventure files their own jobs below. One browser worker per
      # runner prevents concurrent WebGL contexts from fighting for CPU.
      - name: Test Beside Cue browser paths
        timeout-minutes: 20
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm exec playwright test -c apps/beside-cue/playwright.config.ts --project=chromium --project=chromium-store --shard=${{ matrix.shard }}/2 --reporter=line,html

      # Keep a step deadline below the job deadline so even a stuck browser
      # leaves traces. The line reporter also prints each failure immediately.
      - name: Upload Beside Cue browser failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: beside-cue-playwright-shard-${{ matrix.shard }}
          path: |
            apps/beside-cue/playwright-report
            apps/beside-cue/test-results
          retention-days: 7

  # Main and dispatch only, like e2e. In four weeks of pull requests its only
  # real catches were two runs of one Glassworks branch, and it was the first
  # failing job in 6 of 7 sampled flakes.
  beside-cue-adventure-browser:
    name: Beside Cue adventure (${{ matrix.spec }})
    needs: scope
    if: needs.scope.outputs.beside == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        spec:
          [
            archive-hush,
            artwork,
            authoring,
            auto-singing,
            camera,
            campaign,
            campaign-access,
            campaign-storage,
            chamber,
            cloudway,
            cloudway-layouts,
            cloudway-platform-kit,
            collection,
            context-recovery,
            controls,
            course-sharing,
            current-entry,
            encore,
            echo-curator,
            encore-examples,
            journey,
            island-paths,
            living-crystal,
            loading,
            loading-recovery,
            map-memory,
            material-hosts,
            message-stack,
            mic-recovery,
            mobile-flow,
            music,
            narration,
            native-current,
            render-quality,
            renderer-ownership,
            replay,
            resonance,
            runner-readiness,
            runner-obstacles,
            runner-camera,
            runner-collectible,
            runner-slide,
            icon-alignment,
            runner-reference,
            runner-responsive,
            runner-sound,
            runner-steering,
            runner-steering-recovery,
            song-runner,
            songbook,
            solids,
            texture-orientation,
            thawing-song,
            thawing-living-art,
            glassware-trio,
            voice,
            reference,
          ]
    steps:
      - uses: actions/checkout@v7
      - name: Hydrate runtime game assets
        uses: ./.github/actions/lfs-pull
      - uses: ./.github/actions/setup
      - name: Install browser for Glass Adventure paths
        run: node scripts/install-ci-browser.mjs ${{ matrix.spec == 'material-hosts' && 'webkit' || 'chromium' }}

      # Each file loads and compiles the authored museum through SwiftShader.
      # File-level jobs keep a slow GPU process from delaying unrelated paths
      # and make the exact failing interaction visible in the required gate.
      - name: Test Glass Adventure browser paths
        timeout-minutes: 17
        env:
          PLAYWRIGHT_HTML_OPEN: never
          BESIDE_CUE_WEBKIT: ${{ matrix.spec == 'material-hosts' && '1' || '0' }}
        run: pnpm exec playwright test -c apps/beside-cue/playwright.config.ts --project=${{ matrix.spec == 'material-hosts' && 'webkit' || 'chromium-adventure' }} apps/beside-cue/e2e/glass-adventure-${{ matrix.spec }}.e2e.ts --reporter=line,html

      - name: Upload Glass Adventure browser failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: glass-adventure-playwright-${{ matrix.spec }}
          path: |
            apps/beside-cue/playwright-report
            apps/beside-cue/test-results
          retention-days: 7

  mercurypitch:
    name: Mercury Pitch
    needs: scope
    if: needs.scope.outputs.mercurypitch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Check Mercury Pitch
        run: pnpm mercurypitch:check

      - name: Test Mercury Pitch
        run: pnpm mercurypitch:test

      # The Karaoke room's six example stems, which the build ships and git
      # does not hold, from the Actions cache on the same key as
      # mercurypitch-mobile.yml. r2.dev rate-limits: on 28 Oct 2026 it cut
      # this job's download off mid-file and held the native builds' for up
      # to half an hour.
      - name: Fetch the Karaoke room's example songs
        uses: ./.github/actions/fetch-assets
        with:
          command: node apps/mercurypitch/scripts/fetch-karaoke-examples.mjs
          path: apps/mercurypitch/native-only/karaoke/examples/**/*.m4a
          key-files: apps/mercurypitch/scripts/fetch-karaoke-examples.mjs

      - name: Build Mercury Pitch
        # The build is the check that matters here and it is not the same one
        # `root` runs: this bundle resolves `@` to ../../src through a
        # different Vite config, with different entry points and no service
        # worker. A `@/...` import the web build resolves can be missing from
        # this graph, and the failure would otherwise appear first in a
        # macOS CI job ten minutes into a native run.
        #
        # mercurypitch:check has already run tsc, so invoke Vite directly.
        run: pnpm --filter @irchiinnuss/mercury-pitch-app exec vite build

      - name: Assert the bundle is a store binary
        # The same script mercurypitch-mobile.yml runs, for the same reasons:
        # the engine assets are vendored AND referenced, and nothing in the
        # bundle sells anything. See the file's header. This job builds but
        # never runs cap sync, so there is no --android-assets to pass.
        run: node apps/mercurypitch/scripts/assert-bundle.mjs apps/mercurypitch/dist

      # The Android and iOS native builds live in mercurypitch-mobile.yml. It
      # runs on main, on mp-v* tags and when dispatched, not on pull requests
      # (30 Oct 2026), so this job is the native check a pull request gets.
      # Dispatch that workflow on a branch for an installable APK.

  gate:
    name: PR Gate
    # The single required status check. Branch protection cannot name a
    # matrix's individual jobs stably, and a job skipped by `scope` or by its
    # event reports `skipped` rather than `success`, so neither can be
    # required directly.
    needs:
      [
        scope,
        validate,
        lint,
        metrics,
        sitemap,
        units,
        e2e,
        e2e-smoke,
        workers,
        beside-cue,
        beside-cue-browser,
        beside-cue-adventure-browser,
        mercurypitch,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail

          echo "Job results: $RESULTS"

          # `skipped` is a pass: it means the scope step decided that surface
          # could not be affected by this change, or that the job belongs to
          # another event (e2e-smoke on main, the full browser suites on a
          # pull request). `failure` and `cancelled` are not, and neither is
          # anything else that shows up here.
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::a required job reported $result"
                exit 1
                ;;
            esac
          done

          echo "All required jobs passed."
