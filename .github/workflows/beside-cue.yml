name: Beside Cue

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/beside-cue/**'
      - 'packages/beside-cue-core/**'
      - 'packages/mobile-runtime/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/beside-cue.yml'
  push:
    branches: [main]
    paths:
      - 'apps/beside-cue/**'
      - 'packages/beside-cue-core/**'
      - 'packages/mobile-runtime/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/beside-cue.yml'

permissions:
  contents: read

concurrency:
  group: beside-cue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm beside-cue:check
      - run: pnpm beside-cue:test
      - run: pnpm beside-cue:build

  android:
    name: Android shell
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm beside-cue:build
      - name: Synchronize Capacitor Android project
        run: pnpm --filter @irchiinnuss/beside-cue-app exec cap sync android
      - name: Test, lint, and build Android packages
        working-directory: apps/beside-cue/android
        run: ./gradlew test lint assembleDebug :app:assembleDebugAndroidTest bundleRelease --no-daemon
