name: Beside Cue Mobile

# A caller. Everything this used to hold — the triggers' reasoning, the
# 90382 upload-limit story, the certificate-ceiling failure, the SwiftPM
# cache trap — now lives once in `.github/workflows/capacitor-app.yml`,
# because a second app needed the same lessons and a second copy is how the
# two drift apart. Read that file for why any of it is the way it is.
#
# What stays here is what is genuinely Beside Cue's: which paths are its
# own, which tag prefix releases it, and which secrets it may reach.
#
# Beside Cue versions independently of MercuryPitch, so this deliberately
# does not use the `v*` tags that ship the web app to production.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/beside-cue/**'
      - 'packages/audio-io/**'
      - 'packages/beside-cue-core/**'
      - 'packages/mobile-runtime/**'
      - 'packages/pitch-engine/**'
      - 'gradle/signing.gradle'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/beside-cue-mobile.yml'
      - '.github/workflows/capacitor-app.yml'
  # No `paths:` here on purpose, matching build.yml and pr-gate.yml. A path
  # filter on a trigger that also carries tags can skip a release: the filter
  # is evaluated against the commits the push contains, and a tag placed on a
  # commit that is already on main contains none. The `changes` job in the
  # reusable workflow does the same filtering where it is safe to, and lets
  # every tag through.
  push:
    branches: [main]
    tags: ['beside-cue-v*']
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull-request run is wasted work and cancelling it is free. A
# superseded main or tag run is an upload in flight, and cancelling that burns
# a build number on a build nobody ever sees, so those queue instead.
concurrency:
  group: beside-cue-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/capacitor-app.yml
    permissions:
      contents: read
    with:
      app-name: Beside Cue
      app-slug: beside-cue
      app-dir: apps/beside-cue
      package-name: '@irchiinnuss/beside-cue-app'
      bundle-id: com.irchiinnuss.besidecue
      tag-prefix: beside-cue-v
      signing-env-prefix: BESIDE_CUE
      profile-build-setting: BESIDE_CUE_PROFILE
      # Kept in step with the pull_request `paths:` filter above.
      changed-paths-regex: '^(apps/beside-cue/|packages/(audio-io|beside-cue-core|mobile-runtime|pitch-engine)/|gradle/signing\.gradle$|package\.json$|pnpm-lock\.yaml$|\.github/workflows/(beside-cue-mobile|capacitor-app)\.yml$)'
      distribution-env-name: VITE_BESIDE_CUE_DISTRIBUTION
      platform-env-name: VITE_BESIDE_CUE_NATIVE_PLATFORM
      testflight-purchase-mode: ${{ vars.BESIDE_CUE_TESTFLIGHT_PURCHASES || 'mock' }}
      testflight-upload-from: main-and-tags
      ios-export-method: ${{ vars.BESIDE_CUE_IOS_EXPORT_METHOD || 'release-testing' }}
      # The onboarding media is generated, not checked in, and a build that
      # silently drops it ships an app whose first screen is blank.
      verify-assets: |
        test -f "$DIST_DIR/onboarding/corky-v2.4/SHA256SUMS"
        test -f "$DIST_DIR/onboarding/corky-v2.5/SHA256SUMS"
        if [ "$STAGE" = synced ]; then
          test -f "$ANDROID_ASSETS_DIR/onboarding/corky-v2.4/SHA256SUMS"
          test -f "$ANDROID_ASSETS_DIR/onboarding/corky-v2.5/SHA256SUMS"
        fi
    secrets:
      keystore-base64: ${{ secrets.BESIDE_CUE_KEYSTORE_BASE64 }}
      keystore-password: ${{ secrets.BESIDE_CUE_KEYSTORE_PASSWORD }}
      key-alias: ${{ secrets.BESIDE_CUE_KEY_ALIAS }}
      key-password: ${{ secrets.BESIDE_CUE_KEY_PASSWORD }}
      debug-keystore-base64: ${{ secrets.BESIDE_CUE_DEBUG_KEYSTORE_BASE64 }}
      # Per-team: one certificate and one App Store Connect key for every app
      # under XPQ824T444. These four are the only unprefixed names left, and
      # they are unprefixed because they are genuinely shared.
      apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
      apple-asc-key-id: ${{ secrets.APPLE_ASC_KEY_ID }}
      apple-asc-issuer-id: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      apple-asc-key-p8: ${{ secrets.APPLE_ASC_KEY_P8 }}
      apple-certificate-p12-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      # Per-app, and the reason the reusable workflow takes named secrets
      # rather than inheriting: under the old generic names a second app in
      # this repository would have signed with these.
      appstore-profile-base64: ${{ secrets.BESIDE_CUE_APPSTORE_PROFILE_BASE64 }}
      appstore-profile-name: ${{ secrets.BESIDE_CUE_APPSTORE_PROFILE_NAME }}
      adhoc-profile-base64: ${{ secrets.BESIDE_CUE_ADHOC_PROFILE_BASE64 }}
      adhoc-profile-name: ${{ secrets.BESIDE_CUE_ADHOC_PROFILE_NAME }}
      revenuecat-ios-key: ${{ secrets.BESIDE_CUE_REVENUECAT_IOS_KEY }}
      revenuecat-android-key: ${{ secrets.BESIDE_CUE_REVENUECAT_ANDROID_KEY }}
