name: Deploy DB Worker

# Deploys the db-worker (D1-backed CRUD + auth API).
#
# - Push to main touching workers/db-worker/** → dev
#   (mercury-pitch-db-dev + mercurypitch-db-dev)
# - Manual dispatch → dev or prod
# - workflow_call from build.yml on a v* release tag → prod
# - Every path deploys the Jam Worker first, because the DB Worker binds its
#   JamHostVerifier named entrypoint. Migrations then run before the DB Worker
#   deploy, so application code never runs against a database missing tables.
#
# Schema changes ship as tracked migrations in workers/db-worker/migrations/,
# applied here by `wrangler d1 migrations apply` (wrangler records applied
# files in a d1_migrations table, so each runs exactly once per database).
#
# This replaced re-applying a whole schema.sql on every deploy. That was
# idempotent for new TABLES but silently did nothing for new COLUMNS —
# CREATE TABLE IF NOT EXISTS skips an existing table wholesale — so every
# ALTER had to be remembered and run by hand, and an index over a
# never-added column failed the deploy.
#
# The baseline inherited that blind spot for the columns that predate it, so
# a Reconcile step runs first and closes it without a list to maintain. See
# the comment on that step; the short version is that a database older than
# the migrations gets the columns the baseline could not give it.
#
# Adding a change: drop a new NNNN_name.sql in migrations/ (next number).
# Never edit an applied file; databases that already ran it won't re-run it.
# An ALTER in a numbered migration needs nothing from the reconcile step.
#
# One-time prerequisites per environment (NOT done by CI):
#   pnpm db:init:dev   (creates the DB and commits its id to wrangler.jsonc)
#   pnpm exec wrangler secret put JWT_SECRET --config workers/db-worker/wrangler.jsonc --env dev
#   pnpm exec wrangler secret put ADMIN_KEY  --config workers/db-worker/wrangler.jsonc --env dev

on:
  push:
    branches:
      - main
    paths:
      - 'workers/db-worker/**'
      # The worker compiles in three catalogs that live with the app, and a
      # merge touching only one of them must still redeploy dev — otherwise
      # the deployed allowlist drifts behind the client. This happened
      # 2026-08-08: the karaoke_example_staged event merged in the funnel
      # catalog, no deploy fired, and the dev worker answered the new event
      # 400 until a manual dispatch. Release tags are immune (workflow_call
      # deploys unconditionally); this filter only protects dev.
      - 'src/lib/funnel-event-catalog.ts'
      - 'src/lib/supporter-feature-catalog.ts'
      - 'src/lib/backgrounds/background-catalog.ts'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-jam-worker:
    name: Deploy Jam Worker prerequisite
    uses: ./.github/workflows/deploy-jam.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
    secrets: inherit

  deploy-db-worker:
    name: Deploy DB Worker
    needs: deploy-jam-worker
    runs-on: ubuntu-latest
    env:
      # `inputs` is populated by workflow_dispatch AND workflow_call; a plain
      # push (main -> dev) has neither and falls through to dev.
      # Expression precedence: `==` binds before `&&` before `||`, so DB_NAME
      # is `(cond && A) || B` — the Actions ternary idiom. Safe here because
      # the middle operand is a non-empty string (never falsy).
      DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
      DB_NAME: ${{ (inputs.environment == 'prod') && 'mercurypitch-db' || 'mercurypitch-db-dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck worker
        run: pnpm typecheck:db

      # Rollback story: D1 Time Travel, NOT a dump-to-artifact. This repo is
      # public, and workflow artifacts on a public repo are downloadable by
      # any logged-in GitHub user — an exported database (emails, password
      # hashes, billing ids) must never be uploaded as one. If a migration
      # goes wrong, restore to the pre-deploy timestamp instead:
      #   pnpm exec wrangler d1 time-travel restore <DB_NAME> --timestamp=<ISO>
      # PROD ONLY: capture two independent restore paths BEFORE migrations
      # touch the database.
      #
      # 1. The Time Travel bookmark - D1's built-in point-in-time restore
      #    (30 days). Printed to the job log so a rollback is one command:
      #      wrangler d1 time-travel restore mercurypitch-db --bookmark=<id>
      # 2. A full copy into the dedicated mercurypitch-db-backup database -
      #    a live duplicate usable for debugging or forward repair. The SQL
      #    dump exists only on this ephemeral runner and is NEVER uploaded
      #    as an artifact (public repo: an exported database with emails and
      #    password hashes must not be downloadable). The backup database is
      #    dropped and recreated each release; the hardcoded -backup name
      #    can never collide with the real database.
      - name: Back up prod database (bookmark + copy)
        if: env.DEPLOY_ENV == 'prod'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/db-worker
        run: |
          set -euo pipefail
          echo "== Time Travel bookmark (restore point) =="
          pnpm exec wrangler d1 time-travel info "${DB_NAME}" --env "${DEPLOY_ENV}"

          echo "== Copying ${DB_NAME} into mercurypitch-db-backup =="
          pnpm exec wrangler d1 export "${DB_NAME}" --remote --env "${DEPLOY_ENV}"             --output=/tmp/prod-backup.sql
          pnpm exec wrangler d1 delete mercurypitch-db-backup --skip-confirmation || true
          pnpm exec wrangler d1 create mercurypitch-db-backup --location eeur
          backup_id=$(pnpm exec wrangler d1 list --json             | jq -r '.[] | select(.name == "mercurypitch-db-backup") | .uuid' | head -1)
          if [ -z "$backup_id" ]; then
            echo "Could not resolve the backup database id."
            exit 1
          fi
          pnpm exec wrangler d1 execute mercurypitch-db-backup --remote             --file=/tmp/prod-backup.sql -y
          rm -f /tmp/prod-backup.sql
          echo "Backup complete: mercurypitch-db-backup ($backup_id)"

      # The chain's one blind spot, closed automatically.
      #
      # `0001_baseline.sql` declares every column inside
      # `CREATE TABLE IF NOT EXISTS`, which is a no-op on a table that already
      # exists — it does not compare shapes. A database built by
      # `d1 execute schema.sql` before the migration era therefore keeps its
      # older version of every table, and a column the baseline added to an
      # already-existing table never arrives. Where the baseline then indexes
      # such a column, the FIRST migration fails; where it does not, the chain
      # reports success and the app writes to columns that are not there.
      #
      # This step derives the gap instead of being told about it: it applies
      # only 0001 to a throwaway local database, reads the target's real shape,
      # and adds what is missing from tables both have. A column some LATER
      # migration adds by ALTER is absent from a baseline-only reference, so it
      # is never pre-added and that migration still succeeds. It is a no-op
      # against any database the migrations built — which is dev, every PR
      # preview, and prod once this has run there once.
      #
      # It runs on dev too, deliberately. A step that only ever executes
      # during a release is a step nobody has tested.
      - name: Reconcile schema with the migrations' assumed shape
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/reconcile-d1-schema.mjs \
            --db "${DB_NAME}" --env "${DEPLOY_ENV}" --apply

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/db-worker
          command: d1 migrations apply ${{ env.DB_NAME }} --remote --env ${{ env.DEPLOY_ENV }}
          packageManager: 'pnpm'

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/db-worker
          command: deploy --env ${{ env.DEPLOY_ENV }}
          packageManager: 'pnpm'
