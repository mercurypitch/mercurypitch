name: Mercury Pitch Mobile

# A caller. See `.github/workflows/capacitor-app.yml` for what it does and
# why — every lesson in it was paid for by Beside Cue's builds, and this app
# reuses them rather than re-learning them.
#
# What is different here, and deliberately:
#
#   The path filter is wide. `apps/mercurypitch` aliases `@` to the web app's
#   own `src/`, so the native app IS the web app plus a shell — a change under
#   `src/` really does change what ships to a phone, and a filter that ignored
#   it would let a regression reach TestFlight untested.
#
#   Which is exactly why TestFlight uploads come from TAGS ONLY. main moves
#   several times a day here; App Store Connect meters uploads per app per day
#   and refuses the run AFTER the archive is built (error 90382). Every push to
#   main still archives — the compile, the signature and the profile are all
#   checked — it simply does not spend an upload.
#
# Mercury Pitch's native app versions independently of the web app, so this
# does not use the `v*` tags that ship mercurypitch.com to production.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mercurypitch/**'
      - 'packages/audio-io/**'
      - 'packages/mobile-runtime/**'
      - 'packages/pitch-engine/**'
      - 'packages/ios-audio-session/**'
      - 'src/**'
      # The public/ tree the native bundle carries. Kept in step with
      # apps/mercurypitch/native-assets.mjs: the manifest names these files,
      # the build copies them, and assert-bundle fails when one of them is
      # gone -- so a change to the art has to run the build that checks it.
      # Deliberately narrow rather than `public/**`: the night-app packs and
      # the drum kits change often and ship nowhere near a phone.
      - 'public/models/**'
      - 'public/brand-mark.svg'
      - 'public/favicon.svg'
      - 'public/karaoke-night-stage.webp'
      - 'public/karaoke-night/tokyo-cyber-*.webp'
      - 'public/mic/guide-vocal-*.webp'
      - 'public/characters/**'
      - 'public/drum-night/pocket-console-landscape.webp'
      - 'public/ear-lab/regulator-room-landscape.webp'
      - 'public/ear-lab/regulator-room-portrait.webp'
      - 'public/ear-lab/glasshouse-bench-landscape.webp'
      - 'public/ear-lab/glasshouse-bench-portrait.webp'
      - 'public/exercises/examples/**'
      - 'public/guitar-night/velvet-rehearsal.webp'
      - 'public/jam/room-stage.webp'
      - 'public/legends/**'
      - 'public/piano-night/afterglow-studio-landscape.webp'
      - 'public/sing/retro-analog-studio*.webp'
      - 'public/rooms/alley/**'
      - 'public/badges/*.webp'
      - 'public/leagues/l*.webp'
      - 'public/leagues/locked.webp'
      - 'public/leaderboard/place-*.webp'
      - 'public/progress/*.webp'
      - 'gradle/signing.gradle'
      - 'package.json'
      - 'pnpm-lock.yaml'
      # The size gate's measurement lives in a script, not inline in the
      # workflow -- a change to it that no native build ran is a gate nobody
      # checked.
      - '.github/scripts/**'
      - '.github/workflows/mercurypitch-mobile.yml'
      - '.github/workflows/capacitor-app.yml'
  # No `paths:` on a trigger that also carries tags — a tag placed on a commit
  # already on main contains no commits, so the filter would match nothing and
  # skip the release. The reusable workflow's `changes` job filters pushes and
  # lets every tag through.
  push:
    branches: [main]
    tags: ['mp-v*']
  workflow_dispatch:
    inputs:
      # Which db-worker the build compiles in (apps/mercurypitch/api-base.mjs).
      # `dev` for everything that is tested -- and every push, pull request
      # and tag builds `dev`, because only a dispatch has inputs. `production`
      # is picked by hand, for the build that goes to a store, and nothing
      # else in this repository can set it.
      #
      # A TAG PUSH THEREFORE UPLOADS A DEV BUILD to TestFlight. The store
      # binary is a dispatch run ON THE TAG REF with api-target=production,
      # and production reaches ONLY the store binaries of that run (the
      # Android release rebuild and the App Store archive): the debug APK,
      # the simulator app and the ad-hoc IPA are dev whatever was picked. A
      # production dispatch on anything but a tag fails before it builds.
      # See apps/mercurypitch/.env.example, "Which db-worker the build
      # talks to".
      api-target:
        description: 'db-worker to compile in: dev for every test build, production only for a store submission'
        type: choice
        options:
          - dev
          - production
        default: dev

permissions:
  contents: read

concurrency:
  group: mercurypitch-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A production build that is not the store submission is a production
  # binary nobody meant to make: refused before anything is built.
  target-guard:
    name: API target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Production only on a tag
        shell: bash
        env:
          API_TARGET: ${{ inputs.api-target || 'dev' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$API_TARGET" == "production" && "$REF_TYPE" != "tag" ]]; then
            echo "::error::api-target=production builds the store binary, and a store binary comes from an mp-v tag. This run is on the $REF_TYPE '$REF_NAME'. Dispatch it on the tag, or pick dev."
            exit 1
          fi
          echo "api-target $API_TARGET on the $REF_TYPE '$REF_NAME'"

  build:
    needs: target-guard
    uses: ./.github/workflows/capacitor-app.yml
    permissions:
      contents: read
    with:
      app-name: Mercury Pitch
      app-slug: mercurypitch
      app-dir: apps/mercurypitch
      package-name: '@irchiinnuss/mercury-pitch-app'
      bundle-id: com.irchiinnuss.mercurypitch
      tag-prefix: mp-v
      signing-env-prefix: MERCURYPITCH
      profile-build-setting: MERCURYPITCH_PROFILE
      # Kept in step with the pull_request `paths:` filter above.
      changed-paths-regex: '^(apps/mercurypitch/|packages/(audio-io|mobile-runtime|pitch-engine|ios-audio-session)/|src/|public/(models|characters|legends)/|public/exercises/examples/|public/(brand-mark\.svg|favicon\.svg|karaoke-night-stage\.webp)$|public/(drum-night/pocket-console-landscape|ear-lab/(regulator-room|glasshouse-bench)-(landscape|portrait)|guitar-night/velvet-rehearsal|jam/room-stage|piano-night/afterglow-studio-landscape)\.webp$|public/sing/retro-analog-studio[^/]*\.webp$|public/karaoke-night/tokyo-cyber-[^/]*\.webp$|public/mic/guide-vocal-[^/]*\.webp$|public/rooms/alley/|public/badges/[^/]*\.webp$|public/leagues/(l[1-7]|locked)\.webp$|public/leaderboard/place-[^/]*\.webp$|public/progress/(resonance-atlas|mercury-pressing)\.webp$|gradle/signing\.gradle$|package\.json$|pnpm-lock\.yaml$|\.github/scripts/|\.github/workflows/(mercurypitch-mobile|capacitor-app)\.yml$)'
      # Exported to the build and to assert-bundle alike, so the check reads
      # the same answer the build compiled in. Every build is dev -- the debug
      # APK, the simulator app, the ad-hoc IPA -- and the store binaries take
      # the dispatch's pick on top (store-build-env). `inputs` is empty outside
      # a dispatch, which is what makes every other trigger a dev build.
      #
      # The second store line is the portable console: the committed .env
      # turns it on, a process variable wins over an env file in Vite, and a
      # production store binary must not carry it or the Developer screen.
      # Every other pick renders it as an empty line, which the export skips,
      # so a TestFlight build keeps what .env says. Never `=` with an empty
      # value: that would win over .env too, and take it out of TestFlight.
      # vite.config.ts takes it out of a production build on its own as well
      # (api-base.mjs portableConsoleFor); this is the belt to that brace.
      web-build-env: |
        MERCURYPITCH_API_TARGET=dev
      store-build-env: |
        MERCURYPITCH_API_TARGET=${{ inputs.api-target || 'dev' }}
        ${{ inputs.api-target == 'production' && 'VITE_PORTABLE_CONSOLE=false' || '' }}
      distribution-env-name: VITE_MERCURYPITCH_DISTRIBUTION
      platform-env-name: VITE_MERCURYPITCH_NATIVE_PLATFORM
      testflight-upload-from: tags
      # Real StoreKit, never the mock: a TestFlight build sells Mercury Pitch
      # Cloud through RevenueCat with the iOS key, and TestFlight runs every
      # purchase against the App Store sandbox (plan S8 step 25). A build
      # without its platform's key sells nothing and says "not available
      # yet" (apps/mercurypitch/src/infrastructure/purchases-setup.ts).
      testflight-purchase-mode: store
      # The release APK was 98.7 MB against the default 100 MB ceiling at
      # mp-v0.8.11, before R8. The owner raised the ceiling to 150 MB on
      # 4 Oct 2026; the warning stays at the default 60 MB, so every run
      # still shows the size it is over.
      size-fail-mb: 150
      # What a store binary has to be true of: the wasm runtime and the model
      # are vendored AND referenced, and nothing sells anything. The checks
      # live in apps/mercurypitch/scripts/assert-bundle.mjs, which the PR
      # gate calls as well — they were two copies of a weaker check, and
      # both were green on a build that fetched the runtime from a CDN.
      #
      # --android-assets only after cap sync has run; before that the
      # directory is last run's leftovers or nothing at all.
      #
      # A production store binary is also held to carrying no portable
      # console, no Developer screen and no floating developer console, in
      # each tree it will ship from: `--store-binary` adds the floating one,
      # which the web ships and so the default check cannot name. A test
      # build carries all three on purpose, so only production is checked.
      verify-assets: |
        if [ "$STAGE" = synced ]; then
          node apps/mercurypitch/scripts/assert-bundle.mjs "$DIST_DIR" \
            --android-assets "$ANDROID_ASSETS_DIR"
        else
          node apps/mercurypitch/scripts/assert-bundle.mjs "$DIST_DIR"
        fi
        if [ "${MERCURYPITCH_API_TARGET:-}" = production ]; then
          node scripts/assert-no-portable-console.mjs "$DIST_DIR" --store-binary
          if [ "$STAGE" = synced ]; then
            node scripts/assert-no-portable-console.mjs "$ANDROID_ASSETS_DIR" --store-binary
          fi
        fi
    secrets:
      keystore-base64: ${{ secrets.MERCURYPITCH_KEYSTORE_BASE64 }}
      keystore-password: ${{ secrets.MERCURYPITCH_KEYSTORE_PASSWORD }}
      key-alias: ${{ secrets.MERCURYPITCH_KEY_ALIAS }}
      key-password: ${{ secrets.MERCURYPITCH_KEY_PASSWORD }}
      debug-keystore-base64: ${{ secrets.MERCURYPITCH_DEBUG_KEYSTORE_BASE64 }}
      apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
      apple-asc-key-id: ${{ secrets.APPLE_ASC_KEY_ID }}
      apple-asc-issuer-id: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      apple-asc-key-p8: ${{ secrets.APPLE_ASC_KEY_P8 }}
      apple-certificate-p12-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      appstore-profile-base64: ${{ secrets.MERCURYPITCH_APPSTORE_PROFILE_BASE64 }}
      appstore-profile-name: ${{ secrets.MERCURYPITCH_APPSTORE_PROFILE_NAME }}
      adhoc-profile-base64: ${{ secrets.MERCURYPITCH_ADHOC_PROFILE_BASE64 }}
      adhoc-profile-name: ${{ secrets.MERCURYPITCH_ADHOC_PROFILE_NAME }}
      revenuecat-ios-key: ${{ secrets.MERCURYPITCH_REVENUECAT_IOS_KEY }}
      revenuecat-android-key: ${{ secrets.MERCURYPITCH_REVENUECAT_ANDROID_KEY }}
