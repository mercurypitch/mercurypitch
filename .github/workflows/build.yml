name: Build & Deploy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: build-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy App
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Debug Info
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Ref: $REF"
          echo "Target Branch: $BASE_REF"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_ENV" == "dev" ]]; then
              pnpm run build:dev
            else
              pnpm run build
            fi
          elif [[ "$REF" == "refs/heads/main" ]]; then
            pnpm run build:dev
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            pnpm run build:dev
          else
            pnpm run build
          fi

      - name: Verify build output
        run: |
          test -f dist/index.html || exit 1
          ls dist/assets/*.js >/dev/null 2>&1 || exit 1
          ls dist/assets/*.css >/dev/null 2>&1 || exit 1
          echo "Build artifacts verified"

      # Manual Deploy via workflow_dispatch
      - name: Manual Deploy
        if: github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ github.event.inputs.environment }}
          packageManager: 'pnpm'

      # Deploys to dev.mercurypitch.com when pushing to the main branch
      - name: Deploy to Dev Environment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env dev
          packageManager: 'pnpm'

      # Creates or reuses an isolated D1 database for this PR, applies the
      # branch's schema, and uploads the branch's DB Worker as an immutable
      # version. The matching DB preview URL is baked into the frontend before
      # its own immutable version is uploaded. Neither active dev deployment is
      # changed, and concurrent PRs cannot share or overwrite authoring data.
      #
      # The DB version reuses the mercury-pitch-db-dev Worker name so Wrangler
      # inherits its ADMIN_KEY and JWT_SECRET secrets. Its generated config
      # explicitly enables Preview URLs while keeping the normal workers.dev
      # route disabled.
      - name: Deploy PR Preview (versioned)
        id: deploy-preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          pr_database_name="mercurypitch-pr-${PR_NUMBER}"
          database_id=$(
            pnpm exec wrangler d1 list --json \
              | jq -r --arg name "$pr_database_name" \
                '.[] | select(.name == $name) | .uuid' \
              | head -1
          )

          if [ -z "$database_id" ]; then
            pnpm exec wrangler d1 create "$pr_database_name" --location eeur
            database_id=$(
              pnpm exec wrangler d1 list --json \
                | jq -r --arg name "$pr_database_name" \
                  '.[] | select(.name == $name) | .uuid' \
                | head -1
            )
          fi

          if [ -z "$database_id" ]; then
            echo "Could not resolve D1 database id for $pr_database_name."
            exit 1
          fi

          generated_db_config="workers/db-worker/wrangler.pr-preview.generated.jsonc"
          PR_DATABASE_NAME="$pr_database_name" \
          PR_DATABASE_ID="$database_id" \
          GENERATED_DB_CONFIG="$generated_db_config" \
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')

          const template = readFileSync(
            'workers/db-worker/wrangler.pr-preview.template.jsonc',
            'utf8',
          )
          const generated = template
            .replace('__PR_DATABASE_NAME__', process.env.PR_DATABASE_NAME)
            .replace(
              '00000000-0000-0000-0000-000000000000',
              process.env.PR_DATABASE_ID,
            )

          writeFileSync(process.env.GENERATED_DB_CONFIG, generated)
          NODE

          pnpm exec wrangler d1 execute "$pr_database_name" \
            --remote \
            --file=workers/db-worker/schema.sql \
            --config "$generated_db_config" \
            -y

          pnpm exec wrangler versions upload \
            --config "$generated_db_config" \
            --message "PR #${PR_NUMBER} ${GITHUB_SHA}" \
            2>&1 | tee db-upload.log

          db_preview_url=$(
            grep -iE 'preview url' db-upload.log \
              | grep -oiE 'https://[a-z0-9.-]+\.workers\.dev' \
              | head -1
          )
          if [ -z "$db_preview_url" ]; then
            db_preview_url=$(
              grep -oiE 'https://[a-z0-9.-]+\.workers\.dev' db-upload.log \
                | head -1
            )
          fi
          if [ -z "$db_preview_url" ]; then
            echo "DB Worker version did not provide a Preview URL."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            "$db_preview_url/api/guided-exercises" \
            > db-smoke.json
          jq -e '.exercises | arrays' db-smoke.json > /dev/null

          export VITE_API_BASE_URL="$db_preview_url"
          pnpm exec wrangler versions upload --env preview 2>&1 | tee upload.log
          # `versions upload` runs Wrangler's custom build a second time. Guard
          # both sides of the pairing: the generated bundle must point to this
          # PR's immutable DB version and must never point at production.
          grep -R -F -q --include='*.js' "$db_preview_url" dist/assets
          if grep -R -q --include='*.js' 'https://api.mercurypitch.com' dist/assets; then
            echo "Preview bundle unexpectedly targets the production API."
            exit 1
          fi
          # Prefer the explicit "Version Preview URL" line; fall back to any
          # workers.dev URL in the output.
          url=$(grep -iE 'preview url' upload.log \
                  | grep -oiE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          if [ -z "$url" ]; then
            url=$(grep -oiE 'https://[a-z0-9.-]+\.workers\.dev' upload.log | head -1)
          fi
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
          echo "db-preview-url=$db_preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: ${url:-<none - enable Preview URLs on the Worker>}"

      # Post or update PR comment with preview link from template
      - name: Post Preview Link
        if: github.event_name == 'pull_request' && steps.deploy-preview.outputs.deployment-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const templatePath = path.join(process.env.GITHUB_WORKSPACE, '.github/workflows/pr-deployment-table.md');
            let body = fs.readFileSync(templatePath, 'utf8');

            const url = '${{ steps.deploy-preview.outputs.deployment-url }}';
            const commit = context.sha.substring(0, 7);
            const commitUrl = `${context.server_url}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const logsUrl = `${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const updated = new Date().toUTCString();

            body = body
              .replace('LOGS_URL', logsUrl)
              .replace('COMMIT_SHA', commit)
              .replace('COMMIT_URL', commitUrl)
              .replace('PREVIEW_URL', url)
              .replace('UPDATED_TIME', updated);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Deploying with Cloudflare Workers')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      # Deploys to mercurypitch.com when pushing a tag starting with 'v'
      - name: Deploy to Production Environment
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env prod
          packageManager: 'pnpm'

  cleanup-pr-preview:
    name: Remove PR Preview Data
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove isolated D1 and guided media
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          pr_database_name="mercurypitch-pr-${PR_NUMBER}"
          database_id=$(
            pnpm exec wrangler d1 list --json \
              | jq -r --arg name "$pr_database_name" \
                '.[] | select(.name == $name) | .uuid' \
              | head -1
          )
          if [ -z "$database_id" ]; then
            echo "No D1 preview database exists for PR #${PR_NUMBER}."
            exit 0
          fi

          media_json=$(
            pnpm exec wrangler d1 execute "$pr_database_name" \
              --remote \
              --command "SELECT objectKey FROM guidedExerciseMedia" \
              --json 2>/dev/null \
              || true
          )
          while IFS= read -r object_key; do
            if [ -n "$object_key" ]; then
              if ! pnpm exec wrangler r2 object delete \
                "mercurypitch-guided-media-dev/$object_key" \
                --remote \
                -y; then
                echo "::warning::Could not remove preview media object $object_key"
              fi
            fi
          done < <(
            printf '%s' "$media_json" \
              | jq -r '.[].results[]?.objectKey // empty' 2>/dev/null \
              || true
          )

          pnpm exec wrangler d1 delete "$pr_database_name" -y
