name: Build & Deploy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    # A preview deploys the MercuryPitch frontend and DB Worker. Documentation
    # and the independently packaged Beside Cue app are validated by PR Gate,
    # but cannot affect this deployment.
    paths:
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'workers/db-worker/**'
      - 'scripts/gen-preview-definitions-sql.mjs'
      - '*.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - '.env.development'
      - '.env.production'
      - '.env'
      - '.github/workflows/build.yml'
      - '.github/workflows/pr-deployment-table.md'
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: build-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Release tags deploy Jam first, then migrate the prod database and deploy
  # the prod DB Worker through the same reusable workflow the dev path uses.
  # The order matters because the DB Worker binds the JamHostVerifier named
  # entrypoint. The frontend prod deploy below can still run in parallel.
  deploy-db-prod:
    name: Prod Jam + DB migrations + worker
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    uses: ./.github/workflows/deploy-db.yml
    with:
      environment: prod
    secrets: inherit

  build-and-deploy:
    name: Build & Deploy App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The lockfile is shared by the monorepo, so a Beside-only dependency
      # change necessarily matches this workflow's path filter. Detect that
      # combination before installing dependencies and leave its validation to
      # PR Gate. A lockfile-only change remains deploy-relevant by default.
      - name: Resolve preview scope
        id: preview-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          deploy=true

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            deploy=false
            beside=false
            shared_manifest=false

            if [[ -z "$BASE_SHA" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              deploy=true
            else
              while IFS= read -r file; do
                [[ -z "$file" ]] && continue

                case "$file" in
                  apps/beside-cue/*|packages/beside-cue-core/*|packages/mobile-runtime/*)
                    beside=true
                    ;;
                  pnpm-lock.yaml|pnpm-workspace.yaml)
                    shared_manifest=true
                    ;;
                  .github/workflows/build.yml|.github/workflows/pr-deployment-table.md)
                    deploy=true
                    ;;
                  .github/workflows/*)
                    ;;
                  docs/*|*.md|.githooks/*|.claude/*|.impeccable/*)
                    ;;
                  *)
                    deploy=true
                    ;;
                esac
              done < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")

              if [[ "$deploy" == false && "$shared_manifest" == true && "$beside" == false ]]; then
                deploy=true
              fi
            fi
          fi

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "pull_request" && "$deploy" == false ]]; then
            echo "Preview skipped: this pull request changes only Beside Cue or documentation." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Debug Info
        if: steps.preview-scope.outputs.deploy == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Ref: $REF"
          echo "Target Branch: $BASE_REF"

      - uses: pnpm/action-setup@v4
        if: steps.preview-scope.outputs.deploy == 'true'
        with:
          version: 11.12.0

      - name: Setup Node.js
        if: steps.preview-scope.outputs.deploy == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.preview-scope.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      # PR Gate owns pull-request build validation. Direct main, tag, and
      # manual deployments keep a pre-deploy gate; PR previews skip it because
      # `wrangler versions upload` builds the exact artifact it uploads below.
      - name: Build app before direct deployment
        if: steps.preview-scope.outputs.deploy == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_ENV" == "dev" ]]; then
              pnpm run build:dev
            else
              pnpm run build
            fi
          elif [[ "$REF" == "refs/heads/main" ]]; then
            pnpm run build:dev
          else
            pnpm run build
          fi

      - name: Verify build output
        if: steps.preview-scope.outputs.deploy == 'true' && github.event_name != 'pull_request'
        run: |
          test -f dist/index.html || exit 1
          ls dist/assets/*.js >/dev/null 2>&1 || exit 1
          ls dist/assets/*.css >/dev/null 2>&1 || exit 1
          echo "Build artifacts verified"

      # Manual Deploy via workflow_dispatch
      - name: Manual Deploy
        if: github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ github.event.inputs.environment }}
          packageManager: 'pnpm'

      # Deploys to dev.mercurypitch.com when pushing to the main branch
      - name: Deploy to Dev Environment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env dev
          packageManager: 'pnpm'

      # Creates or reuses one shared D1 database for all PR previews, applies
      # the branch's additive schema, and uploads the branch's DB Worker as an
      # immutable version. The matching DB preview URL is baked into the
      # frontend before its own immutable version is uploaded. Neither active
      # dev deployment is changed, and Cloudflare retains only one preview D1.
      #
      # The DB version reuses the mercury-pitch-db-dev Worker name so Wrangler
      # inherits its ADMIN_KEY and JWT_SECRET secrets. Its generated config
      # explicitly enables Preview URLs while keeping the normal workers.dev
      # route disabled.
      - name: Deploy PR Preview (versioned)
        id: deploy-preview
        if: steps.preview-scope.outputs.deploy == 'true' && github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          preview_database_name="mercurypitch-db-preview"
          db_worker_name="mercury-pitch-db-dev"
          frontend_worker_name="mercurypitch-preview"
          database_id=$(
            pnpm exec wrangler d1 list --json \
              | jq -r --arg name "$preview_database_name" \
                '.[] | select(.name == $name) | .uuid' \
              | head -1
          )

          if [ -z "$database_id" ]; then
            pnpm exec wrangler d1 create "$preview_database_name" --location eeur
            database_id=$(
              pnpm exec wrangler d1 list --json \
                | jq -r --arg name "$preview_database_name" \
                  '.[] | select(.name == $name) | .uuid' \
                | head -1
            )
          fi

          if [ -z "$database_id" ]; then
            echo "Could not resolve D1 database id for $preview_database_name."
            exit 1
          fi

          generated_db_config="workers/db-worker/wrangler.pr-preview.generated.jsonc"
          PREVIEW_DATABASE_ID="$database_id" \
          GENERATED_DB_CONFIG="$generated_db_config" \
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')

          const template = readFileSync(
            'workers/db-worker/wrangler.pr-preview.template.jsonc',
            'utf8',
          )
          const generated = template.replace(
            '00000000-0000-0000-0000-000000000000',
            process.env.PREVIEW_DATABASE_ID,
          )

          writeFileSync(process.env.GENERATED_DB_CONFIG, generated)
          NODE

          # The schema ships as the tracked migration chain (schema.sql was
          # retired by the migration work): wrangler records applied files in
          # d1_migrations, so re-runs from later PRs only apply what is new.
          # Concurrent PR runs are not serialized by wrangler; the chain is
          # additive-only, so a duplicate apply loses the race harmlessly on
          # the tracking insert rather than corrupting the shared preview DB.
          pnpm exec wrangler d1 migrations apply "$preview_database_name" \
            --remote \
            --config "$generated_db_config"

          # PR previews use an isolated database, so keep the weekly challenge
          # UI testable with one active fixture and one archived fixture. This
          # seed is never applied to dev or production.
          pnpm exec wrangler d1 execute "$preview_database_name" \
            --remote \
            --config "$generated_db_config" \
            --file workers/db-worker/preview-weekly-seed.sql

          # Challenge / badge / achievement definitions. Without these the
          # Challenges tab renders completely empty on every preview — no
          # cards, every category counter reading 0, no badges — which is
          # indistinguishable from a broken feature and hid a real badge
          # fix from review. Dev and prod get the same rows from
          # scripts/seed-remote-db.mjs via the worker's admin API; CI has
          # no admin key, so it applies the identical content as SQL.
          # Upserts keyed on deterministic ids, so concurrent PR runs
          # against this shared database converge instead of conflicting.
          node scripts/gen-preview-definitions-sql.mjs \
            > "$RUNNER_TEMP/preview-definitions.sql"
          pnpm exec wrangler d1 execute "$preview_database_name" \
            --remote \
            --config "$generated_db_config" \
            --file "$RUNNER_TEMP/preview-definitions.sql"

          preview_settings=$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --header "Cloudflare-Workers-Script-Api-Date: 2025-08-01" \
              --data '{"enabled":false,"previews_enabled":true}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${db_worker_name}/subdomain"
          )
          printf '%s' "$preview_settings" \
            | jq -e '.success == true and .result.previews_enabled == true' \
            > /dev/null

          account_subdomain_response=$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          )
          workers_dev_subdomain=$(
            printf '%s' "$account_subdomain_response" \
              | jq -r '.result.subdomain // empty'
          )
          if [ -z "$workers_dev_subdomain" ]; then
            echo "Could not resolve the account workers.dev subdomain."
            exit 1
          fi

          pnpm exec wrangler versions upload \
            --config "$generated_db_config" \
            --message "PR #${PR_NUMBER} ${GITHUB_SHA}" \
            2>&1 | tee db-upload.log

          db_version_id=$(
            grep -E 'Worker Version ID:' db-upload.log \
              | grep -oE '[0-9a-f]{8}-[0-9a-f-]{27,}' \
              | tail -1 \
              || true
          )
          if [ -z "$db_version_id" ]; then
            echo "DB Worker upload did not provide a version id."
            exit 1
          fi
          db_version_prefix="${db_version_id%%-*}"
          db_preview_url="https://${db_version_prefix}-${db_worker_name}.${workers_dev_subdomain}.workers.dev"

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            "$db_preview_url/api/guided-exercises" \
            > db-smoke.json
          jq -e '.exercises | arrays' db-smoke.json > /dev/null

          export VITE_API_BASE_URL="$db_preview_url"
          # Previews are served WITHOUT the jam signaling worker, so the real
          # client hangs on a WebSocket that never connects and the Jam tab is
          # a dead end. The mock renders the room with invented peers, clearly
          # labelled as such.
          #
          # It has to be exported HERE, not on the build step above: as the
          # comment below says, `versions upload` runs Wrangler's custom build
          # a second time, and that rebuild is what becomes the preview
          # bundle. Anything set on the earlier build is thrown away -- which
          # is exactly how the first attempt at this shipped a preview that
          # still tried to open a real WebSocket.
          #
          # Deliberately not set for the dev or prod deploys: dev.mercurypitch.com
          # HAS the jam worker, and mocking there would hide the bugs this
          # feature is made of.
          export VITE_JAM_MOCK_SIGNALING=1
          pnpm exec wrangler versions upload --env preview 2>&1 | tee upload.log
          # `versions upload` runs Wrangler's custom build a second time. Guard
          # both sides of the pairing: the generated bundle must point to this
          # PR's immutable DB version and must never point at production.
          grep -R -F -q --include='*.js' "$db_preview_url" dist/assets
          if grep -R -q --include='*.js' 'https://api.mercurypitch.com' dist/assets; then
            echo "Preview bundle unexpectedly targets the production API."
            exit 1
          fi

          frontend_version_id=$(
            grep -E 'Worker Version ID:' upload.log \
              | grep -oE '[0-9a-f]{8}-[0-9a-f-]{27,}' \
              | tail -1 \
              || true
          )
          if [ -z "$frontend_version_id" ]; then
            echo "Frontend Worker upload did not provide a version id."
            exit 1
          fi
          frontend_version_prefix="${frontend_version_id%%-*}"
          url="https://${frontend_version_prefix}-${frontend_worker_name}.${workers_dev_subdomain}.workers.dev"

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            "$url/" \
            > /dev/null

          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
          echo "db-preview-url=$db_preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"

      # Post or update PR comment with preview link from template
      - name: Post Preview Link
        if: github.event_name == 'pull_request' && steps.deploy-preview.outputs.deployment-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const templatePath = path.join(process.env.GITHUB_WORKSPACE, '.github/workflows/pr-deployment-table.md');
            let body = fs.readFileSync(templatePath, 'utf8');

            const url = '${{ steps.deploy-preview.outputs.deployment-url }}';
            const commit = context.sha.substring(0, 7);
            // Context uses camelCase; `server_url` is undefined and rendered
            // literal "undefined/..." links in the PR comment.
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const logsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const updated = new Date().toUTCString();

            body = body
              .replace('LOGS_URL', logsUrl)
              .replace('COMMIT_SHA', commit)
              .replace('COMMIT_URL', commitUrl)
              .replace('PREVIEW_URL', url)
              .replace('UPDATED_TIME', updated);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Deploying with Cloudflare Workers')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      # Deploys to mercurypitch.com when pushing a tag starting with 'v'
      - name: Deploy to Production Environment
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env prod
          packageManager: 'pnpm'
