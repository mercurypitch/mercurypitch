name: Build & Deploy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: build-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Release tags migrate the prod database and deploy the prod db-worker via
  # the same reusable workflow the dev path uses (migrations apply before the
  # worker inside that job). The frontend prod deploy below runs in parallel;
  # that is safe because the migration chain is additive-only and the app
  # tolerates a briefly older API (bundled-seed fallbacks) - the invariant
  # that matters, migrations-before-worker, is guaranteed in-job.
  deploy-db-prod:
    name: Prod DB migrations + worker
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    uses: ./.github/workflows/deploy-db.yml
    with:
      environment: prod
    secrets: inherit

  build-and-deploy:
    name: Build & Deploy App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Debug Info
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Ref: $REF"
          echo "Target Branch: $BASE_REF"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_ENV" == "dev" ]]; then
              pnpm run build:dev
            else
              pnpm run build
            fi
          elif [[ "$REF" == "refs/heads/main" ]]; then
            pnpm run build:dev
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            pnpm run build:dev
          else
            pnpm run build
          fi

      - name: Verify build output
        run: |
          test -f dist/index.html || exit 1
          ls dist/assets/*.js >/dev/null 2>&1 || exit 1
          ls dist/assets/*.css >/dev/null 2>&1 || exit 1
          echo "Build artifacts verified"

      # Manual Deploy via workflow_dispatch
      - name: Manual Deploy
        if: github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ github.event.inputs.environment }}
          packageManager: 'pnpm'

      # Deploys to dev.mercurypitch.com when pushing to the main branch
      - name: Deploy to Dev Environment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env dev
          packageManager: 'pnpm'

      # Creates or reuses one shared D1 database for all PR previews, applies
      # the branch's additive schema, and uploads the branch's DB Worker as an
      # immutable version. The matching DB preview URL is baked into the
      # frontend before its own immutable version is uploaded. Neither active
      # dev deployment is changed, and Cloudflare retains only one preview D1.
      #
      # The DB version reuses the mercury-pitch-db-dev Worker name so Wrangler
      # inherits its ADMIN_KEY and JWT_SECRET secrets. Its generated config
      # explicitly enables Preview URLs while keeping the normal workers.dev
      # route disabled.
      - name: Deploy PR Preview (versioned)
        id: deploy-preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          preview_database_name="mercurypitch-db-preview"
          db_worker_name="mercury-pitch-db-dev"
          frontend_worker_name="mercurypitch-preview"
          database_id=$(
            pnpm exec wrangler d1 list --json \
              | jq -r --arg name "$preview_database_name" \
                '.[] | select(.name == $name) | .uuid' \
              | head -1
          )

          if [ -z "$database_id" ]; then
            pnpm exec wrangler d1 create "$preview_database_name" --location eeur
            database_id=$(
              pnpm exec wrangler d1 list --json \
                | jq -r --arg name "$preview_database_name" \
                  '.[] | select(.name == $name) | .uuid' \
                | head -1
            )
          fi

          if [ -z "$database_id" ]; then
            echo "Could not resolve D1 database id for $preview_database_name."
            exit 1
          fi

          generated_db_config="workers/db-worker/wrangler.pr-preview.generated.jsonc"
          PREVIEW_DATABASE_ID="$database_id" \
          GENERATED_DB_CONFIG="$generated_db_config" \
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')

          const template = readFileSync(
            'workers/db-worker/wrangler.pr-preview.template.jsonc',
            'utf8',
          )
          const generated = template.replace(
            '00000000-0000-0000-0000-000000000000',
            process.env.PREVIEW_DATABASE_ID,
          )

          writeFileSync(process.env.GENERATED_DB_CONFIG, generated)
          NODE

          # The schema ships as the tracked migration chain (schema.sql was
          # retired by the migration work): wrangler records applied files in
          # d1_migrations, so re-runs from later PRs only apply what is new.
          # Concurrent PR runs are not serialized by wrangler; the chain is
          # additive-only, so a duplicate apply loses the race harmlessly on
          # the tracking insert rather than corrupting the shared preview DB.
          pnpm exec wrangler d1 migrations apply "$preview_database_name" \
            --remote \
            --config "$generated_db_config"

          # PR previews use an isolated database, so keep the weekly challenge
          # UI testable with one active fixture and one archived fixture. This
          # seed is never applied to dev or production.
          pnpm exec wrangler d1 execute "$preview_database_name" \
            --remote \
            --config "$generated_db_config" \
            --file workers/db-worker/preview-weekly-seed.sql

          preview_settings=$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --header "Cloudflare-Workers-Script-Api-Date: 2025-08-01" \
              --data '{"enabled":false,"previews_enabled":true}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${db_worker_name}/subdomain"
          )
          printf '%s' "$preview_settings" \
            | jq -e '.success == true and .result.previews_enabled == true' \
            > /dev/null

          account_subdomain_response=$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          )
          workers_dev_subdomain=$(
            printf '%s' "$account_subdomain_response" \
              | jq -r '.result.subdomain // empty'
          )
          if [ -z "$workers_dev_subdomain" ]; then
            echo "Could not resolve the account workers.dev subdomain."
            exit 1
          fi

          pnpm exec wrangler versions upload \
            --config "$generated_db_config" \
            --message "PR #${PR_NUMBER} ${GITHUB_SHA}" \
            2>&1 | tee db-upload.log

          db_version_id=$(
            grep -E 'Worker Version ID:' db-upload.log \
              | grep -oE '[0-9a-f]{8}-[0-9a-f-]{27,}' \
              | tail -1 \
              || true
          )
          if [ -z "$db_version_id" ]; then
            echo "DB Worker upload did not provide a version id."
            exit 1
          fi
          db_version_prefix="${db_version_id%%-*}"
          db_preview_url="https://${db_version_prefix}-${db_worker_name}.${workers_dev_subdomain}.workers.dev"

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            "$db_preview_url/api/guided-exercises" \
            > db-smoke.json
          jq -e '.exercises | arrays' db-smoke.json > /dev/null

          export VITE_API_BASE_URL="$db_preview_url"
          pnpm exec wrangler versions upload --env preview 2>&1 | tee upload.log
          # `versions upload` runs Wrangler's custom build a second time. Guard
          # both sides of the pairing: the generated bundle must point to this
          # PR's immutable DB version and must never point at production.
          grep -R -F -q --include='*.js' "$db_preview_url" dist/assets
          if grep -R -q --include='*.js' 'https://api.mercurypitch.com' dist/assets; then
            echo "Preview bundle unexpectedly targets the production API."
            exit 1
          fi

          frontend_version_id=$(
            grep -E 'Worker Version ID:' upload.log \
              | grep -oE '[0-9a-f]{8}-[0-9a-f-]{27,}' \
              | tail -1 \
              || true
          )
          if [ -z "$frontend_version_id" ]; then
            echo "Frontend Worker upload did not provide a version id."
            exit 1
          fi
          frontend_version_prefix="${frontend_version_id%%-*}"
          url="https://${frontend_version_prefix}-${frontend_worker_name}.${workers_dev_subdomain}.workers.dev"

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            "$url/" \
            > /dev/null

          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
          echo "db-preview-url=$db_preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"

      # Post or update PR comment with preview link from template
      - name: Post Preview Link
        if: github.event_name == 'pull_request' && steps.deploy-preview.outputs.deployment-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const templatePath = path.join(process.env.GITHUB_WORKSPACE, '.github/workflows/pr-deployment-table.md');
            let body = fs.readFileSync(templatePath, 'utf8');

            const url = '${{ steps.deploy-preview.outputs.deployment-url }}';
            const commit = context.sha.substring(0, 7);
            // Context uses camelCase; `server_url` is undefined and rendered
            // literal "undefined/..." links in the PR comment.
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const logsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const updated = new Date().toUTCString();

            body = body
              .replace('LOGS_URL', logsUrl)
              .replace('COMMIT_SHA', commit)
              .replace('COMMIT_URL', commitUrl)
              .replace('PREVIEW_URL', url)
              .replace('UPDATED_TIME', updated);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Deploying with Cloudflare Workers')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      # Deploys to mercurypitch.com when pushing a tag starting with 'v'
      - name: Deploy to Production Environment
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env prod
          packageManager: 'pnpm'
