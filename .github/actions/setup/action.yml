name: Setup
description: pnpm, Node 22 and a frozen-lockfile install. Run after actions/checkout.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.12.0

    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
