<text x="555" y="148" font-size="24" fill="#183e3b" text-anchor="start" font-family="Georgia, serif">What the playtest is revealing</text>
<text x="555" y="195" font-size="16" fill="#183e3b" text-anchor="start" >11 platforms, all available before singing.</text>
<text x="555" y="235" font-size="16" fill="#183e3b" text-anchor="start" >Three required voice stops: the same comfortable note.</text>
<text x="555" y="275" font-size="16" fill="#183e3b" text-anchor="start" >Only the final portrait opens access: the exit.</text>
<text x="555" y="315" font-size="16" fill="#183e3b" text-anchor="start" >Crescent changes X position, not platform orientation.</text>
<text x="555" y="355" font-size="16" fill="#183e3b" text-anchor="start" >Frost steps: 2.40 wide x 1.75 along travel.</text>
<text x="555" y="395" font-size="16" fill="#183e3b" text-anchor="start" >Safe broad pads are useful; repetition is the issue.</text>
