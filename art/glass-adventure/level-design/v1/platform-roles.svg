<rect x="656.0" y="216.0" width="150" height="80" rx="7" fill="url(#ice)" stroke="#ac8141" stroke-width="2"/><rect x="661.0" y="221.0" width="140" height="70" rx="4" fill="none" stroke="#d4c4a4"/>
<text x="165" y="160" font-size="19" fill="#183e3b" text-anchor="middle" font-family="Georgia, serif">Singing + turn pad</text>
