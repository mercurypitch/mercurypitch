<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
<title id="title">Platform roles / gate readability</title><desc id="desc">Concept families for the selected route. Candidate dimensions require collision, camera and device proof.</desc>
