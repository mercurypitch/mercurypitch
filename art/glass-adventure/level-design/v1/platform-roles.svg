<text x="931" y="275" font-size="15" fill="#183e3b" text-anchor="middle" >direction</text>
<path d="M930 224V171" fill="none" stroke="#ac8141" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<text x="66" y="430" font-size="23" fill="#183e3b" text-anchor="start" font-family="Georgia, serif">A wall that is a real encounter</text>
<path d="M100 594V491Q229 427 358 491V594" stroke="#b4a78b" stroke-width="22" fill="none"/>
<rect x="115" y="496" width="228" height="92" rx="4" fill="url(#ice)" stroke="#548a97" stroke-width="2"/>
<circle cx="229" cy="542" r="18" fill="#f6ead0" stroke="#ac8141" stroke-width="3"/>
<path d="M74 598H384" stroke="#ac8141" stroke-width="5"/>
<text x="464" y="473" font-size="16" fill="#183e3b" text-anchor="start" >Safe singing deck before the pane.</text>
<text x="464" y="506" font-size="16" fill="#183e3b" text-anchor="start" >Side returns + overhead arch prevent jumping around it.</text>
<text x="464" y="539" font-size="16" fill="#183e3b" text-anchor="start" >Gate parts share a reference, with unique runtime IDs.</text>
<text x="464" y="572" font-size="16" fill="#183e3b" text-anchor="start" >Only after that gate opens may Merc say a path opened.</text>
<text x="464" y="605" font-size="12" fill="#62795e" text-anchor="start" >Wall elevation is a diagram; final height follows jump clearance.</text>
<text x="32" y="683" font-size="15" fill="#183e3b" text-anchor="start" >Never rotate art alone. Keep its collision, visible edges, gaps and landing space consistent.</text>
<text x="32" y="713" font-size="11" fill="#ac8141" text-anchor="start" >GLASSWORKS  /  DESIGN STUDY  /  25 SEPTEMBER 2026</text>
