# Read by scripts/app-icons.sh. Shell syntax, values only.
#
# Masters, all 1024x1024, rendered once from docs/branding/logo/meniscus2/mark.svg
# (the primary mark, "Meniscus v2": quicksilver dome, pitch wave as the
# waterline) with rsvg-convert at 916px so the orb sits at ~86% of the
# square, on the brand's Obsidian field. Re-render only if the mark changes.
PREFIX=mercurypitch
# Obsidian, --bg-primary in docs/branding/BRAND.md. iOS has no background
# layer, so the field is baked into the light and dark masters; Android's
# adaptive background is this same colour so the two platforms agree.
ANDROID_BACKGROUND='#0D1117'
# Launch screens: the orb alone on the same field, sized as a fraction of
# the short side. Every splash file that already exists is regenerated at
# its own dimensions, so Capacitor's set of sizes is the source of truth.
SPLASH_BACKGROUND='#0d1117'
SPLASH_ORB_FRACTION=0.28
