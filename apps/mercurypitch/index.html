<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets the safe-area insets resolve to real
         numbers; without it every env(safe-area-inset-*) is 0 and the rail
         sits under the home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d12" />

    <title>Mercury Pitch</title>

    <!-- No canonical, no Open Graph, no JSON-LD, no robots. This document is
         never crawled: it is the shell inside an app binary. The web app's
         index.html carries all of that and keeps it. -->

    <!--
      Deliberately absent, and each one is a bug if it comes back:

      - The hosted webfont CDN. The web app links it from its own index.html
        head; a native app must render its first frame with the network off,
        so Inter, Outfit and Plus Jakarta Sans are self-hosted through
        @fontsource and imported from main.tsx (task A4).
        The CDN hostname is deliberately not spelled out anywhere in this
        file: task A4's acceptance check is a grep for it across dist/, and
        a comment mentioning it would fail that check forever.
      - A web app manifest and any service worker registration. The store
        ships updates; a second update channel inside the binary is a way to
        serve code Apple never reviewed.
      - Any analytics or consent loader. Owner decision, 2026-09-10: the
        native build carries no gtag and no Google Ads tag, which is what
        keeps Advertising Data and App Tracking Transparency off the
        privacy label.

      The Content-Security-Policy meta lands in task A6, once C1 has settled
      which API origin is compiled in.
    -->
  </head>
  <body>
    <div id="root"></div>
    <!--
      The boot watchdog. Plain script, before the module: if the module graph
      fails to evaluate, or boot throws, or nothing renders within ten
      seconds, the reason is painted on the screen instead of a black frame
      nobody can read (TestFlight build 29, 11 Sep 2026). Tap to dismiss.
      A6's Content-Security-Policy must carry this script's hash.
    -->
    <script>
      ;(function () {
        var shown = false
        function show(kind, text) {
          if (shown) return
          shown = true
          var box = document.createElement('div')
          box.setAttribute('role', 'alert')
          box.style.cssText =
            'position:fixed;left:0;right:0;top:0;z-index:2147483647;' +
            'padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 16px;' +
            'background:#3b0d12;color:#ffd9dc;font:13px/1.45 ui-monospace,Menlo,monospace;' +
            'white-space:pre-wrap;word-break:break-word;max-height:70vh;overflow:auto'
          box.textContent =
            'Mercury Pitch did not start (' +
            kind +
            ')\n\n' +
            text +
            '\n\nTap to dismiss.'
          box.addEventListener('click', function () {
            box.remove()
          })
          document.body.appendChild(box)
        }
        window.addEventListener('error', function (e) {
          show('error', (e.error && e.error.stack) || e.message || String(e))
        })
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          show(
            'unhandled rejection',
            (r && (r.stack || r.message)) || String(r),
          )
        })
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && !root.classList.contains('loaded')) {
            show('timeout', 'No frame rendered after 10 s.')
          }
        }, 10000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
