<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The serif an Android phone draws, for the Android shot projects only
  (playwright.shots.config.ts hands it to Chromium as FONTCONFIG_FILE).

  Android's fonts.xml aliases serif, times, times new roman, palatino,
  georgia, baskerville, goudy, fantasy and ITC Stone Serif to Noto Serif.
  This machine's own fontconfig answers the same names with Liberation
  Serif, so the Ear Lab's stack ('Iowan Old Style', 'Palatino Linotype',
  Baskerville, Georgia, 'Times New Roman', serif) rendered in a face no
  Android phone has. Each alias below puts Noto Serif first for that name,
  and binds it strongly so the match is Noto Serif itself rather than a
  metric twin. 'Iowan Old Style' and 'Palatino Linotype' are not aliased on
  Android either, so they fall through to Baskerville there as here.
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family" ignore-blanks="true"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" ignore-blanks="true"><string>times</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" ignore-blanks="true"><string>times new roman</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" ignore-blanks="true"><string>palatino</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" ignore-blanks="true"><string>georgia</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" ignore-blanks="true"><string>baskerville</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" ignore-blanks="true"><string>goudy</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" ignore-blanks="true"><string>fantasy</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" ignore-blanks="true"><string>ITC Stone Serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif</string></edit>
  </match>
</fontconfig>
