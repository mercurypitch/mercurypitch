apply plugin: 'com.android.application'

// Release signing and Play version numbers arrive from outside Git: CI decodes
// the upload keystore to a file and exports these. A developer machine has none
// of them, so a local release build still succeeds — it is simply unsigned,
// which is what `pnpm beside-cue:android` has always produced.
//
// This is the *upload* key, not the app signing key. Play App Signing keeps the
// app signing key and re-signs every upload, so losing this one is recoverable.
def uploadKeystore = System.getenv("BESIDE_CUE_KEYSTORE_FILE")
def hasUploadKey = uploadKeystore != null && !uploadKeystore.isEmpty() && file(uploadKeystore).exists()
def releaseVersionCode = System.getenv("BESIDE_CUE_VERSION_CODE")
def releaseVersionName = System.getenv("BESIDE_CUE_VERSION_NAME")

// Debug builds are signed with one keystore shared between CI and developer
// machines. Android refuses to update an installed app whose signing
// certificate differs, and every CI run otherwise generates a throwaway debug
// key, so swapping between a PR artifact and a local build meant uninstalling
// first — which wipes the cue and reflection history, since both live only on
// the device.
//
// The password below is Android's documented debug-keystore convention, on
// purpose. A debug key signs nothing Play would accept, so nothing is protected
// by keeping it out of this file. The keystore itself still lives outside Git.
//
// Absent, the build falls back to whatever debug key the Android toolchain
// generates, so a fresh clone still builds — it simply cannot update an install
// made by a different machine.
def debugKeystore = System.getenv("BESIDE_CUE_DEBUG_KEYSTORE_FILE")
if (debugKeystore == null || debugKeystore.isEmpty()) {
    debugKeystore = "${System.getProperty('user.home')}/.android/beside-cue-debug.jks"
}
def hasDebugKey = file(debugKeystore).exists()

android {
    namespace = "com.irchiinnuss.besidecue"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.irchiinnuss.besidecue"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play rejects a re-used versionCode, so a release build takes the
        // monotonic value CI derives from the tag.
        versionCode releaseVersionCode ? releaseVersionCode.toInteger() : 1
        versionName releaseVersionName ?: "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // AGP always defines `debug`, so this reconfigures it rather than
        // adding one; `buildTypes.debug` picks it up with no further wiring.
        if (hasDebugKey) {
            debug {
                storeFile file(debugKeystore)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        if (hasUploadKey) {
            release {
                storeFile file(uploadKeystore)
                storePassword System.getenv("BESIDE_CUE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("BESIDE_CUE_KEY_ALIAS")
                keyPassword System.getenv("BESIDE_CUE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (hasUploadKey) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
