apply plugin: 'com.android.application'

// Release signing, the debug key shared with CI, and the store version
// numbers all come from one script in the repository root — see
// gradle/signing.gradle for what each environment variable does and why a
// missing one leaves the build unsigned rather than failing it. The prefix is
// what keeps Beside Cue's upload key out of reach of every other app here.
ext.signingEnvPrefix = "BESIDE_CUE"
ext.debugKeystoreName = "beside-cue-debug.jks"
ext.fallbackVersionName = "0.1.0"
apply from: "$rootDir/../../../gradle/signing.gradle"

// The store keeps microphone access off. Opt in for a matching games
// web bundle; no flavors or CI task/output names change.
def gamesProperty = providers.gradleProperty('besideCueGames').getOrElse('0')
if (!(gamesProperty in ['0', '1'])) {
    throw new GradleException('besideCueGames must be 0 (store) or 1 (games)')
}
def gamesEnabled = gamesProperty == '1'

android {
    namespace = "com.irchiinnuss.besidecue"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.irchiinnuss.besidecue"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode project.ext.resolvedVersionCode
        versionName project.ext.resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    if (gamesEnabled) {
        sourceSets {
            debug.manifest.srcFile 'src/games/AndroidManifest.xml'
            release.manifest.srcFile 'src/games/AndroidManifest.xml'
        }
    }
}

// Check at asset merge (not configuration or manifest inspection), so a stale
// Capacitor copy cannot silently pair game code with the store permissions.
android.applicationVariants.all { variant ->
    variant.mergeAssetsProvider.configure {
        inputs.property('besideCueGames', gamesEnabled)
        doFirst {
            def publicDir = file('src/main/assets/public')
            def marker = new File(publicDir, 'native-games-profile.json')
            def hasGameAssets = ['games', 'models', 'ort'].any { new File(publicDir, it).exists() }
            if (!gamesEnabled) {
                if (marker.exists() || hasGameAssets) {
                    throw new GradleException('Store profile contains games assets. Rebuild with VITE_BESIDE_CUE_GAMES=0 and run cap sync, or use native:games.')
                }
            } else {
                if (!marker.isFile()) {
                    throw new GradleException('Games profile needs a verified web bundle. Run pnpm native:games --platform android first.')
                }
                def profile = new groovy.json.JsonSlurper().parse(marker)
                def index = new File(publicDir, 'index.html')
                def indexHash = index.isFile() ? java.security.MessageDigest.getInstance('SHA-256').digest(index.bytes).encodeHex().toString() : ''
                if (profile.schema != 1 || profile.profile != 'games' || profile.platform != 'android' || profile.indexSha256 != indexHash) {
                    throw new GradleException('Games web bundle provenance does not match this Android package. Run native:games again.')
                }
                for (asset in ['models/swiftf0.onnx', 'ort/ort-wasm-simd-threaded.mjs', 'ort/ort-wasm-simd-threaded.wasm', 'games/glass3d/merc.glb', 'games/adventure/manifest.json', 'games/adventure/platform-kit.glb', 'games/adventure/vessels.glb', 'games/adventure/legend-slab.glb', 'games/adventure/floor-marble.webp', 'games/adventure/legend-johnny-cash.webp', 'games/adventure/museum-sky.webp']) {
                    def required = new File(publicDir, asset)
                    if (!required.isFile() || required.length() == 0) {
                        throw new GradleException("Games native bundle is missing ${asset}")
                    }
                }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
