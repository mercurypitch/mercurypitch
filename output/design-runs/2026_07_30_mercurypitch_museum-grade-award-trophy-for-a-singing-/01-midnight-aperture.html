<!--
FAMILY: Midnight Aperture — Vast Quiet Cinematic
THESIS: The award is encountered alone in a dark screening room, never reduced to a thumbnail grid.
OWN-WORLD: Midnight lacquer, sapphire glass, quicksilver highlights, hairline rules, and a single quiet control rail.
STORY: Compare six league silhouettes while the future hero render remains deliberately absent.
FIRST VIEWPORT: One monumental sculpture placeholder occupies the glow; league controls form a low horizon beneath it.
FORM: Immersive object study, ranked first for silhouette judgment; centered stage with a restrained selector.

EMBEDDED EARS ACCEPTANCE CONTRACT
REQ-TROPHY-001 — Ubiquitous: The artifact shall expose six named league previews.
REQ-TROPHY-002 — WHERE the artifact is opened from a local file, it shall render without network access or imports.
REQ-TROPHY-003 — WHEN a keyboard user reaches a league control, the artifact shall show a visible focus indicator.
REQ-TROPHY-004 — IF reduced motion is preferred, THEN ambient and transition motion shall stop.
-->
<!doctype html>

    <style>
      :root {
        color-scheme: dark;
        --night: #020916;
        --night-deep: #01040c;
        --night-raised: #07172d;
        --ink: #f5fbff;
        --ink-soft: #c8e5f3;
        --line: #244a68;
        --sapphire: #0f56c7;
        --sapphire-light: #3fa8ff;
        --focus: #8fd8ff;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--night-deep);
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--ink);
        background:
          radial-gradient(
            circle at 50% 42%,
            #123d69 0,
            #071a34 19%,
            var(--night) 48%,
            var(--night-deep) 79%
          ),
          var(--night-deep);
        font-family: 'Avenir Next', Avenir, 'Segoe UI', sans-serif;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        content: '';
        opacity: 0.58;
        background-image:
          radial-gradient(circle at 12% 17%, #d9f4ff 0 1px, transparent 1.5px),
          radial-gradient(circle at 78% 12%, #a8dfff 0 1px, transparent 1.5px),
          radial-gradient(circle at 88% 61%, #e6f8ff 0 1px, transparent 1.5px),
          radial-gradient(circle at 21% 72%, #79c8ff 0 1px, transparent 1.5px),
          radial-gradient(circle at 62% 84%, #cdeeff 0 1px, transparent 1.5px);
        background-size:
          390px 390px,
          520px 520px,
          440px 440px,
          610px 610px,
          720px 720px;
        animation: drift 24s ease-in-out infinite alternate;
      }

      button,
      a {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .skip-link {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 20;
        padding: 10px 14px;
        color: var(--night-deep);
        background: var(--focus);
        transform: translateY(-180%);
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .shell {
        width: min(100%, 1680px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 26px clamp(20px, 4vw, 72px) 28px;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .masthead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        margin: 0;
        font-family: 'Bodoni 72 Smallcaps', 'Bodoni MT', Didot, Georgia, serif;
        font-size: clamp(1rem, 1.4vw, 1.3rem);
        font-weight: 400;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .family {
        margin: 0;
        color: var(--ink-soft);
        font-family: 'Avenir Next Condensed', 'Gill Sans', sans-serif;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .experience {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(240px, 0.28fr);
        gap: clamp(24px, 4vw, 76px);
        align-items: center;
      }

      .stage-wrap {
        position: relative;
        min-height: min(72vh, 840px);
        display: grid;
        place-items: center;
        isolation: isolate;
      }

      .stage-wrap::before {
        position: absolute;
        top: 49%;
        left: 50%;
        z-index: -1;
        width: min(67vw, 800px);
        aspect-ratio: 1;
        content: '';
        border: 1px solid #1e496a;
        border-radius: 50%;
        opacity: 0.38;
        transform: translate(-50%, -50%);
      }

      .preview {
        width: min(100%, 590px);
        height: min(69vh, 790px);
        min-height: 520px;
        margin: 0;
        display: grid;
        place-items: center;
        animation: emerge 720ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .preview[hidden] {
        display: none;
      }

      .trophy {
        width: auto;
        height: min(700px, 68vh);
        max-width: 90%;
        overflow: visible;
        filter: drop-shadow(0 28px 34px #000a);
      }

      .trophy .glass {
        transform-box: fill-box;
        transform-origin: center;
        animation: breathe 6.4s ease-in-out infinite;
      }

      .rail {
        align-self: center;
        padding: 28px 0 28px clamp(0px, 2vw, 32px);
        border-left: 1px solid var(--line);
      }

      .rail-kicker {
        margin: 0 0 18px;
        color: var(--sapphire-light);
        font-size: 0.67rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .league-name {
        min-height: 2.15em;
        margin: 0;
        font-family: 'Bodoni 72', 'Bodoni MT', Didot, Georgia, serif;
        font-size: clamp(2.3rem, 4.8vw, 5rem);
        font-weight: 400;
        line-height: 0.9;
        letter-spacing: -0.025em;
      }

      .league-note {
        max-width: 33ch;
        min-height: 4.5em;
        margin: 22px 0 30px;
        color: var(--ink-soft);
        font-family: 'Baskerville', Georgia, serif;
        font-size: 1rem;
        line-height: 1.5;
      }

      .league-controls {
        display: grid;
        gap: 2px;
      }

      .league-control {
        min-height: 46px;
        padding: 9px 8px;
        display: grid;
        grid-template-columns: 13px 1fr;
        gap: 12px;
        align-items: center;
        border: 0;
        border-bottom: 1px solid #173954;
        border-radius: 0;
        background: transparent;
        color: var(--ink-soft);
        text-align: left;
        cursor: pointer;
        transition:
          color 220ms ease,
          padding-left 220ms ease,
          border-color 220ms ease;
      }

      .league-control::before {
        width: 5px;
        height: 5px;
        content: '';
        border: 1px solid currentColor;
        border-radius: 50%;
        transition:
          background 220ms ease,
          box-shadow 220ms ease;
      }

      .league-control:hover {
        color: var(--ink);
        border-color: #4e89ad;
      }

      .league-control[aria-pressed='true'] {
        padding-left: 15px;
        color: var(--ink);
        border-color: var(--sapphire-light);
      }

      .league-control[aria-pressed='true']::before {
        background: var(--focus);
        box-shadow: 0 0 14px #5ec4ff;
      }

      .league-control:focus-visible,
      .skip-link:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 4px;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--ink-soft);
        font-family: 'Avenir Next Condensed', 'Gill Sans', sans-serif;
        font-size: 0.66rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .svg-defs {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }

      @keyframes drift {
        from {
          transform: translate3d(-8px, -5px, 0);
        }
        to {
          transform: translate3d(10px, 7px, 0);
        }
      }

      @keyframes emerge {
        from {
          opacity: 0.4;
          filter: blur(10px);
          transform: translateY(14px) scale(0.985);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translateY(0) scale(1);
        }
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.86;
          transform: scaleX(0.985);
        }
        50% {
          opacity: 1;
          transform: scaleX(1.015);
        }
      }

      @media (max-width: 860px) {
        .shell {
          padding-inline: 18px;
        }

        .experience {
          grid-template-columns: 1fr;
          gap: 0;
        }

        .stage-wrap {
          min-height: 61vh;
        }

        .stage-wrap::before {
          width: min(92vw, 620px);
        }

        .preview {
          height: 58vh;
          min-height: 430px;
        }

        .trophy {
          height: min(560px, 52vh);
        }

        .rail {
          padding: 24px 0 22px;
          border-top: 1px solid var(--line);
          border-left: 0;
        }

        .league-name {
          min-height: auto;
        }

        .league-note {
          min-height: auto;
          margin-block: 12px 22px;
        }

        .league-controls {
          grid-template-columns: repeat(3, 1fr);
          gap: 6px;
        }

        .league-control {
          min-height: 42px;
          padding: 8px;
          border: 1px solid #244a68;
          text-align: center;
        }

        .league-control[aria-pressed='true'] {
          padding-left: 8px;
          background: #0b2b4a;
        }
      }

      @media (max-width: 520px) {
        .masthead,
        .footer {
          align-items: flex-start;
          flex-direction: column;
          gap: 7px;
        }

        .stage-wrap {
          min-height: 54vh;
        }

        .preview {
          height: 51vh;
          min-height: 370px;
        }

        .trophy {
          height: min(480px, 46vh);
        }

        .league-controls {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation: none !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

          <p class="league-note" id="league-note">
            The opening league holds the vibration close to the mercury string.
          </p>
          <div
            class="league-controls"
            id="league-controls"
            aria-label="Choose a league preview"
          >
            <button
              class="league-control"
              type="button"
              data-target="unison"
              data-name="Unison"
              data-note="The opening league holds the vibration close to the mercury string."
              aria-pressed="true"
            >
              Unison
            </button>
            <button
              class="league-control"
              type="button"
              data-target="cadence"
              data-name="Cadence"
              data-note="A measured sapphire envelope begins to lift from the polished base."
              aria-pressed="false"
            >
              Cadence
            </button>
            <button
              class="league-control"
              type="button"
              data-target="harmony"
              data-name="Harmony"
              data-note="The glass vibration opens into a poised and balanced middle register."
              aria-pressed="false"
            >
              Harmony
            </button>
            <button
              class="league-control"
              type="button"
              data-target="resonance"
              data-name="Resonance"
              data-note="A fuller amplitude gives the continuous silhouette greater authority."
              aria-pressed="false"
            >
              Resonance
            </button>
            <button
              class="league-control"
              type="button"
              data-target="virtuoso"
              data-name="Virtuoso"
              data-note="The string stretches taller as the sapphire volume gains precision."
              aria-pressed="false"
            >
              Virtuoso
            </button>
            <button
              class="league-control"
              type="button"
              data-target="laureate"
              data-name="Laureate"
              data-note="The final league reaches its widest calm envelope and most serene sphere."
              aria-pressed="false"
            >
              Laureate
            </button>
          </div>
        </aside>
      </main>

      <footer class="footer">
        <span>Six league silhouettes</span>
        <span>Final material renders intentionally pending</span>
      </footer>
    </div>

    <script>
      const controls = Array.from(document.querySelectorAll('[data-target]'))
      const previews = Array.from(document.querySelectorAll('[data-preview]'))
      const leagueName = document.querySelector('#league-name')
      const leagueNote = document.querySelector('#league-note')

      controls.forEach((control) => {
        control.addEventListener('click', () => {
          const target = control.dataset.target

          controls.forEach((item) => {
            item.setAttribute('aria-pressed', String(item === control))
          })

          previews.forEach((preview) => {
            preview.hidden = preview.dataset.preview !== target
          })

          leagueName.textContent = control.dataset.name
          leagueNote.textContent = control.dataset.note
        })
      })
    </script>
  </body>
</html>
