<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <div id="s04-recall" data-composition-id="s04-recall" data-start="0" data-duration="22.309" data-width="1920" data-height="1080">
      <div class="scene" id="s04-recall-scene"></div>
      <!-- Merc pass, static (trap 4); timing written by python3 tools/merc-tags.py s04-recall -->
      <video id="s04-recall-m04-orange" data-merc="m04-orange" class="clip" muted playsinline src="assets/merc/m04-orange-merc.webm" data-start="14.397" data-duration="7.100" data-media-start="0.008"></video>
      <video id="s04-recall-m04-orange-refl" data-merc="m04-orange" data-merc-refl class="clip" muted playsinline src="assets/merc/m04-orange-merc.webm" data-start="14.397" data-duration="7.100" data-media-start="0.008"></video>
      <video id="s04-recall-m04-orange-seg1" data-merc="m04-orange" data-merc-seg="m04-orange:1" class="clip" muted playsinline src="assets/merc/m04-orange-tall-merc.webm" data-start="14.397" data-duration="0.700" data-media-start="0.008"></video>
      <video id="s04-recall-m04-orange-seg1-refl" data-merc="m04-orange" data-merc-seg="m04-orange:1" data-merc-refl class="clip" muted playsinline src="assets/merc/m04-orange-tall-merc.webm" data-start="14.397" data-duration="0.700" data-media-start="0.008"></video>
      <script>
        ;(function () {
          // S4, from Lesson 2 (STORYBOARD rows 4a to 4d; HANDOFFS § S3 to S4, § S4, § S4c's stand-up, § A to B).
          // F0 throughout. The staircase dims; Lesson 2's row of thirteen tiles, C4 to C5, rises over it and is
          // asked about afresh; q0's ring timer; the answer on the row (the twelve "1" brackets, the seven white
          // tiles, the five dark ones); then the row stands up into the staircase's rows and the staircase
          // returns on them, its seven risers growing in turn; Tavi drops in, asks, and hops out; the risers
          // ripple on "measure" and the scene ends on the A to B rest frame. Every time is a word or a duration.
          const SID = 's04-recall'
          const D = L.dur(SID)
          const at = (cue, edge, off) => L.at(SID, cue, edge, off)
          const word = (line, which, edge, off) => L.word(SID, line, which, edge, off)
          const root = document.getElementById(SID + '-scene')
          const room = L.room(root, { floor: false })
          const tl = gsap.timeline({ paused: true })
          const C = L.C, ST = L.ST, P = L.prog, clamp = L.clamp, lerp = L.lerp
          const f2 = (v) => v.toFixed(2)

/*SHARED_A*/

          /* ---------------------------------------------------------------- anchors */
          // 4a: "First," the kicker lands and the staircase dims to 25 %, its names and house fading (0.4 s);
          // on "one from Lesson 2" the tile row rises from 300 px below (1.0 s, power3.out); on "2." the white
          // tiles' names land in turn, 0.14 s apart; on "semitones" the thirteen tiles scale in turn over 0.8 s;
          // on "octave?" C4 and C5 scale together (long pulse)
          const DIM = word('b4', 'First', 'start', 0.02)
          const RISE = word('b4', 'one', 'start', 0.025)
          const NAMES_IN = word('b4', '2'), NAMES_GAP = 0.14
          const SEMIS = word('b4', 'semitones'), SEMIS_DUR = 0.8
          const OCT = word('b4', 'octave')
          // 4b: q0's ring timer over the pause; on "Twelve." the answer lands top left and the twelve "1" brackets
          // draw left to right (0.04 s apart, 0.26 s each, so over 0.7 s); from "Seven" the seven white tiles C4
          // to B4 scale in turn across "Seven letters" (0.15 s apart, long; the board has them together, which
          // left 0.4 s still before "five"); from "five" the five dark tiles light to 60 % chrome in turn, 0.3 s
          // apart, each up over 0.3 s and back over 0.7 s, both linear (a large-area change that registers all
          // the way, across "five notes between them"); the kicker leaves as b5 ends, the brackets over 0.45 s
          // q0 (component critic A-02 item 4): C4 and C5, the octave's two ends, lift 40 px with a chrome outline
          // as the pause opens (0.06 s in, 0.4 s, power3.out), hold through it, and drop as "Twelve" lands and the
          // brackets start (0.25 s, power2.in), each settling with a tile pulse
          const Q0 = at('q0'), Q0_DUR = at('q0', 'end') - at('q0'), LIFT0 = at('q0', 'start', 0.06)
          const TWELVE = word('b5', 'Twelve'), BR0 = word('b5', 'Twelve', 'start', 0.04)
          const SEVEN_L = word('b5', 'Seven')
          const FIVE = word('b5', 'five')
          const B5_END = at('b5', 'end')
          // 4c: on "major" the tiles' names fade (0.2 s) and the stand-up starts 0.04 s later; its phases are
          // durations from that start (one move, anchored by its start): phase 1 (1.0 s) the row turns upright
          // into a column of slivers, phase 2 (1.0 s) each sliver stretches into its row; the rows above C5 fade
          // in from 1.6 s; the staircase returns from 1.8 s, its names in turn from 2.0 s. On "seven steps" the
          // seven risers grow in turn (0.07 s apart) and "in 7 steps" lands
          const NAMES_OUT = word('b6', 'major'), STAND = word('b6', 'major', 'start', 0.04)
          const P2 = STAND + 1.0, ROWS_IN = STAND + 1.6, BACK = STAND + 1.8, NAMES_BACK = STAND + 2.0, SWAP = STAND + 2.2
          const SEVEN = word('b6', 'seven steps')
          // 4d: m04's tag starts at at('o3', 'start', -1.1) (merc-tags.py), where she drops in; on "steps?" a "?"
          // joins and pulses as she asks it; on "bigger" the seven riser bars brighten together (component critic
          // A-02 item 2: 4 to 8 px, chrome at 40 % to full ink, 0.25 s, then back by "Let's", linear) and grow
          // together, so their unequal heights read side by side; on "Let's" the two labels and the numerals leave
          // up fast; her hop out at at('b7', 'start', 0.29); on "measure" the seven risers ripple in turn (0.08 s
          // apart), back to rest before the cut. On "seven steps" and on "measure" each riser's event also pulses
          // the stair above it to 1.06 and flashes its tread (DECISIONS 88), and on "seven steps" an ink numeral,
          // 1 to 7, lands above each riser as it flashes (A-02 item 2, FACTS 71)
          const QMARK = word('o3', 'steps?'), BIGGER = word('o3', 'bigger')
          const LEAVE = word('b7', "Let's")
          const HOP = at('b7', 'start', 0.29)
          const MEASURE = word('b7', 'measure')

          /* ---------------------------------------------------------------- the room */
          // the dust: this group's (dustF) at the open, crossfaded over q0 into group B's (Lesson 2's filmDust,
          // seed 7, 26 motes over 1960 x 1120, as s05 and s06 draw it), so the cut to s05 meets the same motes
          const dustA = dustF(room.near)
          const dustB = (() => {
            const svg = L.stage(room.near)
            const r = L.rng(7)
            const motes = []
            for (let i = 0; i < 26; i++) {
              const m = { x: r() * 1920, y: r() * 1080, s: 0.8 + r() * 2.2, vx: (r() - 0.5) * 14, vy: -4 - r() * 10, ph: r() * 6.28 }
              m.el = L.svg('circle', { r: m.s, fill: 'rgba(195,204,214,0.5)', opacity: 0 }, svg)
              motes.push(m)
            }
            return {
              svg,
              draw(T) {
                for (const m of motes) {
                  m.el.setAttribute('cx', (((m.x + m.vx * T) % 1960 + 1960) % 1960 - 20).toFixed(1))
                  m.el.setAttribute('cy', (((m.y + m.vy * T) % 1120 + 1120) % 1120 - 20).toFixed(1))
                  m.el.setAttribute('opacity', (0.18 + 0.22 * (0.5 + 0.5 * Math.sin(m.ph + T * 0.9))).toFixed(3))
                }
              },
            }
          })()

          /* ---------------------------------------------------------------- the world: staircase, tiles, brackets */
          const mid = L.stage(room.mid)
          const st = L.stairs(mid, {})
          st.stairs.forEach((S, i) => S.names.prepare([SOL[i]]))
          // the line on top of row D5 (the cold open's top edge): the kit draws it as row C#5's bottom line, which
          // fades in with that row, so this copy holds it until C#5 is in (the two sum to the kit's 6 %)
          const edgeD5 = L.svg('rect', { x: 220, width: 1460, y: f2(ST.rowTop(14) - 0.5), height: 1, fill: '#e6edf3', 'fill-opacity': 0.06 }, null)
          mid.insertBefore(edgeD5, st.gAll)
          // Lesson 2's tile row, C4 to C5 (HANDOFFS § Carried: centres x 240 + 120 i, home y 420 to 700), over the
          // dimmed staircase; from phase 2 of the stand-up its slivers are the rows, so the group moves behind the
          // staircase then (the staircase is at 0 at that moment, so nothing changes on screen)
          const tileG = L.svg('g', { class: 'recall-tiles' }, mid)
          const brG = L.svg('g', { class: 'recall-brackets' }, mid)
          const row = L.tiles(tileG, { from: 60, to: 72 })
          const brackets = L.tileBrackets(brG, row)
          brackets.list.forEach((b, k) => { b.k = k })
          const WHITE_K = {}, DARK_K = {}
          row.tiles.filter((x) => x.white).forEach((x, k) => { WHITE_K[x.i] = k })
          row.tiles.filter((x) => !x.white).forEach((x, k) => { DARK_K[x.i] = k })
          let tilesBehind = false
          const DARKC = [42, 49, 59], INKC = [230, 237, 243]

          /* ---------------------------------------------------------------- Tavi (screen space, top layer) */
          // L.mercGate (assets/lib/hosts.js), as every scene places a Merc: her drop seen whole from its intro
          // (DECISIONS 81, the segment tags from tools/merc-tags.py), the hop carrying the box 360 px right through
          // the hop's time in the air (from HOP + 0.15 over 0.42 s, power1.in), and a local floor patch under her corner.
          const tavi = L.mercGate(room.top, { sid: SID, pass: 'm04-orange', tag: SID + '-m04-orange', x: 1800, size: 300, hop: HOP })

          /* ---------------------------------------------------------------- frame-fixed type and marks (hud) */
          const hud = L.stageOf(room.hud)
          const kicker = L.kicker(room.hud, 'From Lesson 2')
          const ring = L.ringTimer(room.hud, { x: 164, y: 232 })
          const lab1 = txt(hud, '1 octave = 12 semitones', { x: 140, y: 250, size: 56 })
          const lab2 = txt(hud, 'in 7 steps', { x: 140, y: 330, size: 56 })
          const labQ = txt(hud, '?', { x: 400, y: 330, size: 56 })
          L.afterFonts(() => { labQ.setAttribute('x', f2(140 + lab2.getComputedTextLength())) })

          // a riser's brightening as it grows (4 px chrome at 40 % to 6 px at full): up over 0.28 s and back over
          // 0.5 s, both linear, so each riser's change carries until the next one's (s03's ripple, the same shape)
          const env = (d) => (d < 0 ? 0 : d < 0.28 ? d / 0.28 : Math.max(0, 1 - (d - 0.28) / 0.5))
          const growAt = (n) => SEVEN + 0.07 * (n - 1), rippleAt = (n) => MEASURE + 0.08 * (n - 1)
          // the numerals 1 to 7 (Outfit 600 30 px, ink), centred over each riser, 24 px above its top (the upper
          // stair's tread), clear of that stair's pulse
          const numerals = [1, 2, 3, 4, 5, 6, 7].map((n) => txt(mid, String(n), { x: ST.riserX(n, 0), y: ST.tread(n + 1, 0) - 24, size: 30, anchor: 'middle' }))
          // C4's and C5's outline through q0: a 3 px chrome rim 6 px out from the tile, in the tile's own group so
          // it rides the lift
          const qOut = [row.tiles[0], row.tiles[12]].map((x) => L.svg('rect', { x: f2(x.x - 6), y: f2(x.y - 6), width: x.w + 12, height: x.h + 12, rx: 15, fill: 'none', stroke: C.chrome, 'stroke-width': 3, opacity: 0 }, x.g))
          const INK = hexRgb(C.ink)
          // the tread flashes (S3's): a soft chrome glow and a bright core along a stair's tread, over the staircase
          const flashDefs = L.svg('defs', {}, mid)
          const flashBlur = L.svg('filter', { id: SID + '-flash', x: '-20%', y: '-300%', width: '140%', height: '700%' }, flashDefs)
          L.svg('feGaussianBlur', { stdDeviation: 5 }, flashBlur)
          const flashG = L.svg('g', { class: 'tread-flash' }, mid)
          const flashes = [1, 2, 3, 4, 5, 6, 7, 8].map(() => ({
            glow: L.svg('path', { fill: 'none', stroke: C.chrome, 'stroke-width': 12, 'stroke-linecap': 'round', filter: `url(#${SID}-flash)`, opacity: 0 }, flashG),
            core: L.svg('path', { fill: 'none', stroke: '#f2f5f8', 'stroke-width': 4, 'stroke-linecap': 'round', opacity: 0 }, flashG),
          }))
          const flashUp = (d) => (d < 0 ? 0 : d < 0.08 ? d / 0.08 : Math.max(0, 1 - (d - 0.08) / 0.5))
          // the "?" pulses about its own middle; its width once the fonts are in
          let qW = 28
          L.afterFonts(() => { qW = labQ.getComputedTextLength() || qW })
          const CHR = hexRgb(C.chrome)

          L.clock(tl, D, (t) => {
            const Tf = T0 + t
            const xd = P(t, Q0, Q0_DUR, 'sine.inOut')
            dustA.draw(Tf); dustA.svg.setAttribute('opacity', (1 - xd).toFixed(3))
            dustB.draw(Tf); dustB.svg.setAttribute('opacity', xd.toFixed(3))
            const box = tavi(t)

            /* the stand-up's curves (HANDOFFS § S4c, decided in the lab): the pitch shrinks first (120 to 26 px,
               tiles 112 to 24 px wide, 0.6 s), while the turn and the pivot's move run from 0.2 s (0.8 s), so the
               short comb turns clear of the label above it; phase 2 stretches each sliver to x 220 to 1680 and 26 px
               (1.0 s) while its fill fades from the tile's to its row band's (from 0.3 s, 0.7 s, power2.in, so the
               stretch is seen before the fade) */
            const up = P(t, STAND, 0.6, 'power2.inOut'), ur = P(t, STAND + 0.2, 0.8, 'power2.inOut')
            const v = P(t, P2, 1.0, 'power2.inOut'), fade = P(t, P2 + 0.3, 0.7, 'power2.in')
            const swap = P(t, SWAP, 0.6, 'none')
            const pitch = lerp(120, 26, up), tw = lerp(lerp(112, 24, up), 26, v), th = lerp(280, 1460, v)
            const rx = lerp(lerp(10, 6, up), 0, v)
            const rise = P(t, RISE, 1.0, 'power3.out')
            const rowT = { s: 1, rot: -90 * ur, cx: 240, cy: 560, x: lerp(240, 360, ur), y: lerp(560, 677, ur), dy: 300 * (1 - rise) }
            const behind = t >= P2
            if (behind !== tilesBehind) { mid.insertBefore(tileG, behind ? st.gAll : brG); tilesBehind = behind }

            /* the staircase: 25 % from DIM (its names and house gone), then out as the tile row lands over it, so
               its top stairs and feet never show round the row (component critic A-01 item 8); back to full on the
               new rows (0.4 s), its names in turn */
            const stA = t < BACK ? (1 - 0.75 * P(t, DIM, 0.4, 'power2.inOut')) * (1 - P(t, RISE + 0.4, 0.6, 'power2.inOut')) : P(t, BACK, 0.4, 'power2.out')
            const nameA = (n) => (t < BACK ? 1 - P(t, DIM, 0.4, 'power2.inOut') : P(t, NAMES_BACK + 0.07 * (n - 1), 0.2, 'power2.out'))
            const out12 = t < SWAP ? 1 - P(t, P2, 1.0, 'power1.inOut') : swap
            // riser n's events on "seven steps" and "measure" move stair n + 1: a pulse to 1.06 (long, but not on
            // "measure", which ends at rest before the cut) and a tread flash
            const blockPulse = (n) => (n < 2 ? 1 : Math.max(L.pulse(t, growAt(n - 1), 0.06, { long: true }), L.pulse(t, rippleAt(n - 1), 0.06)))
            const flashK = (n) => (n < 2 ? 0 : Math.max(flashUp(t - growAt(n - 1)), flashUp(t - rippleAt(n - 1))))
            // "bigger": all seven bars together, up over 0.25 s and back by "Let's", linear
            const big = P(t, BIGGER, 0.25, 'power2.out') * (1 - P(t, BIGGER + 0.25, LEAVE - BIGGER - 0.25, 'none'))
            const in15 = P(t, ROWS_IN, 0.5, 'power1.inOut')
            st.draw({
              w: 0, s0: 0, a: stA,
              rows: { x0: 220, x1: 1680, k0: 0, k1: 19, kA: (k) => (k <= 12 ? out12 : k <= 14 ? 1 : in15), keep: { boxes: box ? [box] : [], cam: null, t } },
              stair: (n) => ({ scale: blockPulse(n), names: [{ text: SOL[n - 1], a: nameA(n) }] }),
              riser: (n) => ({ scale: Math.max(L.pulse(t, growAt(n), 'bar', { long: true }), L.pulse(t, BIGGER, 'bar', { long: true }), L.pulse(t, rippleAt(n), 'bar')) }),
              houses: { top: { a: 1 - P(t, DIM, 0.4, 'power2.inOut'), w: 0, lit: 1 } },
            })
            edgeD5.setAttribute('opacity', (1 - in15).toFixed(3))
            st.risers.forEach((Rz, i) => {
              const k = Math.max(env(t - growAt(i + 1)), env(t - rippleAt(i + 1)))
              if (k <= 0.001 && big <= 0.001) return
              const x = ST.riserX(i + 1, 0), bw = Math.max(4 + 2 * k, 4 + 4 * big)
              Rz.bar.setAttribute('x', f2(x - bw / 2)); Rz.bar.setAttribute('width', f2(bw))
              Rz.bar.setAttribute('fill', rgbStr(mixRgb(CHR, INK, big)))
              Rz.bar.setAttribute('fill-opacity', (0.4 + 0.6 * Math.max(k, big)).toFixed(3))
            })
            // the numerals: each lands (0.2 s, rising 8 px) as its riser grows on "seven steps"; all leave with the labels
            numerals.forEach((el, i) => place(el, fadeIO(t, growAt(i + 1), LEAVE, { out: 0.3, up: 60, ease: 'power3.in', rise: 8 })))
            flashes.forEach((F, i) => {
              const n = i + 1, k = flashK(n)
              if (k <= 0.001) { F.glow.setAttribute('opacity', '0'); F.core.setAttribute('opacity', '0'); return }
              const sc = blockPulse(n), cx = ST.colX(n, 0), tr = ST.tread(n, 0), my = (tr + ST.foot(0)) / 2
              const y = my + (tr + 1.5 - my) * sc, hw = 51 * sc
              const d = `M${f2(cx - hw)} ${f2(y)} L${f2(cx + hw)} ${f2(y)}`
              F.glow.setAttribute('d', d); F.core.setAttribute('d', d)
              F.core.setAttribute('stroke-width', f2(4 * sc))
              F.glow.setAttribute('opacity', (0.85 * k * stA).toFixed(3)); F.core.setAttribute('opacity', (k * stA).toFixed(3))
            })

            /* the tile row */
            const gone = t >= SWAP + 0.6
            const darkLit = (i) => { const d = t - (FIVE + 0.3 * DARK_K[i]); return clamp(Math.min(d / 0.3, 1 - (d - 0.3) / 0.7)) }
            // q0: C4 and C5 up 40 px with their outlines, and down as "Twelve" lands
            const lift = P(t, LIFT0, 0.4, 'power3.out') * (1 - P(t, TWELVE, 0.25, 'power2.in'))
            qOut.forEach((el) => el.setAttribute('opacity', lift.toFixed(3)))
            // the stand-up (item 7): the dark tiles take a full chrome rim and a lighter fill through the spin, so all
            // thirteen slivers read; the fade to the row bands takes both away
            const spin = P(t, STAND - 0.1, 0.3, 'power2.out')
            row.draw((tile) => {
              const i = tile.i
              if (gone) return { a: 0 }
              const cx = 240 + pitch * i
              const sc = Math.max(
                L.pulse(t, SEMIS + (SEMIS_DUR * i) / 12, 'tile'),
                i === 0 || i === 12 ? Math.max(L.pulse(t, OCT, 'tile', { long: true }), L.pulse(t, TWELVE + 0.25, 'tile')) : 1,
                tile.white && WHITE_K[i] < 7 ? L.pulse(t, SEVEN_L + 0.15 * WHITE_K[i], 'tile', { long: true }) : 1,
              )
              return {
                a: P(t, RISE, 0.3, 'power2.out'),
                scale: sc,
                dy: i === 0 || i === 12 ? -40 * lift : 0,
                lit: tile.white ? 0 : darkLit(i),
                labelA: tile.white ? P(t, NAMES_IN + NAMES_GAP * WHITE_K[i], 0.2, 'power2.out') * (1 - P(t, NAMES_OUT, 0.2, 'power2.in')) : 0,
                shape: { x: cx - tw / 2, y: 420, w: tw, h: th, rx },
              }
            }, rowT)
            // each sliver's fill, from the tile's to its row band's (#e6edf3 at 2.5 %, or 6 % on a black-key row),
            // then handed to the kit's rows: the sliver's share falls as the row's rises, so the sum holds the band
            for (const tile of row.tiles) {
              const b = tile.white ? 0.025 : 0.06
              const o0 = tile.white ? 0.92 : 1
              let o = o0 * Math.pow(b / o0, fade)
              if (t >= SWAP) o = (b * (1 - swap)) / (1 - b * swap)
              tile.rect.setAttribute('fill-opacity', o.toFixed(4))
              if (!tile.white) {
                // the kit's fill holds the 60 % chrome light; that has settled before the spin, so the mix starts dark
                if (spin > 0 || fade > 0) tile.rect.setAttribute('fill', rgbStr(mixRgb(mixRgb(DARKC, CHR, 0.3 * spin), INKC, fade)))
                tile.rect.setAttribute('stroke-opacity', (lerp(0.65, 1, spin) * (1 - fade)).toFixed(3))
                tile.rect.setAttribute('stroke-width', f2(2 + 1.5 * spin))
              }
            }

            /* the brackets: drawn left to right on "Twelve.", gone as b5 ends */
            const brOut = P(t, B5_END, 0.45, 'power2.inOut')
            brackets.draw((b) => {
              const t0 = BR0 + 0.04 * b.k
              const p = P(t, t0, 0.26, 'power2.out')
              return { p, a: (p > 0.001 ? 1 : 0) * (1 - brOut), labelA: P(t, t0 + 0.1, 0.2, 'power2.out') }
            })

            /* the hud: kicker, q0's ring timer, the two labels and the "?" */
            kicker.draw(t, DIM, B5_END)
            ring.draw(t, Q0, Q0_DUR)
            const lv = { out: 0.3, up: 60, ease: 'power3.in', rise: 12 }
            place(lab1, fadeIO(t, TWELVE, LEAVE, lv))
            place(lab2, fadeIO(t, SEVEN, LEAVE, lv))
            const fq = fadeIO(t, QMARK, LEAVE, lv), qs = L.pulse(t, QMARK + 0.25, 'label', { long: true })
            const qx = parseFloat(labQ.getAttribute('x')) + qW / 2, qy = 310
            labQ.setAttribute('opacity', fq.a.toFixed(3))
            labQ.setAttribute('transform', `translate(0 ${f2(fq.dy)}) translate(${f2(qx)} ${qy}) scale(${qs.toFixed(4)}) translate(${f2(-qx)} ${-qy})`)
          })

          window.__timelines = window.__timelines || {}
          window.__timelines[SID] = tl
        })()
      </script>
    </div>
  </body>
</html>
