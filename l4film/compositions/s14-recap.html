      <script>
        ;(function () {
          /* S14, Quick check (STORYBOARD rows 14a to 14g; HANDOFFS § E to F, § Inside F, § S14 to S15).
             In (E to F, fixed): F0; the staircase on C at full, names do to do, both houses lit, risers unmeasured,
             no riser labels; the strip with C major's keys at full and the rest at 45 %, hairlines, no key names;
             Merc (110, 840) and Tavi (1800, 840) at 300 (m12 spans the cut). Out (to s15): the Mercs in the

             sliding to (560, 520) on one curve in film time (carryAt, the same in s15-next). Every time is a cue,
             a word or a duration. */
          const SID = 's14-recap'
          const D = L.dur(SID)
          const at = (cue, edge, off) => L.at(SID, cue, edge, off)
          const word = (line, which, edge, off) => L.word(SID, line, which, edge, off)
          const root = document.getElementById(SID + '-scene')
          const room = L.room(root, { floor: false })
          const S0 = L.scene(SID).start
          const tl = gsap.timeline({ paused: true })
          const ST = L.ST, P = L.prog, clamp = L.clamp, lerp = L.lerp, C = L.C, light = L.light
          const f1 = (v) => (Math.round(v * 100) / 100).toString()
          const SEMI = (n) => ST.H[n] - ST.H[n - 1] === 1
          const SOL = ['do', 're', 'mi', 'fa', 'so', 'la', 'ti', 'do']
          const SC = { C: ST.scale(0), D: ST.scale(2), G: ST.scale(7) }
          const inSet = (set, m) => (set.includes(m) ? 1 : 0)
          const cue = (id) => window.CUES.cues[id]
          const hold = (t, t0, t1, up = 0.3) => P(t, t0, up, 'none') * (1 - P(t, t1, 0.3))
          const labelPulse = (t, times) => L.pulse(t, times, 0.25, { long: true })
          const landScale = (t, t0) => 1 + 0.4 * (1 - P(t, t0, 0.7, 'power1.out'))

          /* ---------------------------------------------------------------- anchors (by role) */
          const A = {
            kick: at('recap'), kickOut: at('b52', 'end'),       // 14a: "QUICK CHECK" lands on the recap mark
            c1a: at('b46'), c1b: word('b46', 'makes'),          // card 1, line by line, its panel 0.2 s ahead
            steps: word('b46', 'steps'),                        // the scene's one ripple: the stairs light in turn, 0.07 s apart
            push1: at('q1', 'start', 0.43),                     // F-recap-1 (1.6 s), the strip sinking and fading
            bhOut: at('q1', 'start', 2.43),                     // both houses fade out before riser 1's "T" (and the upper bracket)
            c1Out: word('b47', 'Two', 'start', -0.5),           // card 1 and its panel leave, its labels landed, before the brackets
            two: word('b47', 'Two'), groups: word('b47', 'groups,'),   // 14b: stairs 1-4, then 5-8, lit and bracketed
            joined: word('b47', 'joined'), tone47: word('b47', 12),    // the F-G riser grows and its "T" scales 1.2, twice
            out1: at('b47', 'end'),                             // labels, brackets, lights out; risers unmeasured; houses back
            pull1: at('b47', 'end', 0.08),                      // F0 (1.0 s), the strip back without its hairlines
            c2a: at('b48'), c2b: word('b48', 'Which'),          // 14c: card 2
            start2: word('b48', 'Start'),                       // stair 1 (the start) lights
            toD: word('b48', 'on D', 'start', 0.02),            // the slide to D (0.9 s); every key to 45 %
            need: word('b48', 'need?'),                         // the two do stairs light
            fs: word('b49', 'F'), fs2: word('b49', 'sharp'),    // hairlines, D major's keys, F#4 lit and named
            cs: word('b49', 'C'), cs2: word('b49', 'sharp#2'),  // C#5 the same
            out2: at('b49', 'end'),
            c3a: at('b50'), c3b: word('b50', 'a tone'),         // 14d: card 3
            tee: word('b50', 'tee'), doh: word('b50', 'doh:'),  // ti, then do, lit to the card's exit
            toC: word('b50', 'tee', 'start', 0.1),              // the slide back to C (0.8 s)
            push2: word('b50', 4, 'start', 0.59),               // F-recap-3 (1.2 s)
            tone50: word('b50', 'tone,'), semi50: word('b50', 'semitone?'),   // ti scales; the ti-do riser to measuring
            tiDo: at('ti-do'),                                  // the chrome bead on ti (dropping 0.2 s before, as the top house unlights)
            semi51: word('b51', 'A semitone'),                  // the riser grows gold and "S" lands
            semiEnd: word('b51', 'semitone.', 'end', -0.55),    // the riser and "S" pulse as the word ends
            tee51: word('b51', 'Tee'), just: word('b51', 'just'), under: word('b51', 'under'), most: word('b51', 'most'),
            home51: word('b51', 'home,'),                       // do (stair 8) lights
            hear: word('b51', 'hear'), lean: word('b51', 'lean'),   // the ink arrow from ti to do (0.6 s)
            out3: at('b51', 'end'), pull2: at('b51', 'end', 0.09),
            c4a: at('o13'), c4b: word('o13', 'which'),          // 14e: card 4 (Tavi asks)
            g4: word('o13', 'G,'), doh4: word('o13', 'doh?'),   // G4 and G5 scale; the do stairs
            note4: word('o13', 'note'),                         // the top stair lights
            toG: word('b52', 'G.', 'start', 0.01),              // the slide to G (0.8 s); G4 and G5 named
            doh52: word('b52', 'Doh'),                          // stair 1, now G, lights
            wherever: word('b52', 'wherever'),                  // both do stairs light, the houses glow
            starts: word('b52', 'starts:'), home: word('b52', 'home.'),   // stair 1; both do stairs and houses
            out4: at('b52', 'end'),                             // card 4, its panel, the names and the kicker leave
            lad: at('b53', 'start', -0.04),                     // 14f: the staircase becomes the ladder, large
            sr: word('b53', 'Scale Runner'), runner: word('b53', 'Runner,'), sing1: word('b53', 'sing'),   // title; names, connector; waver
            maj53: word('b53', 'major scale'), back: word('b53', 'back,'),
            one: word('b53', 'one note'), note: word('b53', 'note'), time: word('b53', 'time.'),
            toCard: word('b53', 'time.', 'start', 0.05),        // 14g: the ladder eases to its card-time box (0.6 s), before line 1
            set: word('b53', 'Set'), settings: word('b53', 'Settings'),
            first: word('b53', 'first,'), sing: word('b53', 'sing in the octave'),
            octave: word('b53', 'octave'), plays: word('b53', 'plays.'),
            card: at('card'), cardEnd: at('card', 'end'),       // the card pause (the phone line lands); the card and the ladder fade
          }
          const W47 = [0, 1, 2, 3, 4, 5, 6].map((k) => word('b47', k))   // T T S T T T S, a riser on each word
          A.doOn = A.tiDo + 0.45                                // do's onset in the ti-do sound: the bead hops into the top house (0.3 s)
          A.inHouse = A.doOn + 0.3                              // it is inside: the house lit, its one echo ring
          A.morph = A.lad + 0.1                                 // the treads travel to the large ladder (1.2 s, power2.inOut)
          A.l1 = A.toCard + 0.6; A.l2 = A.l1 + 0.3              // the card's first two lines, once the ladder has made room
          A.twoS = W47[6] + 0.5                                 // both semitones (labels, bars, glows, their stairs) pulse as "semitone." ends
          A.landD = A.toD + 0.8                                 // stair 1 lights as the slide to D lands
          A.ask50 = A.semi50 + 0.35                             // the ti-do riser's outline pulses, being asked about
          A.trace = A.first + 0.4                               // the ladder's title pulses as its path lands on the card
          // the scene's one ripple: on "steps" the stairs light in turn, left to right, 0.07 s apart
          const RIPPLE = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => A.steps + 0.07 * (n - 1))
          // a label's pulse 0.15 s after its bar's, so the one's turn is the other's move (no dead sample at a peak)
          const LAG = (times) => [].concat(times).map((t0) => t0 + 0.15)
          const PUL4 = [A.joined, A.tone47], PUL4L = LAG(PUL4), PULS = [A.twoS], PULSL = LAG(PULS)
          const PUL7 = [A.semiEnd, A.just, A.most], PUL7L = [A.semiEnd + 0.15, A.just + 0.15, A.most + 0.2]
          const STARTSL = LAG(A.starts).map((t0) => t0 + 0.15), BACKL = [A.back + 0.2, A.octave + 0.15]
          A.out2n = A.out2 + 0.15                               // F# and C# names leave just after card 2's lines
          A.lit8p = A.inHouse + 0.35                            // the top stair answers the house's light
          // fa and so, the stairs the joining tone links, pulse with its riser on "joined" and "tone."
          const PULSE_N = { 4: PUL4, 5: PUL4, 7: [A.tone50, A.tee51, A.hear], 8: [A.semi50, A.lit8p, A.home51] }
          const NAME_N = { 1: STARTSL, 4: PUL4L, 5: PUL4L, 7: LAG(PULSE_N[7]), 8: LAG(PULSE_N[8]) }
          A.rangeW = word('b53', 'range')                       // "Singing Voice Range" swells 1.2 from its left edge
          // the card pause: each tab icon glows in turn with its line's underline sweep, More's last; nothing after
          const ICONP = [0, 1, 2, 3].map((k) => at('card', 'start', 0.11 + 0.8 * k))   // x, Settings, Exercises, More: 465.8 to 468.2

          /* ---------------------------------------------------------------- camera (HANDOFFS § Camera moves) */
          const cam = L.frameRig(room, { from: 'F0' })
          cam.to(A.push1, 1.6, 'F-recap-1', 'power2.inOut')
          cam.to(A.pull1, 1.0, 'F0', 'power2.inOut')
          cam.to(A.push2, 1.2, 'F-recap-3', 'power2.inOut')
          cam.to(A.pull2, 1.0, 'F0', 'power2.inOut')

          /* ---------------------------------------------------------------- the world (mid layer) */
          const mid = L.stage(room.mid)
          const defs = L.svg('defs', {}, mid)
          const soft = L.svg('filter', { id: SID + '-soft', x: '-200%', y: '-60%', width: '500%', height: '220%' }, defs)
          L.svg('feGaussianBlur', { stdDeviation: 6 }, soft)
          const st = L.stairs(mid, {})
          // the gold risers' glow as they grow (an accent), behind the blocks; both on C (14b's two, 14d's ti-do)
          const accents = L.svg('g', {}, null)
          st.svg.insertBefore(accents, st.gAll)
          const goldGlow = [3, 7].map((n) => L.svg('rect', { x: ST.riserX(n, 0) - 9, width: 18, y: ST.tread(n + 1, 0) - 6, height: ST.tread(n, 0) - ST.tread(n + 1, 0) + 12, rx: 9, fill: C.gold, opacity: 0, filter: `url(#${SID}-soft)` }, accents))
          const kb = L.strip(mid, {})
          st.stairs.forEach((S, i) => S.names.prepare([SOL[i]]))
          st.risers.forEach((R) => R.labels.prepare(['T', 'S']))
          kb.keys[6].names.prepare(['F♯']); kb.keys[13].names.prepare(['C♯']); kb.keys[7].names.prepare(['G']); kb.keys[19].names.prepare(['G'])
          // the curved ink arrow (s10's, from s01: the kit's L.arrow is straight)
          const curveArrow = (parent, { color = C.ink, width = 3, head = 14 } = {}) => {
            const g = L.svg('g', { opacity: 0 }, parent)
            const shaft = L.svg('path', { fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linecap': 'round' }, g)
            const tip = L.svg('path', { fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g)
            const qb = (A, Q, B, u) => [(1 - u) * (1 - u) * A[0] + 2 * u * (1 - u) * Q[0] + u * u * B[0], (1 - u) * (1 - u) * A[1] + 2 * u * (1 - u) * Q[1] + u * u * B[1]]
            return {
              draw(p, a, { A, Q, B }) {
                const u = clamp(p)
                if (a <= 0.004 || u <= 0.01) { g.setAttribute('opacity', '0'); return }
                let d = ''
                for (let i = 0; i <= 24; i++) { const q = qb(A, Q, B, (u * i) / 24); d += (i ? 'L' : 'M') + f1(q[0]) + ' ' + f1(q[1]) }
                shaft.setAttribute('d', d)
                const e = qb(A, Q, B, u), e0 = qb(A, Q, B, Math.max(0, u - 0.05))
                const ang = Math.atan2(e[1] - e0[1], e[0] - e0[0])
                const hx = (k) => e[0] - head * Math.cos(ang + k), hy = (k) => e[1] - head * Math.sin(ang + k)
                tip.setAttribute('d', `M${f1(hx(0.5))} ${f1(hy(0.5))} L${f1(e[0])} ${f1(e[1])} L${f1(hx(-0.5))} ${f1(hy(-0.5))}`)
                g.setAttribute('opacity', a.toFixed(3))
              },
            }
          }
          // 14d's ink arrow on "lean up", from ti's tread to the top house (as S3's)
          const inkArrow = curveArrow(mid, { color: C.ink, width: 2.5, head: 12 })
          const INK = (() => {
            // as S3's: up from ti's tread, then across into the house's left wall (x 1118, under the eave); the tip's
            // stroke ends about 3 px from the wall (4 px on screen in F-recap-3)
            const hb = ST.houseBox(8, 0, 0)
            const A = [ST.colX(7, 0) + 10, ST.tread(7, 0) - 14], B = [hb.x + 8 - 4, hb.cy + 4]
            return { A, Q: [A[0] + 8, B[1] + 2], B }
          })()
          const echo = L.echoRings(mid, { dur: 0.9, grow: 3.5, width: 3, max: 3 })
          // 14d's chrome bead, drawn under the houses, so it goes into the top house rather than over it
          const beadG = L.svg('g', {}, null)
          st.gAll.insertBefore(beadG, st.houses.top.g.parentNode)
          const bead = L.bead(beadG, { r: 22, color: C.chrome })
          const hb8 = ST.houseBox(8, 0, 0)
          // it drops onto ti as the top house unlights, rests there, and on do's onset hops from ti straight into
          // the house's centre (0.3 s), shrinking to nothing as the house lights round it: it never rests over the house
          const beadAt = (t) => {
            const p7 = ST.rest(7, 0, 0), hc = [hb8.cx, hb8.cy]
            if (t >= A.tiDo - 0.2 && t < A.tiDo) return L.bead4.dropAt(t, A.tiDo, p7)
            if (t >= A.tiDo && t < A.doOn) { const [sx, sy] = L.bead4.squash(t, A.tiDo); return { x: p7[0], y: p7[1], sx, sy } }
            if (t >= A.doOn && t < A.inHouse) {
              const [x, y] = L.bead4.hopAt(t, A.inHouse, p7, hc, { dur: 0.3, lift: 16 })
              return { x, y, scale: 1 - P(t, A.doOn + 0.09, 0.21, 'power2.in') }
            }
            return null
          }
          // 14b: S6's brackets (HANDOFFS § S6's brackets: ink, ticks down, riding the world, at S6's y 458 and 276),
          // over stairs 1 to 4 on "Two" and 5 to 8 on "groups,"; in F-recap-1 they sit at y 497.5 and 270, the
          // card panel and the top house out of their way (both allowances: card 1 leaves at c1Out, the top house
          // with the bottom one)
          const brLow = L.bracket(mid, { x1: 242, x2: 714, y: 458, dir: 'up', tick: 8, color: C.ink, width: 3 })
          const brHigh = L.bracket(mid, { x1: 722, x2: 1194, y: 276, dir: 'up', tick: 8, color: C.ink, width: 3 })

          /* ---------------------------------------------------------------- the ladder (14f; HANDOFFS § The ladder), F0 */
          // Two layouts of one drawing (DECISIONS 97, 102). Large through 14f, filling the frame above the Mercs: the panel
          // x 240 to 1672, y 160 to 720, 30 px a semitone, rungs 90 px wide. Its sides keep 20 px or more from the Mercs'
          // bodies and speech marks as measured on the clip (Merc's marks reach x 217 at y 734 to 776, Tavi's x 1692 at
          // y 735 to 792; the panel's corners are 27 and 25 px from them). The card-time box from 460.0: x 300 to 1620,
          // y 150 to 460, 16 px a semitone, G4 at 422, rungs 56 px. The large layout is the card-time one in the same
          // proportions: x maps the box's x 300 to 1620 onto 240 to 1672 (1.0848), so the playhead stays at 45 % (884.4)
          // and the rungs keep the app's spacing for six (106.3 px apart); y keeps the box's proportions (1.8065): the
          // title at 250, the playhead 286 to 684, the pitch band centred where the box puts it (G4 658, G5 298). Type
          // keeps its size; strokes and their opacities (100, 89, 78, 67, 56, 45 %) are the same in both. The ease
          // between them: 459.4 to 460.0, power2.inOut.
          const VIOLET = '#a78bfa', AMB = '#f59e0b'
          const RX = [992, 1090, 1188, 1286, 1384, 1482]          // the rungs' card-time centres, 98 px apart
          const RS = [4, 5, 7, 9, 11, 12]                         // their pitches, semitones above G4: B4 C5 D5 E5 F#5 G5
          const RO = [1, 0.89, 0.78, 0.67, 0.56, 0.45]            // their strokes, fading with distance
          const LADC = { x: 300, y: 150, w: 1320, h: 310, g4: 422, semi: 16, rung: 56, ty: 200, p0: 220, p1: 440 }
          const LADL = { x: 240, y: 160, w: 1432, h: 560, g4: 658, semi: 30, rung: 90, ty: 250, p0: 286, p1: 684 }
          const lay = (e) => {
            const v = (k) => lerp(LADL[k], LADC[k], e), kx = LADL.w / LADC.w
            return {
              X: (x) => lerp(LADL.x + (x - LADC.x) * kx, x, e),               // a card-time x in this layout
              Y: (s) => lerp(LADL.g4 - LADL.semi * s, LADC.g4 - LADC.semi * s, e),   // a pitch, semitones above G4
              x: v('x'), y: v('y'), w: v('w'), h: v('h'), rung: v('rung'), ty: v('ty'), p0: v('p0'), p1: v('p1'),
            }
          }
          const gLad = L.svg('g', { display: 'none' }, mid)
          const ladPanel = L.svg('rect', { rx: 16, fill: C.obsidian, 'fill-opacity': 0.55, stroke: C.chrome, 'stroke-opacity': 0.25, 'stroke-width': 2, opacity: 0 }, gLad)
          const ladTitle = L.svg('text', { fill: C.ink, opacity: 0, style: "font: 600 40px 'Outfit', sans-serif; white-space: pre;", text: 'Scale Runner' }, gLad)
          const ladIllu = L.svg('text', { fill: C.ink2, opacity: 0, 'text-anchor': 'end', style: "font: 500 28px 'JetBrains Mono', monospace; letter-spacing: 0.12em; white-space: pre;", text: 'ILLUSTRATION' }, gLad)
          const playhead = L.svg('line', { stroke: C.chrome, 'stroke-opacity': 0.35, 'stroke-width': 2, opacity: 0 }, gLad)
          const gTarget = L.svg('g', { opacity: 0 }, gLad)
          // the connector draws on from the playhead through the rungs on "Runner," (a clip, so its dashes stay put)
          const cc = L.svg('clipPath', { id: SID + '-conn' }, defs)
          const connClip = L.svg('rect', { x: 0, y: 0, width: 0, height: 1080 }, cc)
          const conn = L.svg('path', { fill: 'none', stroke: C.chrome, 'stroke-opacity': 0.3, 'stroke-width': 1, 'stroke-dasharray': '3 4', 'clip-path': `url(#${SID}-conn)` }, gLad)
          const target = L.svg('line', { stroke: AMB, 'stroke-width': 3, 'stroke-dasharray': '10 8' }, gTarget)
          const gPill = L.svg('g', {}, gLad)
          const pillR = L.svg('rect', { width: 52, height: 34, rx: 17, fill: '#161b22', 'fill-opacity': 0.95, stroke: AMB, 'stroke-width': 2 }, gPill)
          const pillT = L.svg('text', { fill: C.ink, 'text-anchor': 'middle', style: "font: 500 26px 'JetBrains Mono', monospace; white-space: pre;", text: 'A4' }, gPill)
          const rungNames = ['B4', 'C5'].map((s) => L.svg('text', { fill: C.ink2, opacity: 0, 'text-anchor': 'middle', style: "font: 500 30px 'JetBrains Mono', monospace; white-space: pre;", text: s }, gLad))
          const rungGlow = L.svg('line', { stroke: C.chrome, 'stroke-width': 10, 'stroke-linecap': 'round', opacity: 0, filter: `url(#${SID}-soft)` }, gLad)
          // the eight treads: each starts as the kit's tread line on G (3 px chrome at 70 %, 5 px in from each corner)
          const treads = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => {
            const cx = ST.colX(n, 4), y = ST.tread(n, 7) + 1.5
            return { n, k: n - 3, from: { x0: cx - 51, x1: cx + 51, y, w: 3, op: 0.7 }, el: L.svg('path', { fill: 'none', 'stroke-linecap': 'round' }, gLad) }
          })
          // where a tread ends up in a layout: G4 and A4 (a break between) in violet, the six rungs (inset by their caps).
          // A4 lands as a 20 px stub at the break and draws on to the playhead on "sing a major scale back" (sing = d 0,
          // back = d 1): the singing the line stands for, while Merc describes it
          const STUB = 20
          const treadTo = (R, Ly, d = 1) => (R.n === 1 ? { x0: Ly.X(340), x1: Ly.X(600), y: Ly.Y(0), w: 4, op: 1, violet: 1 }
            : R.n === 2 ? { x0: Ly.X(660), x1: lerp(Ly.X(660) + STUB, Ly.X(894), d), y: Ly.Y(2), w: 4, op: 1, violet: 1 }
            : { x0: Ly.X(RX[R.k]) - Ly.rung / 2 + (R.k ? 2 : 3), x1: Ly.X(RX[R.k]) + Ly.rung / 2 - (R.k ? 2 : 3), y: Ly.Y(RS[R.k]), w: R.k ? 4 : 6, op: RO[R.k], violet: 0 })
          // the first rung scales on "note" (it brightens) and on "time."
          const RUNG0P = [A.note, A.time]
          const mixC = (u) => `rgb(${Math.round(lerp(195, 167, u))},${Math.round(lerp(204, 139, u))},${Math.round(lerp(214, 250, u))})`

          /* ---------------------------------------------------------------- S14 to S15: the top rung carried across the cut */
          // HANDOFFS § S14 to S15. The ladder's top rung, do (card time: x 1454 to 1510 at y 230, 4 px, 45 %), brightens

          // the app's own icons at b803c7d43 (24-unit viewBox, the app's stroke widths): the intro's close glyph

              {
                const gx = Ly.X(RX[0]), gy = Ly.Y(RS[0])
                rungGlow.setAttribute('x1', f1(gx - Ly.rung / 2)); rungGlow.setAttribute('x2', f1(gx + Ly.rung / 2))
                rungGlow.setAttribute('y1', f1(gy)); rungGlow.setAttribute('y2', f1(gy))
                rungGlow.setAttribute('opacity', (0.55 * P(t, A.note, 0.3)).toFixed(3))
              }
              // the violet tip wavers at the playhead on "one note at a time" and again on "plays."
              const wav = Math.max(L.env(t, A.one, 0.1, 0.15, 0.4), L.env(t, A.time, 0.1, 0.3, 0.4), L.env(t, A.plays, 0.1, 0.3, 0.4))
              const sungD = P(t, A.sing1, A.back - A.sing1, 'power1.inOut')   // A4 draws on, "sing" to "back," (1.23 s)
              for (const R of treads) {
                // the top rung is carried from the card's end (drawCarry)
                if (R.n === 8 && t >= A.cardEnd) { R.el.setAttribute('d', ''); continue }
                const F = R.from, Tg = treadTo(R, Ly, sungD)
                const k = R.k
                const sc = k === 0 ? L.pulse(t, RUNG0P, 0.25, { long: true }) : 1
                const x0 = lerp(F.x0, Tg.x0, u), x1 = lerp(F.x1, Tg.x1, u), y = lerp(F.y, Tg.y, u)
                const cx = (x0 + x1) / 2, hw = ((x1 - x0) / 2) * sc
                let d = `M${f1(cx - hw)} ${f1(y)} L${f1(cx + hw)} ${f1(y)}`
                if (R.n === 2 && wav > 0.002) {
                  d = `M${f1(cx - hw)} ${f1(y)}`
                  for (let i = 1; i <= 40; i++) {
                    const x = lerp(cx - hw, cx + hw, i / 40), wx = L.smooth(x1 - 80, x1, x)
                    d += ` L${f1(x)} ${f1(y + 5 * wav * wx * Math.sin(2 * Math.PI * (6 * t + (x - x1) / 60)))}`
                  }
                }
                R.el.setAttribute('d', d)
                R.el.setAttribute('stroke', Tg.violet ? mixC(u) : C.chrome)
                R.el.setAttribute('stroke-opacity', lerp(F.op, Tg.op, u).toFixed(3))
                R.el.setAttribute('stroke-width', (lerp(F.w, Tg.w, u) * (k >= 0 ? sc : 1)).toFixed(2))
              }
            }

            // S14 to S15: the top rung, carried
            drawCarry(carryAt(t, A.cardEnd))

            // type (hud): the kicker, the four cards and their ring timers; each card brings its panel and takes it as
            // its lines leave (0.43 s, ending with its second line). Cards 1 and 2 bring it over the 0.2 s before their
            // first line, rising 12 px; cards 3 and 4 follow a card that left half a second before, so their panel
            // comes in with their first line, on its curve, and never shows empty between two cards
            {
              let pa = 0, pdy = 0
              for (const K of CARDS) {
                const tp = K.tIn[0] - K.lead
                const k = (K.lead ? P(t, tp, 0.2, 'power1.out') : P(t, tp, 0.2)) * (1 - P(t, K.tOut, 0.43))
                if (k > pa) { pa = k; pdy = 12 * (1 - P(t, tp, 0.5, 'power2.out')) }
              }
              gPanel.setAttribute('opacity', pa.toFixed(3))
              gPanel.setAttribute('transform', `translate(0 ${f1(pdy)})`)
            }
            kick.draw(t, A.kick, A.kickOut)
            for (const K of CARDS) {
              K.els.forEach((el, i) => {
                const tO = K.tOut + 0.08 * i                    // each line leaves up (0.35 s), the second 0.08 s after
                el.setAttribute('opacity', (P(t, K.tIn[i], 0.2) * (1 - P(t, tO, 0.35))).toFixed(3))
                el.setAttribute('transform', `translate(0 ${f1(20 * (1 - P(t, K.tIn[i], 0.7, 'power3.out')) - 16 * P(t, tO, 0.35, 'power2.in'))})`)
              })
              K.ring.draw(t, at(K.q), cue(K.q).dur)
            }

            // the practise card: top line first, each line in over 0.2 s, rising 20 px; the icons pulse in turn in
            // the card pause with each line's underline sweep, More's last; all fade with the ladder (0.3 s)
            const cOut = 1 - P(t, A.cardEnd, 0.3), cLift = -10 * P(t, A.cardEnd, 0.3, 'power2.in')
            for (const Ln of LINES) {
              Ln.g.setAttribute('opacity', (P(t, Ln.tIn, 0.2) * cOut).toFixed(3))
              Ln.g.setAttribute('transform', `translate(0 ${f1(20 * (1 - P(t, Ln.tIn, 0.7, 'power3.out')) + cLift)})`)
            }
            icons.forEach((R, k) => {
              const times = [ICONP[k]].concat(k === 1 ? [A.settings] : [])
              const pop = lerp(0.4, 1, P(t, R.ln.tIn + 0.15, 0.5, 'back.out(2)'))
              const s = (R.size / 24) * pop * L.pulse(t, times, 0.25, { long: true })   // 1.25: clear of its words
              // the gear turns one tooth (45 degrees) on "Settings"
              const rot = k === 1 ? 45 * P(t, A.settings, 0.8, 'power1.inOut') : 0
              R.g.setAttribute('transform', `translate(${f1(R.cx ?? 960)} ${f1(R.cy ?? 0)}) rotate(${rot.toFixed(2)}) scale(${s.toFixed(4)}) translate(-12 -12)`)
              R.glow.setAttribute('opacity', Math.max(...times.map((tt) => L.env(t, tt, 0.15, 0.3, 0.6))).toFixed(3))
              const T = traces[k], x0 = (R.cx ?? 960) - R.size / 2, x1 = (R.ln.x0 ?? 960) + (R.ln.w || 0)
              T.setAttribute('x', f1(x0)); T.setAttribute('y', f1(R.ln.y + (k === 3 ? 5 : 13)))
              T.setAttribute('width', f1(Math.max(0.01, (x1 - x0) * P(t, ICONP[k], 0.75, 'power1.inOut'))))
              T.setAttribute('opacity', (0.7 * P(t, ICONP[k], 0.1) * (1 - P(t, ICONP[k] + 0.75, 0.35)) * cOut).toFixed(3))
              T.setAttribute('transform', `translate(0 ${f1(cLift)})`)
            })
            {
              const { R, Ln } = runsBy.range
              // from its left edge, so it grows away from the "›" before it (to x 1581 at most at 1.2)
              const s = L.pulse(t, A.rangeW, 'label', { long: true }), cx = R.x ?? 960, cy = Ln.y - 14
              R.el.setAttribute('transform', `translate(${f1(cx)} ${f1(cy)}) scale(${s.toFixed(4)}) translate(${f1(-cx)} ${f1(-cy)})`)
            }
          })
          window.__timelines = window.__timelines || {}
          window.__timelines[SID] = tl
        })()
      </script>
    </div>
  </body>
</html>
