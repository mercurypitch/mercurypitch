<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <div id="s15-next" data-composition-id="s15-next" data-start="0" data-duration="8.286" data-width="1920" data-height="1080">
      <div class="scene" id="s15-next-scene"></div>
      <!-- Merc passes, static (trap 4); timing written by python3 tools/merc-tags.py s15-next -->
      <video id="s15-next-m12-blue" data-merc="m12-blue" class="clip" muted playsinline src="assets/merc/m12-blue-merc.webm" data-start="0.000" data-duration="8.299" data-media-start="127.058"></video>
      <video id="s15-next-m12-blue-refl" data-merc="m12-blue" data-merc-refl class="clip" muted playsinline src="assets/merc/m12-blue-merc.webm" data-start="0.000" data-duration="8.299" data-media-start="127.058"></video>
      <video id="s15-next-m12-orange" data-merc="m12-orange" class="clip" muted playsinline src="assets/merc/m12-orange-merc.webm" data-start="0.000" data-duration="8.299" data-media-start="127.575"></video>
      <video id="s15-next-m12-orange-refl" data-merc="m12-orange" data-merc-refl class="clip" muted playsinline src="assets/merc/m12-orange-merc.webm" data-start="0.000" data-duration="8.299" data-media-start="127.575"></video>
      <script>
        ;(function () {
          /* S15, Next time (STORYBOARD row 15; HANDOFFS § S14 to S15, § S15, § S15 to S16): Lesson 5's hook.
             In: the Mercs in the corners at 300; the ladder and the card gone but for the ladder's top rung, do,
             gliding to (560, 520) on one curve in film time (carryAt, the same in s14-recap) through "Next time.",
             down the right side and along y 520, under '"support"', which lands with the kicker on the next mark; it
             condenses into the chrome bead (471.9), just before "Singers". Out (to s16): the Mercs in the corners at 300; S15's type gone (478.5),
             and the bead in flight (polish round 2, DECISIONS 130): it sets off from the long note's end as o14 ends
             and crosses the cut on one curve (FLIGHT, the same code in s16-end) into the end card's blue bead.
             Merc talks b54 and b55, Tavi o14. The bead hovers (from film time) where the long note starts; on "a
             long note" it draws a level line from x 560 to 1360 at y 520; the line wavers once on "pushing".
             Every time is a cue, a word or a duration. */
          const SID = 's15-next'
          const D = L.dur(SID)
          const at = (cue, edge, off) => L.at(SID, cue, edge, off)
          const word = (line, which, edge, off) => L.word(SID, line, which, edge, off)
          const root = document.getElementById(SID + '-scene')
          const room = L.room(root, { floor: false })
          const S0 = L.scene(SID).start
          const tl = gsap.timeline({ paused: true })
          const P = L.prog, lerp = L.lerp, C = L.C
          const f1 = (v) => (Math.round(v * 100) / 100).toString()

          /* ---------------------------------------------------------------- anchors (by role) */
          const A = {
            cardEnd: at('card', 'end'),                   // S14's card fades; its top rung is carried (carryAt)
            land: at('card', 'end', 2.2),                 // the rung lands at (560, 520) as the chrome bead
            // film round 1 (DECISIONS 122): the kicker and '"support"' land together on the mark the scene cuts on
            // (0.15 s after the cut, 0.32 s before "Next"), so the frame the card leaves is filled at once
            kick: at('next'), kickOut: at('o14', 'end'),
            support: at('next'),                          // '"support"' lands with the kicker: the next lesson's word
            supportW: word('b55', 'support'),             // it scales 1.2 once as it is said
            long: word('b55', 'long'),                    // the bead draws the level line (1.3 s)
            pushing: word('o14', 'pushing'),              // the line wavers once (0.8 s)
            what: word('o14', 'what'),                    // "what keeps it steady?" lands
            steady: word('o14', 'steady?'),               // the bead scales 1.2
            out: at('o14', 'end', 0.07),                  // the type and the line leave up fast (0.3 s)
            // polish round 2 (DECISIONS 130): the bead does not leave with them. As Tavi's question ends it sets off
            // from the long note's end on its flight across the cut, and lands as the end card's blue bead where that
            // bead settles beside the lockup (s16-end's FLY + FLYD), so no frame of the cut holds only the Mercs
            fly: at('o14', 'end'), flyEnd: at('end', 'start', 0.95),
          }
          A.end = A.long + 1.3
          A.ring2 = A.steady + 0.12                       // the bead's pulse sends one more ring, just behind it
          const X0 = 560, X1 = 1360, Y = 520

          /* ---------------------------------------------------------------- the room and the Mercs */
          const dust = L.filmDust(room.near)
          const merc = L.mercGate(room.top, { sid: SID, pass: 'm12-blue', tag: SID + '-m12-blue', x: 110, size: 300, feet: 0.81 })
          const tavi = L.mercGate(room.top, { sid: SID, pass: 'm12-orange', tag: SID + '-m12-orange', x: 1800, size: 300, feet: 0.81 })

          /* ---------------------------------------------------------------- the long note (mid layer; F0 throughout) */
          const mid = L.stage(room.mid)
          const gNote = L.svg('g', {}, mid)
          const line = L.glowPath(gNote, { color: C.chrome, width: 4, glow: 16 })
          const echo = L.echoRings(gNote, { dur: 0.9, grow: 3.5, width: 3, max: 2 })
          // S14 to S15 (HANDOFFS § S14 to S15): the ladder's top rung, do, brightens to full (469.7 to 469.9) and glides
          // to (560, 520) (469.9 to 471.9, 2.0 s, power2.inOut; DECISIONS 102), down the right side and along y 520
          // (DECISIONS 108), condensing into the bead over its last 0.4 s. carryAt is the same function in s14-recap, of scene time and the card's end in that scene's time, so
          // both scenes draw it from film time on the same pixels on either side of the cut.
          const CARRY = (() => {
            // the path (DECISIONS 108): straight down the right side from the top rung's card-time place, curving left
            // onto y 520 at x 1000, then along y 520 (the line the long note draws later) to the bead's place; 24 px or
            // more from '"support"''s ink once the word lands (470.71). A polyline of 201 points on the curve, read by
            // arc length, so the glide's ease runs along the path at an even pace.
            const P0 = [1482, 230], P1 = [1482, 330], P2 = [1250, 520], P3 = [1000, 520], END = [560, 520], N = 200
            const pts = []
            for (let i = 0; i <= N; i++) {
              const s = i / N, a = (1 - s) ** 3, b = 3 * (1 - s) ** 2 * s, c = 3 * (1 - s) * s * s, d = s ** 3
              pts.push([a * P0[0] + b * P1[0] + c * P2[0] + d * P3[0], a * P0[1] + b * P1[1] + c * P2[1] + d * P3[1]])
            }
            pts.push(END)
            const cum = [0]
            for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]))
            const total = cum[cum.length - 1]
            return (u) => {
              const s = L.clamp(u) * total
              let i = 1
              while (i < cum.length - 1 && cum[i] < s) i++
              const f = (s - cum[i - 1]) / (cum[i] - cum[i - 1] || 1)
              return [L.lerp(pts[i - 1][0], pts[i][0], f), L.lerp(pts[i - 1][1], pts[i][1], f)]
            }
          })()
          // film round 1 (DECISIONS 122): it grows 2.5 times as it sets off (56 x 4 px to 140 x 10, over the glide's
          // first 0.7 s), so it reads as an object carried across the emptied frame, and condenses from that size
          const carryAt = (t, tc) => {
            if (t < tc) return null
            const br = P(t, tc, 0.2, 'none'), u = P(t, tc + 0.2, 2.0, 'power2.inOut'), c = P(t, tc + 1.8, 0.4, 'power2.in')
            const g = 1 + 1.5 * P(t, tc + 0.2, 0.7, 'power2.inOut')
            const [x, y] = CARRY(u)
            return { x, y, len: 52 * g * (1 - c), th: lerp(4 * g, 44, c), op: lerp(0.45, 1, br), bead: P(t, tc + 2.05, 0.15, 'none') }
          }
          // S15 to S16 (polish round 2, DECISIONS 130): the bead's flight from the long note's end into the end card's blue
          // bead, the same code in s15-next and s16-end and drawn from film time, so it is on the same pixels either side of
          // the cut: off the line and left at about y 440, under the space '"support"' leaves and above the end card's lower
          // lines, then up left of "Find your pitch." to the blue bead's place left of the orb (FEND; s16-end draws the last
          // pixels onto its orbit), each part passing before the type that lands there; 401 points read by arc length
          const FEND = [482, 106], FP = [], FC = [0]
          for (const [p0, p1, p2, p3] of [[[1360, 520], [1180, 455], [900, 440], [700, 432]], [[700, 432], [560, 425], [505, 300], FEND]]) {
            for (let i = FP.length ? 1 : 0; i <= 200; i++) {
              const s = i / 200, a = (1 - s) ** 3, b = 3 * (1 - s) ** 2 * s, c = 3 * (1 - s) * s * s, d = s ** 3
              FP.push([a * p0[0] + b * p1[0] + c * p2[0] + d * p3[0], a * p0[1] + b * p1[1] + c * p2[1] + d * p3[1]])
            }
          }
          for (let i = 1; i < FP.length; i++) FC.push(FC[i - 1] + Math.hypot(FP[i][0] - FP[i - 1][0], FP[i][1] - FP[i - 1][1]))
          const flightAt = (t, t0, t1) => {             // null before t0, then on sine.inOut along the path to t1
            if (t < t0) return null
            const s = P(t, t0, t1 - t0, 'sine.inOut') * FC[FC.length - 1]
            let i = 1
            while (i < FC.length - 1 && FC[i] < s) i++
            const f = (s - FC[i - 1]) / (FC[i] - FC[i - 1] || 1)
            return [0, 1].map((k) => lerp(FP[i - 1][k], FP[i][k], f))
          }
          const capsule = L.svg('rect', { fill: C.chrome, display: 'none' }, gNote)
          const bead = L.bead(gNote, { r: 22, color: C.chrome })

          /* ---------------------------------------------------------------- type (hud, frame-fixed) */
          const hud = L.stageOf(room.hud)
          const kick = L.kicker(room.hud, 'Next time')
          const SERIF = (px) => `font-family: 'Instrument Serif'; font-style: italic; font-size: ${px}px; letter-spacing: -0.01em; white-space: pre;`
          const supportT = L.svg('text', { x: 960, y: 420, 'text-anchor': 'middle', fill: C.ink, opacity: 0, style: SERIF(160), text: '“support”' }, hud)
          const steadyT = L.svg('text', { x: 960, y: 680, 'text-anchor': 'middle', fill: C.ink, opacity: 0, style: SERIF(96), text: 'what keeps it steady?' }, hud)

          L.clock(tl, D, (t) => {
            const T = S0 + t
            dust(T)
            merc(t); tavi(t)
            const out = P(t, A.out, 0.3, 'power3.in')
            const lift = -40 * out

            // the bead: the carried rung until it lands; then it hovers on a 4 px circle (from film time) until the long
            // note, which it draws level; it holds the line's end, sways with the waver, and scales 1.2 on "steady?"; from
            // o14's end it flies (FLIGHT) across the cut, at full, while the type and the line leave without it
            const hover = P(t, A.land + 0.25, 0.4) * (1 - P(t, A.long - 0.2, 0.2))
            const th = (2 * Math.PI * T) / 1.6
            const ux = P(t, A.long, 1.3, 'power1.inOut')
            const bx = lerp(X0, X1, ux)
            const wav = L.env(t, A.pushing, 0.12, 0.1, 0.6)
            const wave = (x) => wav * 16 * Math.sin(2 * Math.PI * ((x - X0) / 260 - 1.4 * (t - A.pushing))) * Math.sin(Math.PI * (x - X0) / (X1 - X0))
            let b = null
            const s = t < A.land ? carryAt(t, A.cardEnd) : null
            if (!s || s.bead >= 1) capsule.setAttribute('display', 'none')
            else {
              capsule.removeAttribute('display')
              capsule.setAttribute('x', f1(s.x - s.len / 2 - s.th / 2)); capsule.setAttribute('width', f1(s.len + s.th))
              capsule.setAttribute('y', f1(s.y - s.th / 2)); capsule.setAttribute('height', f1(s.th)); capsule.setAttribute('rx', f1(s.th / 2))
              capsule.setAttribute('opacity', (s.op * (1 - s.bead)).toFixed(3))
            }
            const fl = flightAt(t, A.fly, A.flyEnd)          // from o14's end: in flight, at full, over the cut
            if (s) b = s.bead > 0 ? { x: s.x, y: s.y, a: s.bead, scale: s.th / 44 } : null
            else if (fl) b = { x: fl[0], y: fl[1], a: 1, scale: L.pulse(t, A.steady, 'bead') }
            else b = { x: bx + 4 * hover * Math.cos(th), y: Y + 4 * hover * Math.sin(th) + wave(bx - 1) + lift, a: 1 - out, scale: L.pulse(t, A.steady, 'bead') }
            L.bead4.place(bead, b)
            // the level line, from the start to the bead
            if (ux > 0.001) {
              let d = ''
              for (let i = 0; i <= 80; i++) {
                const x = lerp(X0, bx, i / 80)
                d += (i ? 'L' : 'M') + f1(x) + ' ' + f1(Y + wave(x) + lift)
              }
              line.set(d)
              line.g.setAttribute('opacity', (0.85 * (1 - out)).toFixed(3))
            } else line.g.setAttribute('opacity', '0')
            echo.draw(t, [{ t: A.end, x: X1, y: Y, r: 22 }, { t: A.ring2, x: X1, y: Y + lift, r: 22 }])
            echo.g.setAttribute('opacity', (1 - out).toFixed(3))   // the last ring leaves with the type, before the cut

            // type: the kicker, '"support"', then "what keeps it steady?"; all leave up fast at o14's end
            kick.draw(t, A.kick, A.kickOut)
            const land = (el, t0, s = 1, cy = 0, rise = 16, ease = 'power2.inOut') => {
              el.setAttribute('opacity', (P(t, t0, 0.2, ease) * (1 - out)).toFixed(3))
              el.setAttribute('transform', `translate(0 ${f1(rise * (1 - P(t, t0, 0.7, 'power2.out')) + lift)}) translate(960 ${cy}) scale(${s.toFixed(4)}) translate(-960 ${-cy})`)
            }
            land(supportT, A.support, L.pulse(t, A.supportW, 'label'), 370, 16, 'power2.out')   // in on the kicker's curve
            land(steadyT, A.what)
          })
          window.__timelines = window.__timelines || {}
          window.__timelines[SID] = tl
        })()
      </script>
    </div>
  </body>
