      <script>
        ;(function () {
          /* S11, Why do is home (STORYBOARD rows 11a to 11f; HANDOFFS § S10 to S11, § Inside D, § D to E).
             In (S10 to S11): both Mercs on screen (m09 and m10 span the cut); F0; the staircase on C, the stairs
             lit blue (they fade from 0.04 s before the cut, over 0.4 s, drawn alike in s10), no bead, the top
             house lit, the bottom house returning lit over the same 0.4 s.
             Out (to s12, fixed, D to E): F0, no Mercs (m11 ended 341.15), the kicker lane empty, every label
             gone (340.9); the staircase on D at full: names do to do, both houses lit, risers measured (no
             labels), hairlines; the strip with D major's keys, F♯4 and C♯5 lit. */
          const SID = 's11-why'
          const D = L.dur(SID)
          const at = (cue, edge, off) => L.at(SID, cue, edge, off)
          const word = (line, which, edge, off) => L.word(SID, line, which, edge, off)
          const root = document.getElementById(SID + '-scene')
          const room = L.room(root, { floor: false })
          const S0 = L.scene(SID).start
          const tl = gsap.timeline({ paused: true })
          const ST = L.ST, P = L.prog, clamp = L.clamp, lerp = L.lerp, light = L.light
          const f1 = (v) => (Math.round(v * 100) / 100).toString()
          const SEMI = (n) => ST.H[n] - ST.H[n - 1] === 1
          const CMAJ = ST.scale(0), DMAJ = ST.scale(2)
          const SOL = ['do', 're', 'mi', 'fa', 'so', 'la', 'ti', 'do']

          /* ---------------------------------------------------------------- anchors */
          const A = {
            blueOff: at('o10', 'start', -0.04),               // 11a: the blue fades, the bottom house returns (0.4 s; also in s10)
            dohHome: word('o10', 'doh'),                      // the top house glows, the top stair lights
            tee: word('o10', 'tee?'),                         // stair 7 lights
            hop: at('o10', 'end'),                            // both Mercs hop out (merc-shots.py's exits)
            kickIn: at('b35'),                                // the kicker "AN EXPERIMENT" and the first credit
            push: word('b35', 1, 'start', 0.32),              // the push to F-chart (1.2 s)
            heard: word('b35', 'heard'),                      // stair 1 lights ("heard a C ...")
            cMajor: word('b35', 'C'),                         // the stairs light in quick turn
            oneMore: word('b35', 'one more'),                 // the probe bead and its "?" appear
            note: word('b35', 'note,'),                       // its echo ring
            rated: word('b35', 'rated'),                      // the axis draws, "least" and "finishes it best"
            finished: word('b35', 'finished'),                // the probe scales 1.2
            top: word('b36', 'top'),                          // 11b: the probe fades, the staircase dims to 20 %, the names fly out
            doh: word('b36', 'doh.'),                         // do lands on the top shelf and scales 1.05
            dohEnd: word('b36', 'doh.', 'end'),               // and lights (40 % chrome) as the word ends
            later: word('b36', 'Later'),                      // "later studies: ..." types on
            order: word('b36', 'same'),                       // the tiers scale in turn, top to bottom ("the same kind of order")
            without: word('b36', 'without'),                  // "as summed up in Janata et al., 2003" types on
            only: word('b36', 'only', 'start', -0.04),        // the shelves close to 64 px apart (0.8 s)
            weaker: word('b36', 'weaker.'),                   // the tiers scale in turn again
            so: word('b36', 'So', 'start', 0.06),             // 11c: the shelves spread back to 80 px (0.8 s)
            home: word('b36', 'home'),                        // do's chip scales 1.05
            seemsB: word('b36', 'seems'),                     // a lit house falls toward the top shelf ...
            learned: word('b36', 'learned,'),                 // ... and lands beside do, which lights
            just: word('b36', 'just'),                        // the chips scale 1.05 in turn, top shelf to bottom
            pull: word('b36', 33, 'start', 0.17),             // the pull to F0 (0.9 s)
            o11: at('o11'),                                   // 11d: the kicker and credits leave; the chips fly back
            full: word('o11', 'finished', 'start', 0.02),     // the staircase back to full (0.4 s)
            onDoh: word('o11', 'doh'),                        // the top stair lights
            learnedO: word('o11', 'learned'),                 // "learned, it seems" lands
            isHome: word('o11', 'home,'),                     // the top house scales
            teeO: word('o11', 'tee'),                         // stair 7 lights
            oneShort: word('o11', 'one short step'),          // the ti-do riser grows; "one short step" and its hairline
            under: word('o11', 'under'),                      // the riser grows again
            itQ: word('o11', 'it?#2'),                        // the top stair lights ("under it?")
            seems: word('b37', 'how'),                        // 11e: both labels glow
            labelsOut: word('b37', 'Tee'),                    // they leave; stair 7 lights
            leading: word('b37', 'leading'),                  // "leading note" lands above ti
            noteW: word('b37', 'note,'),                      // it scales 1.2
            its: word('b37', "it's"),                         // stair 7 lights ("because it's thought of as leading")
            leadingTo: word('b37', 'leading#2'),              // the ink arrow curves from ti's tread up to do's (0.6 s)
            tonic: word('b37', 'tonic.'),                     // the top stair lights
            leads: word('b38', 'leads'),                      // 11f: the arrow pulses
            slide: word('b38', 'wherever', 'start', 0.06),    // the slide to D (0.8 s), "leading note" and the arrow riding
            homeIs: word('b38', 'is.'),                       // the top stair lights ("wherever home is")
            fromD: word('b38', 'From'),                       // D4 scales, stair 1 lights
            teeCs: word('b38', 'tee'),                        // C♯5 scales and is named; "ti = C♯" lands
            cSharp: word('b38', 'C sharp'),                   // stair 7 lights
            leans: word('b38', 'leans'),                      // the arrow draws again
            toD: word('b38', 'D.#2'),                           // the top stair lights
            allOut: at('b38', 'end'),                         // every label leaves (0.2 s)
            hop2: at('b38', 'end', -0.19),                    // both Mercs hop out
          }
          const SLIDE = 0.8

          /* ---------------------------------------------------------------- camera */
          const cam = L.frameRig(room, { from: 'F0' })
          cam.to(A.push, 1.2, 'F-chart', 'power2.inOut')
          cam.to(A.pull, 0.9, 'F0', 'power2.inOut')

          /* ---------------------------------------------------------------- the world (mid layer) */
          const mid = L.stage(room.mid)
          const defs = L.svg('defs', {}, mid)
          const soft = L.svg('filter', { id: SID + '-soft', x: '-200%', y: '-60%', width: '500%', height: '220%' }, defs)
          L.svg('feGaussianBlur', { stdDeviation: 6 }, soft)
          const st = L.stairs(mid, {})
          const accents = L.svg('g', {}, null)
          st.svg.insertBefore(accents, st.gAll)
          const goldGlow = L.svg('rect', { width: 18, rx: 9, fill: L.C.gold, opacity: 0, filter: `url(#${SID}-soft)` }, accents)
          const kb = L.strip(mid, {})
          st.stairs.forEach((S, i) => S.names.prepare([SOL[i]]))
          kb.keys[13].names.prepare(['C♯'])
          // a curved arrow (s10's, after group A's s01): a quadratic from A through Q to B, drawn on from A
          const curveArrow = (parent, { color = L.C.ink, width = 3, head = 14 } = {}) => {
            const g = L.svg('g', { opacity: 0 }, parent)
            const shaft = L.svg('path', { fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linecap': 'round' }, g)
            const tip = L.svg('path', { fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g)
            const qb = (A, Q, B, u) => [(1 - u) * (1 - u) * A[0] + 2 * u * (1 - u) * Q[0] + u * u * B[0], (1 - u) * (1 - u) * A[1] + 2 * u * (1 - u) * Q[1] + u * u * B[1]]
            return {
              g,
              draw(p, a, { A, Q, B }, { scale = 1 } = {}) {
                const u = clamp(p)
                if (a <= 0.004 || u <= 0.01) { g.setAttribute('opacity', '0'); return }
                let d = ''
                for (let i = 0; i <= 24; i++) { const q = qb(A, Q, B, (u * i) / 24); d += (i ? 'L' : 'M') + f1(q[0]) + ' ' + f1(q[1]) }
                shaft.setAttribute('d', d)
                const e = qb(A, Q, B, u), e0 = qb(A, Q, B, Math.max(0, u - 0.05))
                const ang = Math.atan2(e[1] - e0[1], e[0] - e0[0])
                const hx = (k) => e[0] - head * Math.cos(ang + k), hy = (k) => e[1] - head * Math.sin(ang + k)
                tip.setAttribute('d', `M${f1(hx(0.5))} ${f1(hy(0.5))} L${f1(e[0])} ${f1(e[1])} L${f1(hx(-0.5))} ${f1(hy(-0.5))}`)
                const m = qb(A, Q, B, 0.5)
                g.setAttribute('transform', scale === 1 ? '' : `translate(${f1(m[0])} ${f1(m[1])}) scale(${scale.toFixed(4)}) translate(${f1(-m[0])} ${f1(-m[1])})`)
                g.setAttribute('opacity', a.toFixed(3))
              },
            }
          }
          // 11e's arrow from ti's tread up onto the top do's, left of its house, as s10's ink arrow; it rides the slide
          const arrow = curveArrow(mid, { color: L.C.ink, width: 3, head: 14 })
          const arrowAt = (w, s0) => {
            // larger than s10's (that one is seen at 1.8x): its apex stands 24 px under "leading note"'s baseline,
            // right of the label's end, and 24 px over the ti-do riser
            const A = [ST.colX(7, w) - 18, ST.tread(7, s0) - 14], B = [ST.houseBox(8, w, s0).x - 14, ST.tread(8, s0) - 10]
            return { A, Q: [(A[0] + B[0]) / 2 - 2, Math.min(A[1], B[1]) - 46], B }
          }
          // "leading note" (Outfit 600 64 px, riding the world: x 660, baseline 300 on C; x 780, baseline 248 on D)
          const leadT = L.svg('text', { x: 660, y: 300, fill: L.C.ink, opacity: 0, style: "font: 600 64px 'Outfit', sans-serif; white-space: pre;", text: 'leading note' }, mid)
          let leadW = 384
          L.afterFonts(() => { leadW = leadT.getComputedTextLength() })

          // the experiment, riding the world (HANDOFFS § S11's experiment): the probe bead and its "?", the axis
          // and its labels, the four shelves, the chips and the house beside do
          const exp = L.svg('g', {}, mid)
          const probeG = L.svg('g', { opacity: 0 }, exp)
          const probe = L.bead(probeG, { r: 22, color: L.C.chrome })
          L.svg('text', { x: 34, y: -6, fill: L.C.ink2, style: "font: 600 44px 'Outfit', sans-serif;", text: '?' }, probe.g)
          const axis = L.arrow(exp, { x1: 1300, y1: 560, x2: 1300, y2: 280, color: L.C.ink2, width: 3, head: 14 })
          const LAB32 = "font: 500 32px 'Outfit', sans-serif; white-space: pre;"
          const bestT = L.svg('text', { x: 1320, y: 290, fill: L.C.ink2, opacity: 0, style: LAB32, text: 'finishes it best' }, exp)
          const leastT = L.svg('text', { x: 1320, y: 568, fill: L.C.ink2, opacity: 0, style: LAB32, text: 'least' }, exp)
          const shelves = [0, 1, 2, 3].map(() => L.svg('rect', { x: 400, width: 0, height: 2, fill: '#c3ccd6', 'fill-opacity': 0.5, opacity: 0 }, exp))
          const chipLayer = L.svg('g', {}, exp)
          const shelfHouse = L.house(chipLayer)
          const UNLIT = '#1b232d', DIMCHIP = 'rgb(77,83,90)'     // the dim chips: an opaque 35 % chrome mix over obsidian
          const makeChip = (text, dim) => {
            const g = L.svg('g', { opacity: 0 }, chipLayer)
            const box = L.svg('rect', { x: -60, y: -28, width: 120, height: 56, rx: 12, fill: dim ? DIMCHIP : UNLIT, stroke: '#c3ccd6', 'stroke-width': 2, 'stroke-opacity': dim ? 0 : 0.55 }, g)
            const lab = L.spell(g, text, { x: 0, y: 14, size: 40, family: 'Outfit', weight: 600, fill: L.C.ink, anchor: 'middle' })
            lab.g.querySelectorAll('text').forEach((el) => el.setAttribute('data-layout-allow-overlap', ''))
            return { g, box, lab }
          }
          // each chip: its source (a stair's name, or a black key), its tier (0 top) and its centre x on the shelf;
          // the flights out (staggered, 307.2 to 308.2 with do landing on "doh") and back (from o11)
          const CHIPS = [
            { text: 'do', tier: 0, x: 840, n: 1 }, { text: 'do', tier: 0, x: 840, n: 8 },
            { text: 'mi', tier: 1, x: 760, n: 3 }, { text: 'so', tier: 1, x: 920, n: 5 },
            { text: 're', tier: 2, x: 600, n: 2 }, { text: 'fa', tier: 2, x: 760, n: 4 }, { text: 'la', tier: 2, x: 920, n: 6 }, { text: 'ti', tier: 2, x: 1080, n: 7 },
            { text: 'C♯', tier: 3, x: 520, m: 1 }, { text: 'D♯', tier: 3, x: 680, m: 3 }, { text: 'F♯', tier: 3, x: 840, m: 6 }, { text: 'G♯', tier: 3, x: 1000, m: 8 }, { text: 'A♯', tier: 3, x: 1160, m: 10 },
          ]
          const FLY = 0.7
          CHIPS.forEach((c, i) => {
            c.el = makeChip(c.text, c.m != null)
            c.el.g.setAttribute('data-tier', c.tier)
            c.dim = c.m != null
            if (c.tier === 0) c.out = A.doh - FLY
            else if (c.tier === 1) c.out = A.top + 0.28 + 0.06 * (i - 2)
            else if (c.tier === 2) c.out = A.top + 0.08 + 0.06 * (i - 4)
            else c.out = A.top + 0.63 + 0.1 * (i - 8)
            c.back = A.o11 + 0.04 * i                          // lands back by A.o11 + 0.04 * 12 + FLY (322.76)
            // where it starts: a stair's name (its cap centre, at 0.9 so the 40 px name is the 36 px one) or the key
            c.home = c.dim ? [ST.keyX(c.m), 798] : [ST.colX(c.n, 0), ST.foot(0) - 12 - 0.9 * 14]
          })
          const dust = L.filmDust(room.near)

          /* ---------------------------------------------------------------- the Mercs (top layer, screen space) */
          const tavi9 = L.mercGate(room.top, { sid: SID, pass: 'm09-orange', tag: SID + '-m09-orange', x: 1800, hop: A.hop })
          const merc10 = L.mercGate(room.top, { sid: SID, pass: 'm10-blue', tag: SID + '-m10-blue', x: 110, mirror: true, hop: A.hop, hopDx: -360 })
          const merc11 = L.mercGate(room.top, { sid: SID, pass: 'm11-blue', tag: SID + '-m11-blue', x: 110, mirror: true, hop: A.hop2, hopDx: -360 })
          const tavi11 = L.mercGate(room.top, { sid: SID, pass: 'm11-orange', tag: SID + '-m11-orange', x: 1800, hop: A.hop2 })
          const topSvg = L.stage(room.top)
          const echo = L.echoRings(topSvg, { dur: 0.9, grow: 3.5, width: 3, max: 4 })

          /* ---------------------------------------------------------------- frame-fixed type (hud) */
          const hud = L.stageOf(room.hud)
          const kicker = L.kicker(room.hud, 'An experiment')
          // the credits, Outfit 500 ink-2 at x 120; the two later lines type on, a letter at a time (a hidden letter
          // is display: none, so nothing invisible is left in the layout)
          const credit1 = L.svg('text', { x: 120, y: 160, fill: L.C.ink2, opacity: 0, style: "font: 500 36px 'Outfit', sans-serif; white-space: pre;", text: 'Krumhansl & Shepard, 1979' }, hud)
          const typed = (text, y) => {
            const el = L.svg('text', { x: 120, y, fill: L.C.ink2, style: LAB32 }, hud)
            const spans = [...text].map((ch) => L.svg('tspan', { text: ch, display: 'none' }, el))
            return { el, spans, n: spans.length }
          }
          const credit2 = typed('later studies: without training too, only weaker', 205)
          const credit3 = typed('as summed up in Janata et al., 2003', 245)
          const LAB48 = "font: 600 48px 'Outfit', sans-serif; white-space: pre;"
          // Tavi's answer as two labels (x 1250, baselines 320 and 400), each with a soft copy behind it for the glow
          const answer = ['learned, it seems', 'one short step'].map((text, i) => {
            const g = L.svg('g', { opacity: 0 }, hud)
            const glow = L.svg('text', { x: 1250, y: 320 + 80 * i, fill: '#c3ccd6', opacity: 0, filter: `url(#${SID}-hglow)`, style: LAB48, text }, g)
            const el = L.svg('text', { x: 1250, y: 320 + 80 * i, fill: L.C.ink, style: LAB48, text }, g)
            return { g, glow, el }
          })
          {
            const hdefs = L.svg('defs', {}, hud)
            const hg = L.svg('filter', { id: SID + '-hglow', x: '-20%', y: '-60%', width: '140%', height: '220%' }, hdefs)
            L.svg('feGaussianBlur', { stdDeviation: 7 }, hg)
          }
          // the hairline from "one short step"'s left end to the ti-do riser (1078, 365), drawn on toward the riser
          const hair = L.svg('line', { x1: 1240, y1: 383, x2: 1240, y2: 383, stroke: '#c3ccd6', 'stroke-opacity': 0.7, 'stroke-width': 1.5, 'stroke-linecap': 'round', opacity: 0 }, hud)
          const tiCs = L.spell(hud, 'ti = C♯', { x: 1360, y: 300, size: 48, family: 'Outfit', weight: 600, fill: L.C.ink })
          tiCs.g.setAttribute('opacity', '0')

          /* ---------------------------------------------------------------- per-frame state */
          const LIGHTS = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [], 8: [] }
          const addL = (n, t0, up = 0.4, down = 0.8) => LIGHTS[n].push([t0, up, down])
          addL(8, A.dohHome); addL(7, A.tee); addL(1, A.heard)
          for (let n = 1; n <= 8; n++) addL(n, A.cMajor + 0.1 * (n - 1), 0.3, 0.4)
          addL(8, A.onDoh); addL(7, A.teeO); addL(7, A.labelsOut); addL(8, A.tonic)
          addL(1, A.fromD); addL(7, A.cSharp); addL(8, A.toD)
          addL(8, A.itQ, 0.3, 0.4); addL(7, A.its, 0.3, 0.4); addL(8, A.homeIs, 0.3, 0.4)
          const litC = (n, t) => LIGHTS[n].reduce((k, [t0, up, dn]) => Math.max(k, light(t, t0, up, dn)), 0)
          const GROW = [A.oneShort, A.under]
          const gap = (t) => 80 - 16 * (P(t, A.only, 0.8) - P(t, A.so, 0.8))
          const shelfY = (k, t) => 300 + gap(t) * k
          // a chip's place at t: flying out on an arc, on its shelf, or flying back
          const qb = (a, q, b, u) => [(1 - u) * (1 - u) * a[0] + 2 * u * (1 - u) * q[0] + u * u * b[0], (1 - u) * (1 - u) * a[1] + 2 * u * (1 - u) * q[1] + u * u * b[1]]
          const chipAt = (c, t) => {
            if (t < c.out || t >= c.back + FLY) return null
            const slot = [c.x, shelfY(c.tier, t) - 2 - 28]
            const q = (a, b) => [(a[0] + b[0]) / 2, Math.min(a[1], b[1]) - 70]
            if (t < c.out + FLY) {
              const u = P(t, c.out, FLY, 'power2.inOut')
              return { p: qb(c.home, q(c.home, slot), slot, u), box: clamp(u / 0.35), s: lerp(c.dim ? 0.7 : 0.9, 1, u), a: c.dim ? clamp(u / 0.3) : 1 }
            }
            if (t >= c.back) {
              const u = P(t, c.back, FLY, 'power2.inOut')
              // a dim chip is gone by the middle of its flight back, before it crosses the stairs' names
              return { p: qb(slot, q(c.home, slot), c.home, u), box: clamp((1 - u) / 0.35), s: lerp(1, c.dim ? 0.7 : 0.9, u), a: c.dim ? clamp(1 - u / 0.45) : 1 }
            }
            return { p: slot, box: 1, s: 1, a: 1 }
          }
          // a stair's name is the chip while its chip is away
          const nameA = (n, t) => {
            const c = CHIPS.find((k) => k.n === n)
            return t < c.out ? 1 : t >= c.back + FLY ? 1 : 0
          }
          // the tiers' counted pulses, top shelf to bottom
          // (the tiers pulse only while the shelves stand 80 px apart, so the chips keep 8 px apart when closed)
          const TIERP = [0, 1, 2, 3].map((k) => [A.order + 0.3 * k, A.just + 0.25 * k])
          // on "weaker", with the shelves closed, the scale chips light (40 % chrome) in turn, top shelf to bottom
          const TIERL = [0, 1, 2].map((k) => A.weaker + 0.15 * k)
          const DOL = [A.dohEnd, A.learned]                   // do's chip lights alone
          const tierPulse = (tier, t) => Math.max(
            L.pulse(t, TIERP[tier], 'tile'),
            tier === 0 ? L.pulse(t, [A.doh, A.home], 'tile') : 1)
          const typeOn = (ty, t, t0, dur) => {
            const k = Math.floor(clamp((t - t0) / dur) * ty.n + 1e-6)
            ty.spans.forEach((sp, i) => sp.setAttribute('display', i < k ? 'inline' : 'none'))
          }

          L.clock(tl, D, (t) => {
            cam.apply(t)
            dust(S0 + t)
            const boxes = [tavi9(t), merc10(t), merc11(t), tavi11(t)].filter(Boolean)
            const uS = P(t, A.slide, SLIDE)
            const w = uS, s0 = 2 * uS
            const blue = 1 - P(t, A.blueOff, 0.4)
            // the staircase dims to 20 % (its names leave as chips) and returns to full as the chips land
            const stA = 1 - 0.8 * P(t, A.top, 0.4) + 0.8 * P(t, A.full, 0.4)
            st.draw({
              w, s0, a: stA,
              rows: { keep: { boxes, cam, t } },
              stair: (n) => {
                const names = [{ text: SOL[n - 1], a: nameA(n, t) }]
                if (blue > 0.002) return { lit: blue, color: 'blue', names }
                return { lit: litC(n, t), color: 'chrome', names }
              },
              riser: (n) => ({ state: SEMI(n) ? 'semi' : 'tone', scale: n === 7 ? L.pulse(t, GROW, 'bar') : 1 }),
              houses: {
                bottom: { a: P(t, A.blueOff, 0.4), lit: 1, scale: L.pulse(t, A.isHome, 0.12) },
                top: { a: 1, lit: 1, glow: L.env(t, A.dohHome, 0.3, 0.4, 0.6), scale: L.pulse(t, A.isHome + 0.08, 0.12) },
              },
            })
            {
              const x = ST.riserX(7, w), y0 = ST.tread(8, s0), y1 = ST.tread(7, s0)
              goldGlow.setAttribute('x', f1(x - 9)); goldGlow.setAttribute('y', f1(y0 - 6)); goldGlow.setAttribute('height', f1(y1 - y0 + 12))
              goldGlow.setAttribute('opacity', (0.6 * Math.max(...GROW.map((g) => L.env(t, g, 0.15, 0.2, 0.6)))).toFixed(3))
            }
            kb.draw({
              key: (m) => {
                const inS = lerp(CMAJ.includes(m) ? 1 : 0, DMAJ.includes(m) ? 1 : 0, uS)
                return {
                  full: inS, lit: ST.isBlack(m) ? inS : 0,
                  scale: m === 13 ? L.pulse(t, A.teeCs, 'key') : m === 2 ? L.pulse(t, A.fromD, 'key') : 1,
                  names: m === 13 ? [{ text: 'C♯', a: P(t, A.teeCs, 0.25) * (1 - P(t, A.allOut, 0.2)), dy: 10 * (1 - P(t, A.teeCs, 0.45, 'power2.out')) }] : [],
                }
              },
              hair: { a: 1, w, s0 },
            })

            // 11a: the probe bead with its "?" (bobbing 8 px on a 1.2 s cycle from film time), its echo, its pulse
            {
              const pa = P(t, A.oneMore, 0.2) * (1 - P(t, A.top, 0.3))
              const bob = 4 * Math.sin((2 * Math.PI * (S0 + t)) / 1.2)
              const sc = L.ease('back.out(2)')(clamp((t - A.oneMore) / 0.35)) * L.pulse(t, A.finished, 'bead')
              probeG.setAttribute('opacity', pa.toFixed(3))
              L.bead4.place(probe, pa > 0.004 ? { x: 1420, y: 420 + bob, scale: Math.max(0.01, sc) } : null)
            }
            // the axis and its labels draw on "rated"; with the shelves they fade as the chips fly back
            const expOut = 1 - P(t, A.o11, 0.4)
            axis.draw(P(t, A.rated, 0.6, 'power2.inOut'), (t >= A.rated ? 1 : 0) * expOut)
            leastT.setAttribute('opacity', (P(t, A.rated + 0.05, 0.2) * expOut).toFixed(3))
            bestT.setAttribute('opacity', (P(t, A.rated + 0.5, 0.2) * expOut).toFixed(3))
            shelves.forEach((el, k) => {
              el.setAttribute('y', f1(shelfY(k, t) - 1))
              el.setAttribute('width', f1(880 * P(t, A.top + 0.05 * k, 0.45, 'power2.out')))
              el.setAttribute('opacity', ((t >= A.top ? 1 : 0) * expOut).toFixed(3))
            })
            for (const c of CHIPS) {
              const s = chipAt(c, t)
              if (!s) { c.el.g.setAttribute('opacity', '0'); continue }
              const sc = s.s * (t >= c.out + FLY && t < c.back ? tierPulse(c.tier, t) : 1)
              c.el.g.setAttribute('opacity', s.a.toFixed(3))
              c.el.box.setAttribute('opacity', s.box.toFixed(3))
              if (!c.dim) {
                const k = Math.max(c.tier < 3 ? light(t, TIERL[c.tier], 0.3, 0.5) : 0, c.tier === 0 ? light(t, DOL) : 0)
                c.el.box.setAttribute('fill', k > 0.002 ? `rgb(${[27, 35, 45].map((v, i) => Math.round(lerp(v, [195, 204, 214][i], 0.4 * k))).join(',')})` : UNLIT)
              }
              c.el.g.setAttribute('transform', `translate(${f1(s.p[0])} ${f1(s.p[1])}) scale(${sc.toFixed(4)})`)
            }
            {
              // it falls 70 px from "seems" (accelerating, as a drop) and lands on "learned"
              const u = P(t, A.seemsB, A.learned - A.seemsB, 'power2.in')
              shelfHouse.draw({ x: 916, y: shelfY(0, t) - 2 - 52 - 70 * (1 - u), a: P(t, A.seemsB, 0.2) * expOut, lit: 1, scale: tierPulse(0, t) })
            }
            // 11e and 11f: "leading note" (in on "leading", rising 14 px; scaling 1.2 on "note"), riding the slide;
            // the arrow (drawn on "leading to", pulsing on "leads", drawn again on "leans")
            {
              const out = 1 - P(t, A.allOut, 0.2)
              const dx = 120 * w, dy = -26 * s0 + 14 * (1 - P(t, A.leading, 0.45, 'power2.out'))
              const sc = L.pulse(t, A.noteW, 'label')
              const cx = 660 + leadW / 2
              leadT.setAttribute('opacity', (P(t, A.leading, 0.2) * out).toFixed(3))
              leadT.setAttribute('transform', `translate(${f1(dx + cx)} ${f1(dy + 278)}) scale(${sc.toFixed(4)}) translate(${f1(-cx)} -278)`)
              const p = t < A.leans ? P(t, A.leadingTo, 0.6, 'power2.inOut') : Math.max(1 - P(t, A.leans, 0.12, 'power2.in'), P(t, A.leans + 0.12, 0.5, 'power2.inOut'))
              arrow.draw(p, out, arrowAt(w, s0), { scale: L.pulse(t, A.leads, 'label') })
            }
            // the probe's echo (screen space, over everything)
            {
              const pp = cam.map(1420, 420, t)
              echo.draw(t, [{ t: A.note, x: pp[0], y: pp[1], r: 22 * cam.scale(t) }])
            }

            // frame-fixed type
            kicker.draw(t, A.kickIn, A.o11)
            credit1.setAttribute('opacity', (P(t, A.kickIn, 0.2) * (1 - P(t, A.o11, 0.2))).toFixed(3))
            credit1.setAttribute('transform', `translate(${f1(-18 * (1 - P(t, A.kickIn, 0.45, 'power3.out')))} 0)`)
            typeOn(credit2, t, A.later, 1.4)
            typeOn(credit3, t, A.without, 1.4)
            for (const c of [credit2, credit3]) c.el.setAttribute('opacity', (1 - P(t, A.o11, 0.2)).toFixed(3))
            answer.forEach((lab, i) => {
              const t0 = i === 0 ? A.learnedO : A.oneShort
              const u = P(t, t0, 0.45, 'power2.out')
              lab.g.setAttribute('opacity', (P(t, t0, 0.2) * (1 - P(t, A.labelsOut, 0.2))).toFixed(3))
              const sc = L.pulse(t, A.seems + 0.1 * i, 0.08)
              const y = 320 + 80 * i - 17
              lab.g.setAttribute('transform', `translate(1250 ${f1(y + 12 * (1 - u))}) scale(${sc.toFixed(4)}) translate(-1250 ${-y})`)
              lab.glow.setAttribute('opacity', (0.7 * L.env(t, A.seems + 0.1 * i, 0.3, 0.5, 0.6)).toFixed(3))
            })
            {
              const u = P(t, A.oneShort + 0.1, 0.5, 'power2.inOut')
              hair.setAttribute('x2', f1(lerp(1240, 1084, u))); hair.setAttribute('y2', f1(lerp(383, 365, u)))
              hair.setAttribute('opacity', ((t >= A.oneShort + 0.1 ? 1 : 0) * (1 - P(t, A.labelsOut, 0.2))).toFixed(3))
            }
            {
              const u = P(t, A.teeCs, 0.45, 'power2.out')
              tiCs.draw({ px: 1360, py: 300 + 12 * (1 - u), alpha: P(t, A.teeCs, 0.2) * (1 - P(t, A.allOut, 0.2)) })
            }
          })
          window.__timelines = window.__timelines || {}
          window.__timelines[SID] = tl
        })()
      </script>
    </div>
  </body>
</html>
