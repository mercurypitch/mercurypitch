      <script>
        ;(function () {
          /* S13, Your turn (STORYBOARD rows 13a to 13d; HANDOFFS § S12 to S13, § The guide in S13, § The care block,
             § S13d's reverse tip, § E to F; DECISIONS 96). In: S12's guide, every segment lit, the orange bead parked
             on do's segment, "wait", the arrow, the chip and the house; both Mercs at 360. Out (E to F, fixed): F0;
             the staircase on C at full, names, both houses lit, risers unmeasured; the strip with C major's keys,
             hairlines; Merc (110, 840) and Tavi (1800, 840) at 300. Nothing here listens: no microphone, no ring
             timer, no listening Merc, nothing of the app's drawing from "Now you". The guide the viewer sings to: S12's
             amber band thins and cools in place into the plain path (6 px chrome at 70 %), on lanes with no rules,
             the eight named ones faint fills; the segment under the cursor at full with its glow. The reverse tip
             (the lab's curves): from inside the type's fade the lanes narrow onto C's rows and the segments onto C's
             treads; the blocks grow down from them as they land, stair 1's once Merc is clear of it, the names riding
             the growing foot, as S12a's blocks folded up into theirs; then the rows above, the strip, the names and
             the houses, all still about 0.3 s before the cut. */
          const SID = 's13-your-turn'
          const D = L.dur(SID)
          const at = (cue, edge, off) => L.at(SID, cue, edge, off)
          const word = (line, which, edge, off) => L.word(SID, line, which, edge, off)
          const root = document.getElementById(SID + '-scene')
          const room = L.room(root, { floor: false })
          const S0 = L.scene(SID).start
          const tl = gsap.timeline({ paused: true })
          const ST = L.ST, P = L.prog, clamp = L.clamp, lerp = L.lerp, C = L.C
          const f1 = (v) => (Math.round(v * 100) / 100).toString()
          const CMAJ = ST.scale(0)
          const SOL = ['do', 're', 'mi', 'fa', 'so', 'la', 'ti', 'do']

          /* ---------------------------------------------------------------- anchors */
          const A = {
            now: word('b41', 'Now'),                          // 13a: S12's marks leave (0.3 s); the band thins into the path (0.6 s)
            move: at('b41', 'start', 0.08),                   // the guide moves to the right half (0.9 s, power2.inOut)
            sore: word('b41', 'Sore,'),
            just: word('b41', 'Just'),                        // "Just listen along."
            sing: word('b42', 'sing'),                        // 13b: "do, re, mi or ooh,"
            doh: word('b42', 'doh,'), ray: word('b42', 'ray,'), mee: word('b42', 'mee,'),   // each lane's name lights as it is said
            otherwise: word('b42', 'Otherwise,'), otherEnd: word('b42', 'Otherwise,', 'end'),   // a light runs the plain path, do to do, over the word
            atAbout: word('b42', 'at about'),                 // "at about speaking volume"
            volume: word('b42', 'volume.'),                   // the line "at about speaking volume" swells 1.05 while Merc draws
            volEnd: word('b42', 'volume.', 'end'),            //   the word out (9.45 to 10.52 in scene time), easing back as it ends
            note: word('b42', 'note,'),                       // "Start on my note,": a light runs along do's segment
            upW: word('b42', 'up.'),                          // "or an octave up.": a light runs along the top do's segment
            start: word('b42', 'Start'),                      // "Start on D3, or D4 an octave up"; the do lane's name lights
            octave: word('b42', 'octave'),                    // "or an octave up": the top do's name lights
            waitW: word('b43', 'Wait'),                       // "wait on ti"; the hold's segment glows
            teeW: word('b43', 'tee,'),                        // ti's name lights
            goW: word('b43', 'go.'),                          // "where it wants to go": the top do's segment glows
            stop: word('b44', 'Stop'),                        // the stop line, carried whole
            immediately: word('b44', 'immediately'),          // the stop line scales 1.05 (long settle) as he stresses it
            ci: at('count-in'),                               // 13c: the count-in's bead lands
            yt: at('your-turn'), ytEnd: at('your-turn', 'end'),
            tiYT: at('your-turn', 'start', 4.8),              // the cursor reaches the hold: "wait on ti" scales 1.2
            mercs: at('your-turn', 'end', 0.16),              // 13d: Merc moves to his recap corner (1.2 s)
            rev: at('your-turn', 'end', 0.10),                // the reverse tip, from inside the type's fade (0.9 s)
          }
          A.plain = A.now + 0.3                               // the fills replace the lane rules, once S12's marks have gone (0.3 s)
          A.title = A.move + 0.55                             // "Your turn.", once the moving names have passed under it
          A.care = Math.max(A.sore, A.title + 0.3)            // the first care lines, 0.3 s after the title
          A.doctor = A.move + 0.9                             // the doctor lines, once the guide has stopped
          // the breath (DECISIONS 96): the tip 403.94 to 404.84; the blocks grow 0.5 s each from 404.56 (stair 1's
          // once Merc's body is 20 px clear of it, 404.66 to 405.16); then the rows above (404.68), the strip (404.72,
          // its hairlines 404.92), the names (404.88) and the houses (404.94), overlapping; all still by 405.16
          const REV = 0.9, GROW = A.rev + 0.62, GD = 0.5
          const ABOVE = A.rev + 0.74, STRIP = A.rev + 0.78, STRIPD = 0.4, NAMES = A.rev + 0.94, HOUSES = A.rev + 1.0
          const STILL = A.rev + 1.22
          // Merc's move to his corner (404.0 to 405.2): a soft start, most of the way early, a long settle (6p^2 -
          // 8p^3 + 3p^4: no speed at either end), so he clears stair 1 by 404.66 (power2.inOut cleared it at 404.73)
          const breath = (t) => { const p = clamp((t - A.mercs) / 1.2); return p * p * (6 - 8 * p + 3 * p * p) }

          /* ---------------------------------------------------------------- the guide (HANDOFFS § Inside E) */
          const RUN = 8.6, ON = [0, 0.8, 1.6, 2.4, 3.2, 4.0, 4.8, 7.4], OFF = [0.8, 1.6, 2.4, 3.2, 4.0, 4.8, 6.8, RUN]
          const px12 = (s) => 600 + 840 * s / RUN
          const LANE = ST.H
          const BL12 = [748, 656, 564, 518, 426, 334, 242, 196], BL13 = [711, 631, 551, 511, 431, 351, 271, 231]
          // S12's guide to S13's (x 600-1440 onto 1060-1700, 46 px lanes onto 40 px) on the move's curve
          const uMove = (t) => P(t, A.move, 0.9, 'power2.inOut')
          const X = (x, u) => lerp(x, 1060 + (x - 600) * 640 / 840, u)
          const Y = (y, u) => lerp(y, 700 - 40 * (737 - y) / 46, u)
          // S13's lanes onto C's rows (lane k onto row k), on the reverse tip's curve
          const vRev = (t) => P(t, A.rev, REV, 'power2.inOut')
          const laneTop = (k, u, v) => lerp(Y(760 - 46 * (k + 1), u), ST.rowTop(k), v)
          const laneBot = (k, u, v) => lerp(Y(760 - 46 * k, u), ST.rowBot(k), v)
          // a segment, S12 to S13 to C's tread (h: its height: S12's band 14, the plain path 6, a tread 3)
          const segAt = (n, u, v, h) => {
            const x0 = X(px12(ON[n - 1]), u), x1 = X(px12(OFF[n - 1]), u), cy = Y(737 - 46 * LANE[n - 1], u)
            const cx = ST.colX(n, 0)
            return { xa: lerp(x0, cx - 52.5, v), xb: lerp(x1, cx + 52.5, v), y: lerp(cy - h / 2, ST.tread(n, 0), v), h }
          }

          /* ---------------------------------------------------------------- the world (mid layer) */
          const cam = L.frameRig(room, { from: 'F0' })
          const mid = L.stage(room.mid)
          const defs = L.svg('defs', {}, mid)
          const blurF = (id, sd) => { const f = L.svg('filter', { id: SID + id, x: '-60%', y: '-300%', width: '220%', height: '700%' }, defs); L.svg('feGaussianBlur', { stdDeviation: sd }, f); return `url(#${SID + id})` }
          // the semitone rows as the kit draws them (stairs.js, with its keep-out mask), placed per frame: S12's lanes,
          // S13's, then C's rows; the lines turn chrome for the plain guide and back
          const rows = (() => {
            const mask = L.svg('mask', { id: SID + '-keep', maskUnits: 'userSpaceOnUse', x: -4000, y: -4000, width: 10000, height: 10000 }, defs)
            L.svg('rect', { x: -4000, y: -4000, width: 10000, height: 10000, fill: '#fff' }, mask)
            const blur = L.svg('filter', { id: SID + '-kblur', filterUnits: 'userSpaceOnUse', x: 0, y: 0, width: 1, height: 1 }, defs)
            L.svg('feGaussianBlur', { stdDeviation: 17.6 }, blur)
            const holes = L.svg('g', { filter: `url(#${SID}-kblur)` }, mask)
            const holeRects = [0, 1, 2].map(() => L.svg('rect', { fill: '#000', display: 'none' }, holes))
            const g = L.svg('g', { mask: `url(#${SID}-keep)` }, mid)
            const bands = [], lines = []
            for (let k = 0; k <= 19; k++) {
              bands.push(L.svg('rect', { fill: '#e6edf3', 'fill-opacity': ST.blackRow(k) ? 0.06 : 0.025 }, g))
              lines.push(L.svg('rect', { height: 1, fill: '#e6edf3', 'fill-opacity': 0.06 }, g))
            }
            lines.push(L.svg('rect', { height: 1, fill: '#e6edf3', 'fill-opacity': 0.06 }, g))
            const set = (el, o) => { for (const k in o) el.setAttribute(k, o[k]) }
            return (band, line, boxes, show = true) => {
              g.setAttribute('display', show ? 'inline' : 'none')
              if (!show) return
              bands.forEach((el, k) => { const b = band(k); set(el, { x: f1(b.x0), width: f1(b.x1 - b.x0), y: f1(b.y0), height: f1(b.y1 - b.y0), opacity: b.a.toFixed(3), 'fill-opacity': b.fo.toFixed(4) }) })
              lines.forEach((el, k) => { const b = line(k); set(el, { x: f1(b.x0), width: f1(b.x1 - b.x0), y: f1(b.y - 0.5), opacity: b.a.toFixed(3), fill: b.fill, 'fill-opacity': b.fo.toFixed(3) }) })
              const u = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity }
              holeRects.forEach((el, i) => {
                const b = boxes[i]
                if (!b) { el.setAttribute('display', 'none'); return }
                const ax = b.x0 - 50, ay = b.y0 - 50, bx = b.x1 + 50, by = b.y1 + 50
                el.removeAttribute('display')
                set(el, { x: f1(ax), y: f1(ay), width: f1(bx - ax), height: f1(by - ay) })
                u.x0 = Math.min(u.x0, ax); u.y0 = Math.min(u.y0, ay); u.x1 = Math.max(u.x1, bx); u.y1 = Math.max(u.y1, by)
              })
              holes.setAttribute('display', boxes.length ? 'inline' : 'none')
              if (boxes.length) set(blur, { x: f1(u.x0 - 70.4), y: f1(u.y0 - 70.4), width: f1(u.x1 - u.x0 + 140.8), height: f1(u.y1 - u.y0 + 140.8) })
            }
          })()
          const st = L.stairs(mid, {})
          st.stairs.forEach((S, i) => S.names.prepare([SOL[i]]))
          const kb = L.strip(mid, {})
          const gGuide = L.svg('g', {}, mid)
          // the fills: the eight lanes a note of the scale sits on (lanes 0, 2, 4, 5, 7, 9, 11, 12), chrome at 6 %, each
          // inset 2 px top and bottom, so mi and fa, ti and do, show a 4 px gap; the other five lanes empty
          const FILL = [0, 2, 4, 5, 7, 9, 11, 12]
          const fills = FILL.map(() => L.svg('rect', { fill: C.chrome, 'fill-opacity': 0.06 }, gGuide))
          const glowTi = L.svg('rect', { rx: 8, fill: C.chrome, opacity: 0, filter: blurF('-g1', 7) }, gGuide)
          const glowDo = L.svg('rect', { rx: 8, fill: C.chrome, opacity: 0, filter: blurF('-g2', 7) }, gGuide)
          // the segment under the cursor: the cursor's soft glow (chrome at 30 %, blurred 6) around it
          const gLitGlow = L.svg('g', { filter: blurF('-lit', 6) }, gGuide)
          const litGlow = [1, 2, 3, 4, 5, 6, 7, 8].map(() => L.svg('rect', { fill: C.chrome, 'fill-opacity': 0 }, gLitGlow))
          // the path: S12's band (amber, 14 px, lit) thinning and cooling in place into the plain path (solid chrome,
          // 6 px at 70 %), which becomes the treads of the staircase on C (3 px)
          // (S12 draws its band twice, at 35 % and lit over it; the 35 % layer stays under the path while it cools, so
          // the segments' edges match across the cut)
          const under = [1, 2, 3, 4, 5, 6, 7, 8].map(() => L.svg('rect', { fill: '#f59e0b', 'fill-opacity': 0.35 }, gGuide))
          const path = [1, 2, 3, 4, 5, 6, 7, 8].map(() => L.svg('rect', {}, gGuide))
          // a light running along the plain path's segments (as S12's sweeps run along its band): a mask window `w`
          // px wide over white copies of the segments and a soft glow under them, placed where the guide has stopped
          const sweep = (id, ns, w) => {
            const gr = L.svg('linearGradient', { id: SID + id + 'g', gradientUnits: 'userSpaceOnUse', x1: 0, x2: w, y1: 0, y2: 0 }, defs)
            ;[[0, 0], [0.5, 1], [1, 0]].forEach(([o, a]) => L.svg('stop', { offset: o, 'stop-color': '#fff', 'stop-opacity': a }, gr))
            const mk = L.svg('mask', { id: SID + id, maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: 1920, height: 1080 }, defs)
            const r = L.svg('rect', { x: 0, y: 0, width: w, height: 1080, fill: `url(#${SID + id}g)` }, mk)
            const g = L.svg('g', { mask: `url(#${SID + id})`, opacity: 0 }, gGuide)
            const glow = L.svg('g', { filter: blurF(id + 'b', 5), opacity: 0.8 }, g)
            for (const n of ns) {
              const sg = segAt(n, 1, 0, 6)
              L.svg('rect', { x: f1(sg.xa - 4), y: f1(sg.y - 5), width: f1(sg.xb - sg.xa + 8), height: 16, rx: 8, fill: C.chrome }, glow)
              L.svg('rect', { x: f1(sg.xa), y: f1(sg.y), width: f1(sg.xb - sg.xa), height: 6, rx: 3, fill: '#ffffff' }, g)
            }
            return (x, a) => { const hx = x - w / 2; r.setAttribute('x', f1(hx)); gr.setAttribute('x1', f1(hx)); gr.setAttribute('x2', f1(hx + w)); g.setAttribute('opacity', a.toFixed(3)) }
          }
          const sweepAll = sweep('-sw1', [1, 2, 3, 4, 5, 6, 7, 8], 160)
          const sweepDo = sweep('-sw2', [1], 90), sweepTop = sweep('-sw3', [8], 90)
          // the lane names, travelling with the move, then the film's plain guide's (ink-2)
          const names = SOL.map((s) => L.svg('text', { 'text-anchor': 'end', fill: C.ink2, style: "font: 600 32px 'Outfit', sans-serif", text: s }, mid))
          const waitT = L.svg('text', { x: 1166, y: 196, 'text-anchor': 'middle', fill: C.ink, style: "font: 600 40px 'Outfit', sans-serif", text: 'wait' }, mid)
          // S12's ink arrow (the hold's end up onto do's segment), riding the move as it leaves
          const arrow = (() => {
            const g = L.svg('g', {}, mid)
            const shaft = L.svg('path', { fill: 'none', stroke: C.ink, 'stroke-width': 3, 'stroke-linecap': 'round' }, g)
            const tip = L.svg('path', { fill: 'none', stroke: C.ink, 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g)
            const Q0 = [[1276, 200], [1294, 150], [1320, 170]]   // S12's arrow (DECISIONS 101)
            return (a, u) => {
              if (a <= 0.004) { g.setAttribute('opacity', '0'); return }
              const Q = Q0.map(([x, y]) => [X(x, u), Y(y, u)])
              const qb = (s) => [0, 1].map((i) => (1 - s) * (1 - s) * Q[0][i] + 2 * s * (1 - s) * Q[1][i] + s * s * Q[2][i])
              let d = ''
              for (let i = 0; i <= 20; i++) { const q = qb(i / 20); d += (i ? 'L' : 'M') + f1(q[0]) + ' ' + f1(q[1]) }
              shaft.setAttribute('d', d)
              const e = qb(1), e0 = qb(0.95), ang = Math.atan2(e[1] - e0[1], e[0] - e0[0])
              const hx = (k) => e[0] - 14 * Math.cos(ang + k), hy = (k) => e[1] - 14 * Math.sin(ang + k)
              tip.setAttribute('d', `M${f1(hx(0.5))} ${f1(hy(0.5))} L${f1(e[0])} ${f1(e[1])} L${f1(hx(-0.5))} ${f1(hy(-0.5))}`)
              g.setAttribute('opacity', a.toFixed(3))
            }
          })()
          const beadO = L.bead(mid, { r: 22, color: C.orange })
          const beadB = L.bead(mid, { r: 22, color: C.blue })
          // the cursor: a vertical chrome line, 4 px with a soft glow, spanning the lanes (y 200 to 720)
          const cursor = L.svg('g', { opacity: 0 }, mid)
          {
            const f = L.svg('filter', { id: SID + '-cur', x: '-300%', y: '-10%', width: '700%', height: '120%' }, defs)
            L.svg('feGaussianBlur', { stdDeviation: 6 }, f)
          }
          L.svg('rect', { x: -7, y: 186, width: 14, height: 548, rx: 7, fill: C.chrome, 'fill-opacity': 0.3, filter: `url(#${SID}-cur)` }, cursor)
          L.svg('rect', { x: -2, y: 190, width: 4, height: 540, rx: 2, fill: C.chrome }, cursor)
          const dust = L.filmDust(room.near)

          /* ---------------------------------------------------------------- the Mercs (top layer, screen space) */
          // m12 spans the cut: the gate shows both at once; each frame poses the box (and its reflection and floor
          // patch) at its size and feet point (front view, feet at 0.81 of the square)
          const MERC = [
            { tag: SID + '-m12-blue', pass: 'm12-blue', x0: 240, s0: 360 },
            { tag: SID + '-m12-orange', pass: 'm12-orange', x0: 1700, s0: 360 },
          ]
          MERC.forEach((m) => {
            m.gate = L.mercGate(room.top, { sid: SID, pass: m.pass, tag: m.tag, x: m.x0, size: m.s0, feet: 0.81 })
            m.box = document.getElementById(m.tag + '-box')
          })
          // Merc scales to 300 in place over the guide's move and moves to his corner in the breath; Tavi scales to 300
          // and moves to her corner (1800, 840) over the guide's move (her body 20 px or more from the lanes' end on
          // every frame: 164.6 - 144.1 u px) and stays there
          const poseAt = (i, t) => {
            const u = uMove(t)
            return i === 0 ? { x: lerp(240, 110, breath(t)), size: lerp(360, 300, u) } : { x: lerp(1700, 1800, u), size: lerp(360, 300, u) }
          }
          // stair 1's block grows only while Merc's body is 20 px or more clear of it (x 242 to 354)
          const CLEAR = (() => {
            for (let t = A.mercs; t < D; t += 0.001) if (L.mercBox(poseAt(0, t).x, 840, 300).x1 + 20 <= ST.colX(1, 0) - 56) return t
            return D
          })()
          const GS = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => n === 1 ? Math.max(GROW, CLEAR) : GROW)
          const pose = (m, { x, size }) => {
            if (!m.box) return
            const b = m.box.style
            b.left = f1(x - size / 2) + 'px'; b.top = f1(840 - 0.81 * size) + 'px'; b.width = f1(size) + 'px'; b.height = f1(size) + 'px'
            const r = m.box.querySelector('.refl-box')
            if (r) { r.style.width = f1(size) + 'px'; r.style.height = f1(size) + 'px'; r.style.top = f1(size * 1.62 - size) + 'px' }
            const patch = m.box.parentElement.firstElementChild
            if (patch && patch !== m.box) patch.style.left = f1(x - 110) + 'px'
          }

          /* ---------------------------------------------------------------- frame-fixed type (hud) */
          const hud = L.stageOf(room.hud)
          const chip = L.pill(room.hud, 'one octave up', { x: 600, y: 109, size: 30, anchor: 'start' })
          chip.label.style.font = "500 30px/1 'JetBrains Mono', monospace"
          // the care block's left edge: HANDOFFS's x 360 moved 20 px right, so Merc's talking arcs (which reach x 351)
          // keep 20 px or more from the doctor lines' ink
          const CX = 380
          const TXT = (text, y, style, fill = C.ink) => L.svg('text', { x: CX, y, fill, opacity: 0, style: style + ' white-space: pre;', text }, hud)
          const yours = TXT('Your turn.', 200, "font-family: 'Instrument Serif'; font-style: italic; font-size: 120px; letter-spacing: -0.01em;")
          const O32 = "font: 500 32px 'Outfit', sans-serif;", O40 = "font: 600 40px 'Outfit', sans-serif;", I30 = "font: 400 30px 'Inter', sans-serif;"
          // the care block (HANDOFFS § The care block), each part landing as Merc says it
          const CARE = [
            ['Sore, hoarse or unwell today?', 262, O32, A.care], ['Just listen along.', 302, O32, A.just],
            ['do, re, mi or ooh,', 352, O32, A.sing], ['at about speaking volume', 392, O32, A.atAbout],
            ['Start on D3, or D4 an octave up', 442, O32, A.start], ['wait on ti', 492, O40, A.waitW],
            ['Stop immediately if anything', 548, O40, A.stop], ['feels uncomfortable.', 592, O40, A.stop],
          ].map(([s, y, f, t0]) => ({ el: TXT(s, y, f), y, t0 }))
          const waitOnTi = CARE[5]
          // the doctor lines, carried whole (Inter 30 px, ink-2), broken as HANDOFFS breaks them within 560 px
          const DOCTOR = ['If hoarseness or discomfort lasts more', 'than a couple of weeks, see a doctor (a GP', "or an ear, nose and throat specialist). If it's", 'very painful, or breathing or swallowing is', 'hard, get help straight away.']
            .map((s, i) => ({ el: TXT(s, 640 + 37 * i, I30, C.ink2), y: 640 + 37 * i, t0: A.doctor }))

          const AMBER = [245, 158, 11], CHROME = [195, 204, 214]
          const rgb = (x, y, k) => `rgb(${x.map((c, j) => Math.round(lerp(c, y[j], k))).join(',')})`

          L.clock(tl, D, (t) => {
            cam.apply(t)
            dust(S0 + t)
            const u = uMove(t), v = vRev(t), reversing = t >= A.rev, settled = t >= STILL
            const boxes = MERC.map((m, i) => { const p = poseAt(i, t); pose(m, p); return m.gate(t) ? L.mercBox(p.x, 840, p.size) : null }).filter(Boolean)
            const marks = 1 - P(t, A.now, 0.3)                // S12's marks leave (372.94 to 373.24)
            const hb = P(t, A.now, 0.6)                       // S12's band thins and cools into the path (372.94 to 373.54)
            const fillA = P(t, A.plain, 0.3) * (1 - P(t, A.rev, 0.5))     // the fills: in after the marks, out in the tip
            const rowsA = reversing ? P(t, A.rev, 0.5) : 1 - P(t, A.plain, 0.3)   // the lane rules out, C's rows back in
            const typeOut = 1 - P(t, A.ytEnd, 0.4)            // the type, the names and the cursor leave together
            const above = P(t, ABOVE, 0.3)                    // rows C♯5 to G5 return above
            const grow = (n) => P(t, GS[n - 1], GD, 'power2.out'), blockA = (n) => P(t, GS[n - 1], 0.15)
            const nameA = P(t, NAMES, 0.25), houseA = P(t, HOUSES, 0.2)

            // the rows: S12's lanes leaving as the fills come in; in the tip, C's rows under the narrowing lanes
            // (the kit's own once the staircase is still)
            const rx0 = lerp(lerp(600, 1060, u), 220, v), rx1 = lerp(lerp(1440, 1700, u), 1680, v)
            const fo = (k) => (ST.blackRow(k) ? 0.06 : 0.025)
            rows(
              (k) => k <= 12
                ? { x0: rx0, x1: rx1, y0: laneTop(k, u, v), y1: laneBot(k, u, v), a: rowsA, fo: reversing ? fo(k) : fo(k + 2) }
                : { x0: rx0, x1: rx1, y0: ST.rowTop(k), y1: ST.rowBot(k), a: above, fo: fo(k) },
              (b) => b <= 13
                ? { x0: rx0, x1: rx1, y: lerp(Y(760 - 46 * b, u), ST.rowBot(b), v), a: rowsA, fill: '#e6edf3', fo: 0.06 }
                : { x0: rx0, x1: rx1, y: b === 20 ? ST.rowTop(19) : ST.rowBot(b), a: above, fill: '#e6edf3', fo: 0.06 },
              boxes, !settled && (rowsA > 0.004 || above > 0.004))
            // the fills on the moving lanes, narrowing with them as they fade in the tip
            fills.forEach((el, i) => {
              const k = FILL[i]
              el.setAttribute('display', fillA > 0.004 ? 'inline' : 'none')
              el.setAttribute('x', f1(rx0)); el.setAttribute('width', f1(rx1 - rx0))
              const y0 = laneTop(k, u, v) + 2, y1 = laneBot(k, u, v) - 2
              el.setAttribute('y', f1(y0)); el.setAttribute('height', f1(Math.max(0, y1 - y0)))
              el.setAttribute('opacity', fillA.toFixed(3))
            })

            // the staircase on C: only S12's house until the reverse tip; then the blocks grow down from the treads
            const TR = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => segAt(n, 1, v, lerp(6, 3, v)))
            const foot = ST.foot(0)
            const ftAt = (n) => lerp(TR[n - 1].y, foot, grow(n))
            const cxAt = (n) => (TR[n - 1].xa + TR[n - 1].xb) / 2
            const ride = (n) => ({ dx: cxAt(n) - ST.colX(n, 0), dy: TR[n - 1].y - ST.tread(n, 0) })
            st.draw({
              w: 0, s0: 0, a: 1,
              rows: { a: settled ? 1 : 0, keep: { boxes, cam, t } },
              stair: (n) => ({ a: blockA(n), names: [{ text: SOL[n - 1], a: nameA, dx: ride(n).dx, dy: ftAt(n) - foot }] }),
              riser: (n) => ({ a: Math.min(blockA(n), blockA(n + 1)), state: 'unmeasured' }),
              houses: reversing
                ? { bottom: { a: houseA, lit: 1, ...ride(1) }, top: { a: houseA, lit: 1, ...ride(8) } }
                : { top: { a: marks, lit: 1, dx: X(1381, u) - ST.colX(8, 0), dy: Y(116, u) - ST.houseBox(8, 0, 0).cy } },
            })
            if (reversing && !settled) {
              st.stairs.forEach((S, i) => {
                const r = TR[i], xa = r.xa - 3.5, xb = r.xb + 3.5, tr = r.y, ft = ftAt(i + 1), rr = Math.min(6, (ft - tr) / 2)
                S.block.setAttribute('d', `M${f1(xa)} ${f1(ft)} L${f1(xa)} ${f1(tr + rr)} Q${f1(xa)} ${f1(tr)} ${f1(xa + rr)} ${f1(tr)} L${f1(xb - rr)} ${f1(tr)} Q${f1(xb)} ${f1(tr)} ${f1(xb)} ${f1(tr + rr)} L${f1(xb)} ${f1(ft)} Z`)
                S.treadLine.setAttribute('stroke-opacity', '0')
              })
              st.risers.forEach((Rz, i) => {
                const lo = TR[i], hi = TR[i + 1], x = (lo.xb + hi.xa) / 2
                Rz.bar.setAttribute('x', f1(x - 2)); Rz.bar.setAttribute('y', f1(hi.y)); Rz.bar.setAttribute('height', f1(Math.max(0, lo.y - hi.y)))
              })
            }
            // the strip rises back from 240 px below (power3.out), its hairlines over its last 0.2 s
            const sIn = P(t, STRIP, STRIPD, 'power3.out')
            kb.draw({
              a: P(t, STRIP, 0.25), dy: 240 * (1 - sIn),
              key: (m) => ({ full: CMAJ.includes(m) ? 1 : 0 }),
              hair: { a: P(t, STRIP + STRIPD - 0.2, 0.2), w: 0, s0: 0 },
            })

            // S12's marks: the bead, "wait", the arrow, the chip and the house
            L.bead4.place(beadO, marks > 0.004 ? { x: X(1440 - 22, u), y: Y(185, u), a: marks } : null)
            waitT.setAttribute('opacity', marks.toFixed(3))
            waitT.setAttribute('transform', `translate(${f1(X(1166, u) - 1166)} ${f1(Y(196, u) - 196)})`)
            arrow(marks, u)
            chip.draw({ alpha: marks })

            // the path: S12's lit band thinning (14 to 6 px) and cooling (amber to chrome, full to 70 %) in place while
            // the guide moves; under the cursor a segment at full with the cursor's glow (0.1 s each way); in the tip,
            // onto C's treads (3 px), the kit's own tread lines once the staircase is still
            path.forEach((el, i) => {
              const n = i + 1
              under[i].setAttribute('display', hb < 1 ? 'inline' : 'none')
              if (settled) { el.setAttribute('display', 'none'); litGlow[i].setAttribute('fill-opacity', '0'); return }
              el.removeAttribute('display')
              const h = reversing ? lerp(6, 3, v) : lerp(14, 6, hb)
              const sg = reversing ? TR[i] : segAt(n, u, 0, h)
              const k = P(t, A.yt + ON[i], 0.1) * (1 - P(t, A.yt + OFF[i], 0.1))
              el.setAttribute('x', f1(sg.xa)); el.setAttribute('width', f1(sg.xb - sg.xa)); el.setAttribute('y', f1(sg.y)); el.setAttribute('height', f1(h))
              el.setAttribute('rx', f1(Math.min(h / 2, lerp(2, 3, hb))))
              if (hb < 1) for (const k2 of ['x', 'width', 'y', 'height', 'rx']) under[i].setAttribute(k2, el.getAttribute(k2))
              under[i].setAttribute('opacity', (1 - hb).toFixed(3))
              el.setAttribute('fill', rgb(AMBER, CHROME, hb)); el.setAttribute('fill-opacity', (lerp(1, 0.7, hb) + 0.3 * k).toFixed(3))
              const gl = litGlow[i]
              gl.setAttribute('x', f1(sg.xa - 5)); gl.setAttribute('width', f1(sg.xb - sg.xa + 10)); gl.setAttribute('y', f1(sg.y - 5)); gl.setAttribute('height', f1(h + 10))
              gl.setAttribute('rx', f1((h + 10) / 2)); gl.setAttribute('fill-opacity', (0.3 * k).toFixed(3))
            })
            // the lights along the plain path: do to do on "Otherwise,", do's segment on "my note,", the top do's on "up."
            {
              const s1 = segAt(1, 1, 0, 6), s8 = segAt(8, 1, 0, 6), dO = A.otherEnd - A.otherwise
              sweepAll(lerp(s1.xa - 80, s8.xb + 80, P(t, A.otherwise, dO, 'power1.inOut')), 0.9 * P(t, A.otherwise - 0.04, 0.08) * (1 - P(t, A.otherEnd - 0.06, 0.12)))
              sweepDo(lerp(s1.xa - 45, s1.xb + 45, P(t, A.note, 0.6, 'sine.inOut')), 0.9 * P(t, A.note - 0.04, 0.08) * (1 - P(t, A.note + 0.5, 0.12)))
              sweepTop(lerp(s8.xa - 45, s8.xb + 45, P(t, A.upW, 0.6, 'sine.inOut')), 0.9 * P(t, A.upW - 0.04, 0.08) * (1 - P(t, A.upW + 0.5, 0.12)))
            }
            // the plain path's glows: the hold's segment on "Wait on tee", the top do's on "where it wants to go"
            for (const [el, n, k] of [[glowTi, 7, L.light(t, A.waitW, 0.3, 0.9)], [glowDo, 8, L.light(t, A.goW, 0.3, 0.6)]]) {
              const sg = segAt(n, 1, 0, 6)
              el.setAttribute('x', f1(sg.xa - 6)); el.setAttribute('y', f1(sg.y - 7)); el.setAttribute('width', f1(sg.xb - sg.xa + 12)); el.setAttribute('height', 20)
              el.setAttribute('opacity', (0.8 * k).toFixed(3))
            }
            // the lane names: travelling with the move; do, re and mi light as Merc says them; the bottom do lights
            // on "Start on my note" and the top do on "or an octave up"; ti lights on "Wait on tee". Each eases back to
            // ink-2 0.65 s after its word starts, as every highlight on the guide does (DECISIONS 101: the do names had
            // stayed lit through the turn, and the top do, the run's end, read as "start here")
            const nameK = [
              L.light(t, [A.doh, A.start], 0.15, 0.5), L.light(t, A.ray, 0.15, 0.5), L.light(t, A.mee, 0.15, 0.5),
              0, 0, 0, L.light(t, A.teeW, 0.15, 0.5), L.light(t, A.octave, 0.15, 0.5),
            ]
            names.forEach((el, i) => {
              el.setAttribute('x', f1(lerp(556, 1040, u))); el.setAttribute('y', f1(lerp(BL12[i], BL13[i], u)))
              el.setAttribute('opacity', typeOut.toFixed(3))
              el.setAttribute('fill', `rgb(${[168, 179, 191].map((c, j) => Math.round(lerp(c, [230, 237, 243][j], nameK[i]))).join(',')})`)
            })
            // the count-in's bead: dropping onto do's segment (1090, 700), landing on the note, held 0.8 s, gone 0.2 s later
            {
              // the kit's drop lengthened to 0.35 s at its own pull (60 px in 0.2 s, so 184 px), falling through the
              // pause after "uncomfortable." (it held the frame 0.2 s before the bead appeared); x 1068 to 1112 keeps
              // clear of re's segment (from 1120) and 28 px of the names
              const DROP = 0.35
              const b = t < A.ci ? L.bead4.dropAt(t, A.ci, [1090, 700], { dur: DROP, h: 60 * (DROP / 0.2) ** 2 }) : { x: 1090, y: 700, a: 1 - P(t, A.ci + 0.8, 0.2), sx: L.bead4.squash(t, A.ci)[0], sy: L.bead4.squash(t, A.ci)[1] }
              L.bead4.place(beadB, t >= A.ci - DROP && t < A.ci + 1 ? b : null)
            }
            // the cursor sweeps the lanes in your-turn's time (74.42 px a second)
            cursor.setAttribute('opacity', (P(t, A.yt - 0.2, 0.2) * typeOut).toFixed(3))
            cursor.setAttribute('transform', `translate(${f1(1060 + 640 * clamp((t - A.yt) / RUN))} 0)`)

            // frame-fixed type: "Your turn." fades in rising 12 px; the care lines, "wait on ti" and the doctor lines
            // fade in where they sit (DECISIONS 104: small type that only rose a few px into place stepped a whole
            // pixel a frame as it settled at 60 fps, Chrome putting baselines on whole pixels)
            const land = (el, t0, y, rise = 0) => {
              el.setAttribute('opacity', (P(t, t0, 0.2) * typeOut).toFixed(3))
              el.setAttribute('y', f1(y + rise * (1 - P(t, t0, 0.45, 'power2.out'))))
            }
            land(yours, A.title, 200, 12)
            for (const c of CARE) if (c !== waitOnTi) land(c.el, c.t0, c.y)
            {
              // up over 0.3 s, eased in and out (E-03: up over 0.15 s, power2.out, it was full in 0.12 s, a punch on a
              // line asking for a moderate voice), held while the word lasts, back over its last 0.5 s (sine.in, so the
              // line is still moving as the word ends: the pause after it held the frame for 0.3 s); about its left
              // bottom, on its baseline (380, 392), so the baseline Chrome puts on whole pixels never moves (E-03's twitch)
              const sc = 1 + L.PULSE.tile * P(t, A.volume, 0.3, 'sine.inOut') * (1 - P(t, A.volEnd - 0.5, 0.5, 'sine.in')), cy = 392
              CARE[3].el.setAttribute('transform', `translate(${CX} ${cy}) scale(${sc.toFixed(4)}) translate(${-CX} ${-cy})`)
              const ss = L.pulse(t, A.immediately, 'tile', { long: true }), sy = 556
              for (const c of [CARE[6], CARE[7]]) c.el.setAttribute('transform', `translate(${CX} ${sy}) scale(${ss.toFixed(4)}) translate(${-CX} ${-sy})`)
            }
            {
              const sc = L.pulse(t, A.tiYT, 'label')
              land(waitOnTi.el, waitOnTi.t0, 492)
              // about its left bottom, on its baseline (380, 492): the edge stays where the block's edge is, and the
              // baseline Chrome puts on whole pixels never moves (about mid-height it stepped: E-03's 1 px twitch)
              waitOnTi.el.setAttribute('transform', `translate(${CX} 492) scale(${sc.toFixed(4)}) translate(${-CX} -492)`)
            }
            for (const c of DOCTOR) land(c.el, c.t0, c.y)
          })
          window.__timelines = window.__timelines || {}
          window.__timelines[SID] = tl
        })()
      </script>
    </div>
