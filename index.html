<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1117" />
    <!-- Apply the persisted preset before styles or the app bundle can paint.
         This intentionally duplicates only the tiny browser-chrome palette;
         theme-tokens.contract.test.ts keeps it aligned with the typed store
         and app.css. The full reactive source still lives in theme-store.ts. -->
    <script data-theme-prepaint>
      ;(() => {
        const chromeColors = {
          dark: '#0d1117',
          light: '#f3f4f6',
          midnight: '#0d1117',
          forest: '#1b2a1b',
          ocean: '#0b1a2c',
          cyberpunk: '#0e0e14',
          rose: '#1a1418',
          amber: '#1a1510',
          slate: '#141a22',
        }
        const isPreset = (value) =>
          Object.prototype.hasOwnProperty.call(chromeColors, value)
        const read = (key, fallback) => {
          try {
            return localStorage.getItem(key) || fallback
          } catch {
            return fallback
          }
        }
        const readPreset = (key, fallback) => {
          const value = read(key, fallback)
          return isPreset(value) ? value : fallback
        }

        const stored = readPreset('pitchperfect_theme', 'dark')
        const day = readPreset('pitchperfect_theme_auto_day', 'light')
        const night = readPreset('pitchperfect_theme_auto_night', 'dark')
        const source = read('pitchperfect_theme_source', 'manual')
        let active = stored

        if (source === 'system') {
          const dark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          active = dark ? night : day
        } else if (source === 'time') {
          const hour = new Date().getHours()
          active = hour >= 7 && hour < 19 ? day : night
        }

        document.documentElement.setAttribute('data-theme', active)
        document.documentElement.style.colorScheme =
          active === 'light' ? 'light' : 'dark'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', chromeColors[active])
      })()
    </script>
    <title>
      MercuryPitch — See Your Voice, Sing Karaoke, Improve Every Take
    </title>
    <meta
      name="description"
      content="See your vocal range and pitch accuracy, turn songs you own into Karaoke Night stages with synced lyrics and live pitch feedback, and sing together in Jam Rooms."
    />
    <meta
      name="keywords"
      content="karaoke night, vocal range test, voice mirror, singing practice, pitch training, live pitch feedback, jam rooms"
    />
    <meta name="author" content="MercuryPitch" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://mercurypitch.com/" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="MercuryPitch — See Your Voice, Sing Karaoke, Improve Every Take"
    />
    <meta
      property="og:description"
      content="Meet your voice in Voice Mirror, turn songs you own into Karaoke Night stages, and improve every take with live pitch feedback."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mercurypitch.com/" />
    <meta property="og:image" content="https://mercurypitch.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="MercuryPitch — live pitch feedback on a karaoke stage, every sung note drawn on screen."
    />
    <meta property="og:site_name" content="MercuryPitch" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="MercuryPitch — See Your Voice, Sing Karaoke, Improve Every Take"
    />
    <meta
      name="twitter:description"
      content="Meet your voice, turn songs you own into Karaoke Night stages, and improve every take with live pitch feedback."
    />
    <meta
      name="twitter:image"
      content="https://mercurypitch.com/og-image.png"
    />
    <!-- Icons: standardized names — swap the brand mark by replacing the files
         in public/. The current mark's masters are docs/branding/favicon/meniscus2/
         and docs/branding/logo/meniscus2/; rejected directions and the generation
         scripts live in ~/.dotfiles/personal/mercurypitch/branding/. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The opening backdrop races the JS bundle so the art is usually
         there for the app's first commit. Media-gated so a phone fetches
         only the portrait recomposition and a desktop only the wide one —
         the same tiers the <picture> in App.tsx chooses between. -->
    <link
      rel="preload"
      as="image"
      href="/opening/first-light-wide.webp"
      media="(min-aspect-ratio: 1/1)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/opening/first-light-tall.webp"
      media="(max-aspect-ratio: 1/1)"
      fetchpriority="high"
    />
    <link rel="preload" as="image" href="/brand-mark.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
